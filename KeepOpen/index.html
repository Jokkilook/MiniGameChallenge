<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>창을 닫지 마세요! · Keep The Window Open</title>
<style>
  :root{ --ink:#e9edf7; --muted:#9aa3c0; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#008080;color:var(--ink);
    font-family:"Segoe UI","Malgun Gothic",Tahoma,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55)}
  canvas{display:block;cursor:default}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:rgba(0,60,60,.55);opacity:0;visibility:hidden;transition:opacity .3s}
  .overlay.show{opacity:1;visibility:visible}
  /* retro window card */
  .win{width:min(460px,90%);background:#c0c0c0;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;
    box-shadow:2px 2px 0 #000;font-family:"Malgun Gothic",Tahoma,sans-serif}
  .win .bar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:800;font-size:13px;padding:4px 8px;display:flex;align-items:center;justify-content:space-between}
  .win .bar .x{width:16px;height:14px;background:#c0c0c0;border:1px solid #fff;border-right-color:#404040;border-bottom-color:#404040;color:#000;font-size:10px;text-align:center;line-height:12px}
  .win .body{padding:20px 20px 18px;text-align:center}
  .win h1{margin:0 0 4px;font-size:24px;color:#000;letter-spacing:.5px}
  .win .sub{font-size:11px;letter-spacing:3px;color:#000080;margin-bottom:12px;font-weight:700}
  .win p{color:#202020;font-size:13px;line-height:1.7;margin:10px 0 16px}
  .win p b{color:#000080}
  .btn95{cursor:pointer;font-weight:800;font-size:14px;padding:9px 22px;background:#c0c0c0;color:#000;
    border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;box-shadow:1px 1px 0 #000}
  .btn95:active{border-color:#404040;border-right-color:#fff;border-bottom-color:#fff}
  .big{font-size:30px;font-weight:900;color:#000080;font-variant-numeric:tabular-nums;margin:6px 0 12px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay show" id="startOv">
      <div class="win">
        <div class="bar"><span>🪟 창을 닫지 마세요! .exe</span><span class="x">✕</span></div>
        <div class="body">
          <h1>창을 닫지 마세요!</h1>
          <div class="sub">K E E P &nbsp; T H E &nbsp; W I N D O W &nbsp; O P E N</div>
          <p>캐릭터는 스스로 달린다. 너는 <b>창(윈도우) 자체</b>를 조작해 돕는다.<br>
             <b>창의 아래 테두리를 위아래로 드래그</b>해 바닥 높이를 바꿔,<br>
             다가오는 장애물의 <b>틈</b>에 캐릭터를 맞춰 통과시켜라.</p>
          <button class="btn95" id="startBtn">▶ 실행</button>
        </div>
      </div>
    </div>
    <div class="overlay" id="overOv">
      <div class="win">
        <div class="bar"><span>⚠️ system.error</span><span class="x">✕</span></div>
        <div class="body">
          <h1 id="overTitle">충돌!</h1>
          <div class="sub" id="overSub">CONNECTION LOST</div>
          <div class="big" id="overScore">0 m</div>
          <p style="font-size:12px">최고 <b id="overBest">0</b> m</p>
          <button class="btn95" id="retryBtn">↻ 다시 실행</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   창을 닫지 마세요! · Keep The Window Open — a META runner. Everything is
   rendered on ONE canvas as a fake retro-OS desktop + window. The runner
   lives inside the window; you drag the window's BOTTOM EDGE (the floor)
   up/down to raise/lower the character and thread it through gaps in the
   incoming obstacles. Distance = score. Deterministic, no libs.
   ============================================================ */
const AW=900, AH=620;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DPR=Math.max(1,Math.min(2,devicePixelRatio||1)), scale=1;

/* window geometry (fixed pos; bottom edge is the draggable floor) */
const WX=70, WY=70, WW=760, BAR=26, BW=6;
const WH_MIN=150, WH_MAX=470;
let wh=360;                    // window height (bottom edge follows)
function innerTop(){ return WY+BAR+BW; }
function innerBottom(){ return WY+wh-BW; }     // = floorY
function floorY(){ return innerBottom(); }
const CHX=WX+150, CHW=20, CHH=30;              // character screen-x, size
const FLOOR_MIN=()=>innerTopFixed()+CHH+6, FLOOR_MAX=()=>WY+WH_MAX-BW;
function innerTopFixed(){ return WY+BAR+BW; }

/* ---- state ---- */
let phase='intro', chY=0, chVY=0, dist=0, speed=190, obstacles=[], spawnX=0, best=+(localStorage.getItem('keepopen_best')||0);
let dragging=false, particles=[], glitch=0, resizeFx=0, tabPass=0;
let lastT=perf(); function perf(){return performance?performance.now():0;}

/* ---- audio ---- */
let AC=null,muted=false;
function ac(){ if(!AC){try{AC=new (AudioContext||webkitAudioContext)();}catch(e){}} return AC; }
function tone(f,d=0.06,t='sine',v=0.03,to){ if(muted)return; const a=ac();if(!a)return; const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.value=f;if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
  g.gain.value=0;o.connect(g);g.connect(a.destination);const n=a.currentTime;g.gain.linearRampToValueAtTime(v,n+0.006);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.start(n);o.stop(n+d+0.02); }
let lastResizeSnd=0;
const SFX={ resize(fy){ const n=perf(); if(n-lastResizeSnd<40)return; lastResizeSnd=n; tone(300+ (1-(fy-innerTopFixed())/(WH_MAX))*500,0.05,'square',0.012); },
  pass(){ tone(700,0.06,'triangle',0.03,980); }, tab(){ tone(880,0.1,'sine',0.04,1300); }, crash(){ tone(200,0.35,'sawtooth',0.06,60); setTimeout(()=>tone(120,0.3,'sawtooth',0.05,50),80); }, start(){ tone(520,0.1,'square',0.04,780); } };

/* ---- layout ---- */
function layout(){ scale=Math.min((Math.max(320,innerWidth)-12)/AW,(Math.max(240,innerHeight)-12)/AH,1.25);
  cv.style.width=(AW*scale)+'px'; cv.style.height=(AH*scale)+'px'; cv.width=Math.round(AW*scale*DPR); cv.height=Math.round(AH*scale*DPR); ctx.setTransform(scale*DPR,0,0,scale*DPR,0,0); }
addEventListener('resize',layout);

/* ---- obstacles ---- */
function reset(){ chY=floorY()-2; chVY=0; dist=0; speed=190; obstacles=[]; particles=[]; glitch=0; tabPass=0; wh=360; lastGapCenter=300; obsCount=0;
  let x=WX+WW+60; for(let i=0;i<5;i++){ spawnObstacle(x); x+=rand(300,360); } }
let lastGapCenter=300, obsCount=0;
function spawnObstacle(x){
  const gapH=Math.max(100, 150 - dist*0.003);
  const loC=FLOOR_MIN()-CHH/2+8, hiC=FLOOR_MAX()-CHH/2-8;      // reachable gap-center range
  const maxDelta=150;                                          // consecutive gaps must be traversable
  let center=lastGapCenter + rand(-maxDelta,maxDelta);
  center=Math.max(loC,Math.min(hiC,center)); lastGapCenter=center;
  obstacles.push({x, gy:center-gapH/2, gapH, passed:false, tab:(obsCount++%4===3)});
}
function rand(a,b){return a+Math.random()*(b-a);}

/* ---- input: drag the window's bottom edge ---- */
function ptr(e){ const r=cv.getBoundingClientRect(); return { x:((e.touches?e.touches[0].clientX:e.clientX)-r.left)/scale, y:((e.touches?e.touches[0].clientY:e.clientY)-r.top)/scale }; }
function nearBottom(p){ return p.x>WX-10 && p.x<WX+WW+10 && Math.abs(p.y-floorY())<44; }
function down(e){ if(phase!=='play')return; const p=ptr(e); if(nearBottom(p)){ dragging=true; setFloor(p.y); e.preventDefault(); } }
function move(e){ if(!dragging)return; const p=ptr(e); setFloor(p.y); e.preventDefault(); }
function up(){ dragging=false; }
function setFloor(y){ const ny=Math.max(FLOOR_MIN(), Math.min(FLOOR_MAX(), y)); wh=ny-WY+BW; resizeFx=1; SFX.resize(ny); }
cv.addEventListener('mousedown',down); addEventListener('mousemove',move); addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',up);

/* ---- update ---- */
function update(dt){
  dist+=speed*dt; speed=190+dist*0.02;
  // character eases toward the floor (window bottom)
  const target=floorY()-2; chY += (target-chY)*Math.min(1,dt*14);
  // move obstacles
  for(const o of obstacles) o.x-=speed*dt;
  // recycle + spawn (keep obstacles filling to the right, properly spaced)
  while(obstacles.length && obstacles[0].x < WX-40){ obstacles.shift(); }
  const lastO=obstacles[obstacles.length-1];
  if(!lastO || lastO.x < WX+WW+40){ spawnObstacle((lastO?lastO.x:WX+WW)+rand(300,360)); }
  // collision + pass
  const cTop=chY-CHH, cBot=chY;
  for(const o of obstacles){
    if(!o.passed && Math.abs(o.x-CHX)<(CHW/2+7)){
      // must be within gap [o.gy, o.gy+o.gapH]
      if(cTop>=o.gy && cBot<=o.gy+o.gapH){ /* passing through gap - ok */ }
      else { return crash(); }
    }
    if(!o.passed && o.x < CHX-CHW/2){ o.passed=true; if(o.tab){ tabPass=1; SFX.tab(); } else SFX.pass(); }
  }
  if(resizeFx>0)resizeFx-=dt*3; if(glitch>0)glitch-=dt; if(tabPass>0)tabPass-=dt;
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;}
}
function crash(){ phase='over'; glitch=0.6; SFX.crash();
  for(let k=0;k<24;k++)particles.push({x:CHX,y:chY-CHH/2,vx:rand(-1,1)*180,vy:rand(-1,1)*180,life:rand(0.4,0.9),r:rand(1,3),c:'255,80,80'});
  const m=Math.floor(dist/10); if(m>best){ best=m; localStorage.setItem('keepopen_best',m); }
  document.getElementById('overScore').textContent=m+' m'; document.getElementById('overBest').textContent=best;
  setTimeout(()=>document.getElementById('overOv').classList.add('show'),650);
}

/* ---- loop ---- */
function loop(t){ const dt=Math.min(0.05,(t-lastT)/1000); lastT=t; if(phase==='play')update(dt);
  else for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;}
  render(t); requestAnimationFrame(loop); }

/* ---- render ---- */
function render(t){ const tt=t/1000;
  // desktop
  ctx.fillStyle='#008080'; ctx.fillRect(0,0,AW,AH);
  // desktop icons (flavor)
  drawIcon(24,24,'📁','내 게임'); drawIcon(24,110,'🗑️','휴지통');
  // taskbar
  ctx.fillStyle='#c0c0c0'; ctx.fillRect(0,AH-30,AW,30); ctx.fillStyle='#fff';ctx.fillRect(0,AH-30,AW,2);
  ctx.fillStyle='#000'; ctx.font='bold 13px Malgun Gothic,sans-serif'; ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillStyle='#c0c0c0'; drawBevel(6,AH-25,86,20,true); ctx.fillStyle='#000'; ctx.fillText('🪟 시작',12,AH-15);
  ctx.textAlign='right'; ctx.fillText((phase==='play'?Math.floor(dist/10):0)+' m   🔊',AW-12,AH-15); ctx.textAlign='left';
  // the game window
  const gx=(glitch>0?(Math.random()-.5)*glitch*10:0);
  ctx.save(); ctx.translate(gx,0);
  // window frame
  ctx.fillStyle='#c0c0c0'; ctx.fillRect(WX,WY,WW,wh);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath();ctx.moveTo(WX,WY+wh);ctx.lineTo(WX,WY);ctx.lineTo(WX+WW,WY);ctx.stroke();
  ctx.strokeStyle='#404040'; ctx.beginPath();ctx.moveTo(WX+WW,WY);ctx.lineTo(WX+WW,WY+wh);ctx.lineTo(WX,WY+wh);ctx.stroke();
  // title bar
  const bg=ctx.createLinearGradient(WX,0,WX+WW,0); bg.addColorStop(0,'#000080'); bg.addColorStop(1,'#1084d0');
  ctx.fillStyle=bg; ctx.fillRect(WX+2,WY+2,WW-4,BAR-2);
  ctx.fillStyle='#fff'; ctx.font='bold 13px Malgun Gothic,sans-serif'; ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('🏃 runner.exe  —  거리 '+Math.floor(dist/10)+' m',WX+8,WY+BAR/2+1);
  // inner (sky) — clip to window interior
  ctx.save(); ctx.beginPath(); ctx.rect(WX+BW,innerTop(),WW-BW*2,floorY()-innerTop()); ctx.clip();
  const sky=ctx.createLinearGradient(0,innerTop(),0,floorY()); sky.addColorStop(0,'#bfe3ff'); sky.addColorStop(1,'#e9f6ff');
  ctx.fillStyle=sky; ctx.fillRect(WX,innerTop(),WW,floorY()-innerTop());
  // clouds
  for(let i=0;i<4;i++){ const cxp=WX+((i*220 - dist*0.15)% (WW+200)+WW+200)%(WW+200)-100; ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath();ctx.arc(cxp,innerTop()+30,16,0,6.283);ctx.arc(cxp+16,innerTop()+30,20,0,6.283);ctx.arc(cxp+34,innerTop()+30,14,0,6.283);ctx.fill(); }
  // obstacles (pipes with a gap)
  for(const o of obstacles){ const col=o.tab?'#1084d0':'#3aa34a';
    ctx.fillStyle=col; ctx.fillRect(o.x-7,innerTop(),14,o.gy-innerTop());            // top part
    ctx.fillRect(o.x-7,o.gy+o.gapH,14,floorY()-(o.gy+o.gapH));                        // bottom part
    ctx.fillStyle='rgba(0,0,0,.15)'; ctx.fillRect(o.x-7,o.gy-8,14,8); ctx.fillRect(o.x-7,o.gy+o.gapH,14,8);
    if(o.tab){ ctx.fillStyle='#0a4a80'; ctx.font='9px sans-serif';ctx.textAlign='center'; ctx.fillText('TAB',o.x,o.gy+o.gapH/2); }
  }
  // character (pixel runner) at fixed x, y follows floor
  drawRunner(CHX, chY, tt);
  ctx.restore(); // end inner clip
  // floor strip (grass) + draggable handle
  ctx.fillStyle='#7a5230'; ctx.fillRect(WX+BW,floorY(),WW-BW*2,Math.max(0,WY+wh-BW-floorY())+6);
  ctx.fillStyle='#5aa03a'; ctx.fillRect(WX+BW,floorY()-4,WW-BW*2,6);
  // bottom resize handle (hint the drag)
  const hcol=dragging?'#000080':'#404040';
  ctx.fillStyle='#c0c0c0'; ctx.fillRect(WX,WY+wh-BW,WW,BW);
  ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(WX,WY+wh-BW);ctx.lineTo(WX+WW,WY+wh-BW);ctx.stroke();
  // grip dots
  ctx.fillStyle=hcol; for(let i=-3;i<=3;i++){ ctx.fillRect(WX+WW/2+i*8-1,WY+wh-BW/2-1,2,2); }
  ctx.fillStyle=dragging?'#000080':'#606080'; ctx.font='bold 10px sans-serif';ctx.textAlign='center'; ctx.fillText('↕ 이 테두리를 드래그',WX+WW/2,WY+wh+9);
  ctx.restore();
  // particles
  ctx.save();ctx.globalCompositeOperation='lighter'; for(const p of particles){ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.fillStyle='rgb('+p.c+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}ctx.globalAlpha=1;ctx.restore();
  // glitch scanlines
  if(glitch>0){ ctx.fillStyle='rgba(255,255,255,'+(glitch*0.08)+')'; for(let y=(tt*300)%6;y<AH;y+=6)ctx.fillRect(0,y,AW,1); }
  if(tabPass>0){ ctx.fillStyle='rgba(16,132,208,'+(tabPass*0.15)+')'; ctx.fillRect(0,0,AW,AH); }
}
function drawRunner(x,y,tt){ const r=CHW/2; const run=Math.sin(tt*16)*3;
  ctx.fillStyle='#ff5a6e'; roundRect(x-r,y-CHH,CHW,CHH-6,4); ctx.fill();      // body
  ctx.fillStyle='#ffd0a0'; ctx.beginPath();ctx.arc(x,y-CHH+2,6,0,6.283);ctx.fill(); // head
  ctx.fillStyle='#333'; ctx.fillRect(x-r,y-6,6,6+run); ctx.fillRect(x+r-6,y-6,6,6-run); // legs
  ctx.fillStyle='#fff'; ctx.fillRect(x-1,y-CHH+1,2,2);
}
function drawIcon(x,y,em,label){ ctx.font='30px serif';ctx.textAlign='center';ctx.textBaseline='top'; ctx.fillText(em,x+24,y);
  ctx.fillStyle='#fff';ctx.font='11px Malgun Gothic,sans-serif'; ctx.fillText(label,x+24,y+36); }
function drawBevel(x,y,w,h){ ctx.fillRect(x,y,w,h); ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y);ctx.lineTo(x+w,y);ctx.stroke(); ctx.strokeStyle='#404040';ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.stroke(); }
function roundRect(x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }

/* ---- flow ---- */
function start(){ ac(); document.getElementById('startOv').classList.remove('show'); document.getElementById('overOv').classList.remove('show'); reset(); phase='play'; lastT=perf(); SFX.start(); }
document.getElementById('startBtn').onclick=start;
document.getElementById('retryBtn').onclick=start;

/* ---- boot ---- */
layout(); reset(); phase='intro'; requestAnimationFrame(loop);
</script>
</body>
</html>
