<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>한 번의 불꽃 · One Spark</title>
<style>
  :root{ --ink:#eef1ff; --muted:#8b90c4; --amber:#ffd27a; --amber2:#ff9e5e; --wisp:#9ff0ff; --hot:#ff6b5a; --mag:#c07bff; --panel:rgba(16,18,38,.92); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(120% 120% at 50% 0%,#161a30 0%,#06070d 72%);color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:8px}
  #stage{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04)}
  canvas{display:block;background:#07080f;border-radius:16px;cursor:crosshair}
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:18px;padding:12px 16px;z-index:5;pointer-events:none}
  .stat .k{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
  .stat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  #goal .v{color:var(--wisp)} #score .v{color:var(--amber)}
  #hud .spacer{flex:1}
  #lvl{font-size:13px;color:var(--muted)}
  #combo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);z-index:6;pointer-events:none;
    font-size:70px;font-weight:900;color:var(--amber);text-shadow:0 0 30px rgba(255,158,94,.6);transition:transform .12s}
  #combo.pop{transform:translate(-50%,-50%) scale(1)}
  #hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:var(--muted);font-size:13.5px;z-index:5;pointer-events:none;text-shadow:0 2px 10px #000}
  #hint b{color:var(--hot)}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:radial-gradient(60% 60% at 50% 45%,rgba(8,9,18,.5),rgba(4,5,11,.95));opacity:0;visibility:hidden;transition:opacity .35s}
  .overlay.show{opacity:1;visibility:visible}
  .card{width:min(560px,90%);background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:30px 30px 26px;text-align:center;box-shadow:0 26px 70px rgba(0,0,0,.55)}
  .card h1{margin:0;font-size:36px;letter-spacing:1px} .card h1 small{display:block;font-size:12px;letter-spacing:6px;color:var(--amber);margin-top:9px;font-weight:600}
  .card p{color:var(--muted);line-height:1.7;font-size:14px;margin:14px 0 16px}
  .legend{display:flex;gap:16px;justify-content:center;margin:12px 0 20px;font-size:12px;color:var(--muted)}
  .legend .d{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .cta{cursor:pointer;border:none;border-radius:12px;padding:13px 32px;font-size:15px;font-weight:800;letter-spacing:.5px;color:#221600;background:linear-gradient(180deg,var(--amber),var(--amber2));box-shadow:0 10px 30px rgba(255,158,94,.35);transition:.15s}
  .cta:hover{transform:translateY(-2px)}
  .tag{display:inline-block;color:var(--amber);font-size:12px;letter-spacing:3px;margin-bottom:6px}
  #resTitle{font-size:26px} #resSub{font-size:15px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="stat" id="goal"><div class="k">터뜨림</div><div class="v" id="goalV">0 / 0</div></div>
      <div class="spacer"></div>
      <div id="lvl">라운드 1</div>
      <div class="spacer"></div>
      <div class="stat" id="score"><div class="k">점수</div><div class="v" id="scoreV">0</div></div>
    </div>
    <div id="combo">0</div>
    <div id="hint"></div>

    <div class="overlay show" id="startOv">
      <div class="card">
        <span class="tag">ONE CLICK · CHAIN REACTION</span>
        <h1>한 번의 불꽃<small>O N E &nbsp; S P A R K</small></h1>
        <p>떠다니는 구슬 사이에 <b style="color:var(--hot)">딱 한 번</b> 불꽃을 터뜨려라.<br>
           하나가 터지면 옆이 터지고, 그게 또 옆을 — <b style="color:var(--amber)">연쇄 폭발</b>.<br>
           목표만큼 터뜨리면 통과. <b>어디에, 언제</b> 터뜨리냐가 전부다.</p>
        <div class="legend">
          <span><span class="d" style="background:#ffd27a"></span>기본</span>
          <span><span class="d" style="background:#ff6b5a"></span>큰 폭발</span>
          <span><span class="d" style="background:#c07bff"></span>자석(끌어당김)</span>
        </div>
        <button class="cta" id="startBtn">시작</button>
      </div>
    </div>
    <div class="overlay" id="resOv">
      <div class="card">
        <span class="tag" id="resTag">·</span>
        <h1 id="resTitle">·</h1>
        <p id="resSub">·</p>
        <button class="cta" id="resBtn">다음</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   한 번의 불꽃 · One Spark — one-click chain reaction.
   Drifting orbs; you place ONE spark; it pops orbs it touches, each of
   which bursts its own ring -> a cascade. Orb TYPES (big blast / magnet)
   make placement & timing strategic. Clear the target to advance.
   ============================================================ */
const AW=920, AH=600;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DPR=Math.max(1,Math.min(2,devicePixelRatio||1)), scale=1;

/* ---- types ---- */
const T={
  basic:{ col:'255,210,122', ring:104, life:1.1, weight:6 },
  big:  { col:'255,107,90',  ring:184, life:1.3, weight:2 },
  magnet:{col:'192,123,255', ring:124, life:1.2, weight:2, pull:true },
};
function pickType(){ const bag=[]; for(const k in T) for(let i=0;i<T[k].weight;i++) bag.push(k); return bag[(Math.random()*bag.length)|0]; }

/* ---- state ---- */
let phase='intro';   // intro|aim|cascade|result
let orbs=[], rings=[], particles=[];
let round=1, score=0, popped=0, target=0, sparkUsed=false;
let combo=0, comboT=0, slowmo=1, shake=0;
let best=+(localStorage.getItem('onespark_best')||0);

const els={ goalV:qs('goalV'), scoreV:qs('scoreV'), lvl:qs('lvl'), hint:qs('hint'), combo:qs('combo') };
function qs(id){return document.getElementById(id);}

/* ---- audio ---- */
let AC=null,muted=false;
function ac(){ if(!AC){try{AC=new (AudioContext||webkitAudioContext)();}catch(e){}} return AC; }
function tone(f,d=0.08,t='sine',v=0.04,to){ if(muted)return; const a=ac();if(!a)return; const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.value=f;if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
  g.gain.value=0;o.connect(g);g.connect(a.destination);const n=a.currentTime;g.gain.linearRampToValueAtTime(v,n+0.006);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.start(n);o.stop(n+d+0.02); }
function popSound(n){ tone(300+Math.min(1400,n*45),0.09,'triangle',0.04); }
const SFX={ spark(){tone(160,0.2,'sawtooth',0.05,90);}, win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'sine',0.05),i*90));}, lose(){tone(200,0.35,'sawtooth',0.05,80);} };

/* ---- layout ---- */
function layout(){ const vw=Math.max(320,innerWidth||AW), vh=Math.max(240,innerHeight||AH);
  scale=Math.min((vw-16)/AW,(vh-16)/AH); cv.style.width=(AW*scale)+'px'; cv.style.height=(AH*scale)+'px';
  cv.width=Math.round(AW*scale*DPR); cv.height=Math.round(AH*scale*DPR); ctx.setTransform(scale*DPR,0,0,scale*DPR,0,0); }
addEventListener('resize',layout);

/* ---- rounds ---- */
function roundConfig(r){ const n=Math.min(64,22+r*3); const pct=Math.min(0.85,0.42+r*0.04); return {n, target:Math.round(n*pct)}; }
function startRound(r){
  round=r; const cfg=roundConfig(r); target=cfg.target; popped=0; sparkUsed=false; combo=0;
  orbs=[]; rings=[]; particles=[]; slowmo=1;
  for(let i=0;i<cfg.n;i++){ const a=Math.random()*6.283, sp=rand(10,24);
    const ty=pickType();
    orbs.push({x:rand(60,AW-60),y:rand(70,AH-60),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:ty==='big'?15:12,type:ty,state:'alive',popT:0,ph:Math.random()*6.283}); }
  phase='aim';
  els.lvl.textContent='라운드 '+r; els.hint.innerHTML='<b>딱 한 번</b> 클릭 — 흐름을 읽고 최고의 순간에 터뜨려라';
  updateHUD();
  qs('resOv').classList.remove('show');
}
function updateHUD(){ els.goalV.textContent=popped+' / '+target; els.scoreV.textContent=score; }

/* ---- input ---- */
cv.addEventListener('click',e=>{
  if(phase!=='aim'||sparkUsed) return;
  const r=cv.getBoundingClientRect();
  const x=((e.clientX-r.left)/scale), y=((e.clientY-r.top)/scale);
  sparkUsed=true; phase='cascade'; combo=0; SFX.spark();
  addRing(x,y,'basic');
  els.hint.innerHTML='연쇄 폭발!';
});

/* ---- rings / cascade ---- */
function addRing(x,y,type){ const t=T[type]; rings.push({x,y,r:0,maxR:t.ring,t:0,life:t.life,type,pull:!!t.pull}); }
function popOrb(o){
  if(o.state!=='alive') return;
  o.state='popping'; o.popT=0.07; combo++; comboT=0.7;
  popped++; const gain=10+combo*2; score+=gain;
  popSound(combo);
  els.combo.textContent='x'+combo; els.combo.classList.remove('pop'); void els.combo.offsetWidth; els.combo.classList.add('pop');
  for(let k=0;k<10;k++)particles.push({x:o.x,y:o.y,vx:rand(-1,1)*160,vy:rand(-1,1)*160,life:rand(0.3,0.7),r:rand(1,3),c:o.type==='basic'?'255,210,122':(o.type==='big'?'255,107,90':'192,123,255')});
  if(combo>4){ slowmo=Math.min(slowmo,0.5); }
  updateHUD();
}

/* ---- update ---- */
function update(dt){
  // orbs drift
  for(const o of orbs){ if(o.state==='done')continue;
    o.x+=o.vx*dt; o.y+=o.vy*dt; o.ph+=dt*3;
    if(o.x<o.r){o.x=o.r;o.vx*=-1;} if(o.x>AW-o.r){o.x=AW-o.r;o.vx*=-1;}
    if(o.y<o.r+50){o.y=o.r+50;o.vy*=-1;} if(o.y>AH-o.r){o.y=AH-o.r;o.vy*=-1;}
  }
  // rings grow, pop orbs, magnet pull
  for(const ring of rings){
    ring.t+=dt; ring.r=ring.maxR*Math.min(1,ring.t/0.32);
    const active=ring.t<ring.life;
    if(active){
      for(const o of orbs){ if(o.state!=='alive')continue;
        const d=Math.hypot(o.x-ring.x,o.y-ring.y);
        if(ring.pull && d<ring.maxR*1.6){ const f=(1-d/(ring.maxR*1.6))*260*dt; o.vx+=(ring.x-o.x)/(d||1)*f; o.vy+=(ring.y-o.y)/(d||1)*f; }
        if(d<ring.r) popOrb(o);
      }
    }
  }
  rings=rings.filter(r=>r.t<r.life);
  // popping -> burst own ring
  for(const o of orbs){ if(o.state==='popping'){ o.popT-=dt; if(o.popT<=0){ o.state='done'; addRing(o.x,o.y,o.type); } } }
  // particles
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(0.15,dt);p.vy*=Math.pow(0.15,dt);}
  if(comboT>0)comboT-=dt; else combo=0;
  slowmo+=(1-slowmo)*Math.min(1,dt*3);
  if(shake>0)shake=Math.max(0,shake-dt*40);
  // cascade end?
  if(phase==='cascade'){
    const busy=rings.length>0 || orbs.some(o=>o.state==='popping');
    if(!busy) resolve();
  }
}
function resolve(){
  phase='result';
  const won=popped>=target;
  if(won){ SFX.win(); score+=50*round; if(score>best){best=score; localStorage.setItem('onespark_best',score);} }
  else SFX.lose();
  shake=won?0:10;
  qs('resTag').textContent=won?'통과':'실패';
  qs('resTag').style.color=won?'var(--wisp)':'var(--hot)';
  qs('resTitle').textContent=won?('연쇄 '+popped+'개!'):'조금 모자라…';
  qs('resSub').innerHTML=won?`목표 ${target} 달성 · 점수 <b style="color:var(--amber)">${score}</b>`:`${popped} / ${target} — 흐름을 다시 읽어봐`;
  qs('resBtn').textContent=won?'다음 라운드 →':'다시';
  setTimeout(()=>qs('resOv').classList.add('show'),600);
}

function rand(a,b){return a+Math.random()*(b-a);}

/* ---- loop ---- */
let lastT=perf();
function perf(){return performance?performance.now():0;}
function frame(t){ let dt=Math.min(0.033,(t-lastT)/1000); lastT=t;
  if(phase==='aim'||phase==='cascade') update(dt*slowmo);
  else for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;}
  render(t); requestAnimationFrame(frame); }

/* ---- render ---- */
function render(t){
  const tt=t/1000;
  let ox=0,oy=0; if(shake>0){ox=rand(-1,1)*shake;oy=rand(-1,1)*shake;}
  ctx.setTransform(scale*DPR,0,0,scale*DPR,ox*DPR,oy*DPR);
  ctx.clearRect(0,0,AW,AH); ctx.fillStyle='#07080f'; ctx.fillRect(0,0,AW,AH);
  // orbs
  for(const o of orbs){ if(o.state==='done')continue;
    const ty=T[o.type]; const pulse=0.7+0.3*Math.sin(tt*3+o.ph);
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(o.x,o.y,1,o.x,o.y,o.r*2.4);
    g.addColorStop(0,`rgba(${ty.col},${0.9*pulse})`); g.addColorStop(0.5,`rgba(${ty.col},0.3)`); g.addColorStop(1,`rgba(${ty.col},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(o.x,o.y,o.r*2.4,0,6.283); ctx.fill(); ctx.restore();
    ctx.fillStyle=`rgb(${ty.col})`; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,6.283); ctx.fill();
    if(o.type==='magnet'){ ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(o.x,o.y,o.r+4,0.6,2.5); ctx.stroke(); ctx.beginPath(); ctx.arc(o.x,o.y,o.r+4,3.7,5.6); ctx.stroke(); }
    if(o.type==='big'){ ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(o.x,o.y,o.r-3,0,6.283); ctx.stroke(); }
  }
  // rings
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const ring of rings){ const a=1-ring.t/ring.life; const ty=T[ring.type];
    const g=ctx.createRadialGradient(ring.x,ring.y,ring.r*0.4,ring.x,ring.y,ring.r);
    g.addColorStop(0,`rgba(${ty.col},0)`); g.addColorStop(0.7,`rgba(${ty.col},${0.25*a})`); g.addColorStop(1,`rgba(${ty.col},${0.5*a})`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ring.x,ring.y,ring.r,0,6.283); ctx.fill();
    ctx.strokeStyle=`rgba(${ty.col},${a})`; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(ring.x,ring.y,ring.r,0,6.283); ctx.stroke();
  }
  ctx.restore();
  // aim preview
  if(phase==='aim'&&!sparkUsed&&hover){ ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='rgba(255,210,122,.5)'; ctx.setLineDash([5,6]); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hover.x,hover.y,T.basic.ring,0,6.283); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,210,122,.9)'; ctx.beginPath(); ctx.arc(hover.x,hover.y,4,0,6.283); ctx.fill(); ctx.restore(); }
  // particles
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const p of particles){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); ctx.fillStyle='rgb('+p.c+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); }
  ctx.globalAlpha=1; ctx.restore();
  // vignette
  const vg=ctx.createRadialGradient(AW/2,AH/2,AH*0.4,AW/2,AH/2,AH*0.92); vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,AW,AH);
}
let hover=null;
cv.addEventListener('mousemove',e=>{ const r=cv.getBoundingClientRect(); hover={x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}; });
cv.addEventListener('mouseleave',()=>hover=null);

/* ---- buttons ---- */
qs('startBtn').onclick=()=>{ ac(); qs('startOv').classList.remove('show'); score=0; startRound(1); };
qs('resBtn').onclick=()=>{ if(popped>=target) startRound(round+1); else startRound(round); };

/* ---- boot ---- */
layout(); requestAnimationFrame(frame);
</script>
</body>
</html>
