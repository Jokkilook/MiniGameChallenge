<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>거울 · Mirror</title>
<style>
  :root{ --ink:#eef1ff; --muted:#8b90c4; --amber:#ffd27a; --wisp:#9ff0ff; --a:#9ff0ff; --b:#ffb46a; --panel:rgba(16,18,38,.92); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(120% 120% at 50% 0%,#12162c 0%,#05060c 72%);color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:8px}
  #stage{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04)}
  canvas{display:block;background:#07080f;border-radius:16px}
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:18px;padding:12px 16px;z-index:5;pointer-events:none}
  .stat .k{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
  .stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  #moves .v{color:var(--wisp)} #best .v{color:var(--amber)}
  #hud .spacer{flex:1} #lvl{font-size:13px;color:var(--muted)}
  #resetBtn{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700}
  #hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--muted);font-size:13px;z-index:5;pointer-events:none;text-shadow:0 2px 10px #000} #hint b{color:var(--wisp)}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:radial-gradient(60% 60% at 50% 45%,rgba(8,9,18,.5),rgba(4,5,11,.95));opacity:0;visibility:hidden;transition:opacity .35s}
  .overlay.show{opacity:1;visibility:visible}
  .card{width:min(560px,90%);background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:30px 30px 26px;text-align:center;box-shadow:0 26px 70px rgba(0,0,0,.55)}
  .card h1{margin:0;font-size:38px;letter-spacing:3px} .card h1 small{display:block;font-size:12px;letter-spacing:6px;color:var(--wisp);margin-top:10px;font-weight:600}
  .card p{color:var(--muted);line-height:1.75;font-size:14.5px;margin:16px 0 18px}
  .keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 22px}
  .key{border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 11px;font-size:12.5px;background:rgba(255,255,255,.04)} .key b{color:var(--wisp)}
  .cta{cursor:pointer;border:none;border-radius:12px;padding:13px 32px;font-size:15px;font-weight:800;letter-spacing:.5px;color:#221600;background:linear-gradient(180deg,var(--amber),#ff9e5e);box-shadow:0 10px 30px rgba(255,158,94,.35);transition:.15s}
  .cta:hover{transform:translateY(-2px)}
  .tag{display:inline-block;color:var(--wisp);font-size:12px;letter-spacing:3px;margin-bottom:6px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="stat" id="moves"><div class="k">이동</div><div class="v" id="movesV">0</div></div>
      <div class="spacer"></div><div id="lvl">1</div><div class="spacer"></div>
      <button id="resetBtn">다시 (R)</button>
    </div>
    <div id="hint"></div>

    <div class="overlay show" id="startOv">
      <div class="card">
        <span class="tag">ONE INPUT · TWO SELVES</span>
        <h1>거울<small>M I R R O R</small></h1>
        <p>방향키 하나로 <b style="color:var(--a)">두 분신</b>이 동시에 움직인다.<br>
           하나는 그대로, <b style="color:var(--b)">하나는 좌우 반대</b>로.<br>
           벽으로 어긋내어 <b>둘 다 각자의 집</b>에 동시에 도착시켜라.</p>
        <div class="keys"><span class="key"><b>WASD</b>/방향키</span><span class="key"><b>Z</b> 무르기</span><span class="key"><b>R</b> 다시</span></div>
        <button class="cta" id="startBtn">시작</button>
      </div>
    </div>
    <div class="overlay" id="winOv">
      <div class="card">
        <span class="tag" id="winTag">CLEAR</span>
        <h1 id="winTitle" style="font-size:26px;letter-spacing:1px">·</h1>
        <p id="winMsg">·</p>
        <button class="cta" id="nextBtn">다음 →</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   거울 · Mirror — one input moves TWO selves at once. Self A moves with
   your input; self B is horizontally MIRRORED (left<->right). Walls block
   each independently, so they desync — use that to land BOTH on their
   goals at the same time. Fully deterministic — pure planning.
   ============================================================ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DPR=Math.max(1,Math.min(2,devicePixelRatio||1));
let CELL=56, OX=0, OY=0;

/* ---- levels ----  '#'=wall '.'=floor  'A'/'B'=self starts  'a'/'b'=goals ---- */
const LEVELS=[
  { name:"나란히", par:6, hint:"오른쪽을 누르면 <b>파랑은 오른쪽</b>, <b>주황은 왼쪽</b>. 둘 다 집으로.",
    map:[
      "#########",
      "#A.....a#",
      "#b.....B#",
      "#########",
    ]},
  { name:"어긋난 벽", par:7, hint:"벽이 한쪽만 막는다. 그 <b>어긋남</b>을 이용하라.",
    map:[
      "########",
      "#.#.b..#",
      "#...Ba.#",
      "#A#.#..#",
      "########",
    ]},
  { name:"기대두기", par:8, hint:"한 분신을 벽에 <b>기대두고</b> 다른 분신만 움직여라.",
    map:[
      "########",
      "#b#...a#",
      "#...B.##",
      "#.#...A#",
      "########",
    ]},
  { name:"엇갈림", par:10, hint:"둘의 길이 다르다. 순서를 <b>궁리</b>하라.",
    map:[
      "########",
      "#.a.#..#",
      "##..bB.#",
      "#....A.#",
      "########",
    ]},
  { name:"두 세계", par:11, hint:"거울의 어긋남을 끝까지 읽어라.",
    map:[
      "########",
      "##.b...#",
      "#.#BA..#",
      "#..a...#",
      "########",
    ]},
];

/* ---- state ---- */
let phase='intro', li=0, W=0, H=0;
let grid, A, B, gA, gB, moves, hist, best=[];
try{ best=JSON.parse(localStorage.getItem('mirror_best')||'[]'); }catch(e){ best=[]; }
let particles=[], winT=0;

/* ---- input ---- */
const KM={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
addEventListener('keydown',e=>{
  if(phase!=='play') return;
  if(e.repeat){ e.preventDefault(); return; }
  if(e.key==='r'||e.key==='R'){ resetLevel(); e.preventDefault(); return; }
  if(e.key==='z'||e.key==='Z'){ undo(); e.preventDefault(); return; }
  const m=KM[e.key]; if(m){ step(m[0],m[1]); e.preventDefault(); }
});

/* ---- audio ---- */
let AC=null,muted=false;
function ac(){ if(!AC){try{AC=new (AudioContext||webkitAudioContext)();}catch(e){}} return AC; }
function tone(f,d=0.06,t='sine',v=0.03,to){ if(muted)return; const a=ac();if(!a)return; const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.value=f;if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
  g.gain.value=0;o.connect(g);g.connect(a.destination);const n=a.currentTime;g.gain.linearRampToValueAtTime(v,n+0.006);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.start(n);o.stop(n+d+0.02); }
const SFX={ step(){tone(300,0.05,'sine',0.02);}, home(){tone(600,0.1,'triangle',0.04,850);}, win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'sine',0.05),i*95));} };

/* ---- parse / layout ---- */
function parse(mp){ H=mp.length; W=mp[0].length; grid=[]; A=B=gA=gB=null;
  for(let y=0;y<H;y++){ grid[y]=[]; for(let x=0;x<W;x++){ const c=mp[y][x]; grid[y][x]=(c==='#')?'#':'.';
    if(c==='A')A={x,y}; else if(c==='B')B={x,y}; else if(c==='a')gA={x,y}; else if(c==='b')gB={x,y}; } } }
function layout(){ CELL=Math.min(Math.floor((Math.max(320,innerWidth)-20)/W),Math.floor((Math.max(240,innerHeight)-20)/H),74);
  const cw=W*CELL, ch=H*CELL; OX=0; OY=0;
  const s=Math.min(1,(Math.max(320,innerWidth)-16)/cw,(Math.max(240,innerHeight)-16)/ch);
  cv.style.width=(cw*s)+'px'; cv.style.height=(ch*s)+'px'; cv.width=Math.round(cw*s*DPR); cv.height=Math.round(ch*s*DPR); ctx.setTransform(s*DPR,0,0,s*DPR,0,0);
}
addEventListener('resize',()=>{ if(W)layout(); });

/* ---- movement: A normal, B mirrored horizontally ---- */
function canGo(p,dx,dy){ const nx=p.x+dx, ny=p.y+dy; return nx>=0&&ny>=0&&nx<W&&ny<H&&grid[ny][nx]!=='#'; }
function step(dx,dy){
  hist.push({A:{...A},B:{...B},moves});
  let m=false;
  if(canGo(A,dx,dy)){ A.x+=dx; A.y+=dy; m=true; }
  if(canGo(B,-dx,dy)){ B.x-=dx; B.y+=dy; m=true; }   // B mirrored on X
  moves++; document.getElementById('movesV').textContent=moves;
  if(m) SFX.step();
  if(A.x===gA.x&&A.y===gA.y && B.x===gB.x&&B.y===gB.y) win();
}
function undo(){ if(!hist.length)return; const h=hist.pop(); A={...h.A}; B={...h.B}; moves=h.moves; document.getElementById('movesV').textContent=moves; }

/* ---- flow ---- */
function loadLevel(i){ li=i; parse(LEVELS[i].map); layout(); moves=0; hist=[]; particles=[]; winT=0;
  document.getElementById('lvl').textContent=(i+1)+' · '+LEVELS[i].name; document.getElementById('hint').innerHTML=LEVELS[i].hint; document.getElementById('movesV').textContent=0; }
function resetLevel(){ loadLevel(li); }
function win(){ phase='win'; SFX.win(); winT=0;
  for(const g of [gA,gB]) for(let k=0;k<18;k++)particles.push({x:g.x*CELL+CELL/2,y:g.y*CELL+CELL/2,vx:rand(-1,1)*130,vy:rand(-1,1)*130,life:rand(0.5,1.1),r:rand(1,3),c:g===gA?'159,240,255':'255,180,106'});
  const isBest=(best[li]==null||moves<best[li]); if(isBest){ best[li]=moves; localStorage.setItem('mirror_best',JSON.stringify(best)); }
  const last=li===LEVELS.length-1;
  document.getElementById('winTag').textContent=last?'ALL CLEAR':'CLEAR';
  document.getElementById('winTitle').textContent=last?'두 세계가 만났다':'둘 다 집에!';
  document.getElementById('winMsg').innerHTML=`${moves}번 이동 (목표 ${LEVELS[li].par})`+(isBest?' · <b style="color:var(--amber)">최소 기록!</b>':'');
  document.getElementById('nextBtn').textContent=last?'처음부터':'다음 →';
  setTimeout(()=>document.getElementById('winOv').classList.add('show'),450);
}
function rand(a,b){return a+Math.random()*(b-a);}

/* ---- loop ---- */
let lastT=perf(); function perf(){return performance?performance.now():0;}
function frame(t){ const dt=Math.min(0.033,(t-lastT)/1000); lastT=t; if(phase==='win')winT+=dt;
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;}
  render(t); requestAnimationFrame(frame); }

/* ---- render ---- */
function render(t){
  const tt=t/1000; ctx.clearRect(0,0,W*CELL||300,H*CELL||150);
  if(!W||!A||!B) return;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const X=x*CELL,Y=y*CELL;
    if(grid[y][x]==='#'){ ctx.fillStyle='#0d1024'; ctx.fillRect(X,Y,CELL,CELL); ctx.fillStyle='#171b39'; ctx.fillRect(X+1,Y+1,CELL-2,CELL-3); }
    else { ctx.fillStyle=((x+y)&1)?'#0c0f22':'#0a0d1e'; ctx.fillRect(X,Y,CELL,CELL); ctx.strokeStyle='rgba(255,255,255,.02)'; ctx.strokeRect(X+.5,Y+.5,CELL-1,CELL-1); } }
  drawGoal(gA,'159,240,255',tt, A.x===gA.x&&A.y===gA.y);
  drawGoal(gB,'255,180,106',tt, B.x===gB.x&&B.y===gB.y);
  drawSelf(A,'159,240,255',tt); drawSelf(B,'255,180,106',tt);
  ctx.save();ctx.globalCompositeOperation='lighter'; for(const p of particles){ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.fillStyle='rgb('+p.c+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}ctx.globalAlpha=1;ctx.restore();
}
function drawGoal(g,col,tt,on){ const X=g.x*CELL+CELL/2,Y=g.y*CELL+CELL/2,p=0.5+0.5*Math.sin(tt*2.5);
  ctx.save();ctx.globalCompositeOperation='lighter'; const gr=ctx.createRadialGradient(X,Y,2,X,Y,CELL*0.44+p*4);
  gr.addColorStop(0,`rgba(${col},${on?.5:.35})`);gr.addColorStop(1,`rgba(${col},0)`); ctx.fillStyle=gr;ctx.beginPath();ctx.arc(X,Y,CELL*0.44+p*4,0,6.283);ctx.fill();ctx.restore();
  ctx.strokeStyle=`rgba(${col},.9)`;ctx.lineWidth=on?3:2;ctx.setLineDash(on?[]:[4,5]);ctx.beginPath();ctx.arc(X,Y,CELL*0.26,0,6.283);ctx.stroke();ctx.setLineDash([]); }
function drawSelf(s,col,tt){ const X=s.x*CELL+CELL/2,Y=s.y*CELL+CELL/2, r=CELL*0.3;
  ctx.save();ctx.globalCompositeOperation='lighter'; const g=ctx.createRadialGradient(X,Y,1,X,Y,r*2.1);
  g.addColorStop(0,`rgba(${col},.5)`);g.addColorStop(1,`rgba(${col},0)`); ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,r*2.1,0,6.283);ctx.fill();ctx.restore();
  ctx.fillStyle='#0c1224';ctx.beginPath();ctx.arc(X,Y,r,0,6.283);ctx.fill(); ctx.strokeStyle=`rgba(${col},.95)`;ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle=`rgba(${col},.95)`; const eo=r*0.4; ctx.beginPath();ctx.arc(X-eo,Y-2,2.2,0,6.283);ctx.arc(X+eo,Y-2,2.2,0,6.283);ctx.fill(); }

/* ---- buttons ---- */
document.getElementById('startBtn').onclick=()=>{ ac(); document.getElementById('startOv').classList.remove('show'); phase='play'; loadLevel(0); };
document.getElementById('resetBtn').onclick=()=>{ if(phase==='play')resetLevel(); };
document.getElementById('nextBtn').onclick=()=>{ document.getElementById('winOv').classList.remove('show'); const last=li===LEVELS.length-1; phase='play'; loadLevel(last?0:li+1); };

/* ---- boot ---- */
layout(); loadLevel(0); requestAnimationFrame(frame);
</script>
</body>
</html>
