<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>미니게임 아케이드 · MiniGame Arcade</title>
<style>
  :root{ --ink:#eef1ff; --muted:#8b90c4; --amber:#ffd27a; --wisp:#9ff0ff; --panel:rgba(16,18,38,.72); }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(130% 120% at 50% -10%,#181c38 0%,#080a12 60%,#05060c 100%);
    color:var(--ink);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:0 20px 60px}
  /* animated starfield */
  #bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  #bg span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.15;animation:tw 4s infinite ease-in-out}
  @keyframes tw{0%,100%{opacity:.06}50%{opacity:.35}}

  header{max-width:1080px;margin:0 auto;padding:56px 8px 30px;text-align:center}
  .kick{display:inline-block;letter-spacing:5px;font-size:12px;color:var(--wisp);margin-bottom:14px;font-weight:600}
  h1{margin:0;font-size:clamp(34px,6vw,58px);letter-spacing:2px;font-weight:900;
    background:linear-gradient(180deg,#fff,#b9c0ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--muted);font-size:15px;line-height:1.7;max-width:640px;margin:16px auto 0}
  .count{margin-top:14px;font-size:13px;color:var(--muted)} .count b{color:var(--amber)}

  .grid{max-width:1080px;margin:26px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px 20px 18px;overflow:hidden;
    backdrop-filter:blur(8px);transition:transform .18s,border-color .18s,box-shadow .18s}
  .card:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 1px var(--ac)}
  .card .glow{position:absolute;top:-40%;right:-30%;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,var(--ac),transparent 70%);opacity:.22;filter:blur(6px);transition:opacity .18s}
  .card:hover .glow{opacity:.4}
  .ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);box-shadow:0 0 26px -6px var(--ac);margin-bottom:14px}
  .genre{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ac);font-weight:700}
  .card h2{margin:6px 0 2px;font-size:21px;letter-spacing:.5px}
  .en{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .desc{color:var(--muted);font-size:13px;line-height:1.6;margin:12px 0 16px;flex:1}
  .play{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-weight:800;font-size:13.5px;color:var(--ac)}
  .play .arw{transition:transform .18s} .card:hover .play .arw{transform:translateX(4px)}
  .badge{position:absolute;top:16px;right:16px;font-size:10px;letter-spacing:1px;font-weight:800;padding:3px 8px;border-radius:20px;
    background:var(--ac);color:#10131f}

  footer{max-width:1080px;margin:44px auto 0;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  footer code{background:rgba(255,255,255,.06);padding:2px 7px;border-radius:6px;color:var(--wisp);font-size:12px}
</style>
</head>
<body>
<div id="bg"></div>

<header>
  <div class="kick">MINIGAME CHALLENGE</div>
  <h1>미니게임 아케이드</h1>
  <p>지금까지 만든 게임들. 카드를 누르면 바로 플레이됩니다.<br>모두 순수 HTML5 · 단일 파일 · 설치 없이 브라우저에서 실행.</p>
  <div class="count"><b id="n">0</b>개의 게임</div>
</header>

<main class="grid" id="grid"></main>

<footer>
  새 게임을 추가하려면 이 파일의 <code>GAMES</code> 배열에 한 줄만 넣으면 카드가 자동으로 생깁니다.<br>
  <span style="opacity:.6">2026 미니게임 메이커스 챌린지 / 경기게임오디션</span>
</footer>

<script>
"use strict";
/* ============================================================
   메인 런처. 새 게임 추가 = 아래 GAMES 배열에 항목 하나 추가.
   { folder, ko, en, genre, desc, icon, color, badge? }
   folder 는 각 게임 폴더명 (그 안의 index.html 로 연결됨).
   ============================================================ */
const GAMES = [
  { folder:"Umbra",        ko:"움브라",        en:"Umbra",         genre:"그림자 퍼즐",   icon:"🌘",
    desc:"빛은 벽, 그림자로만 걷는다. 상자·스위치·깜빡임을 풀어 출구로. 10레벨.", color:"#ffd27a" },
  { folder:"UmbraSurvivor",ko:"그림자 서바이벌",en:"Umbra Survivor",genre:"무한 아케이드", icon:"⚡",
    desc:"휩쓰는 빛을 피해 버틴 시간이 곧 점수. 기둥 그림자에 숨어라.", color:"#ff6b5a" },
  { folder:"LumenLine",    ko:"빛 구슬",       en:"Lumen Line",    genre:"물리 그리기",   icon:"🟡",
    desc:"선을 그려 빛 구슬을 굴려 등불에 넣는 물리 퍼즐.", color:"#9ff0ff" },
  { folder:"LightKeeper",  ko:"빛의 수호자",   en:"Light Keeper",  genre:"타워 디펜스",   icon:"🛡️",
    desc:"빛 타워를 세워 밀려오는 어둠을 막아라. 12웨이브.", color:"#ffcf6a" },
  { folder:"Squiggle",     ko:"꿈틀꿈틀",      en:"Squiggle",      genre:"낙서 물리 레이서", icon:"🐛",
    desc:"아무렇게나 그린 생명체가 살아나 결승선까지 기어간다.", color:"#b6f36a" },
  { folder:"OneSpark",     ko:"한 번의 불꽃",  en:"One Spark",     genre:"연쇄 폭발",     icon:"💥",
    desc:"딱 한 번의 불꽃으로 연쇄 폭발을 일으켜 목표만큼 터뜨려라.", color:"#ff9e5e" },
  { folder:"Still",        ko:"멈춤",          en:"Still",         genre:"시간 = 이동",   icon:"⏱️",
    desc:"움직일 때만 시간이 흐른다. 멈춰서 계획하고 빛의 틈으로. 100% 실력.", color:"#9ff0ff", badge:"KEEP" },
  { folder:"Rewind",       ko:"되감기",        en:"Rewind",        genre:"과거의 나와 협동", icon:"↺",
    desc:"되감으면 과거의 내가 유령으로 재생. 스위치를 밟게 해 문을 연다.", color:"#c07bff" },
  { folder:"Swap",         ko:"자리바꿈",      en:"Swap",          genre:"스왑 퍼즐",     icon:"🔀",
    desc:"틈은 못 건넌다. 저 너머 블록과 자리를 바꿔 순간이동으로 건너라.", color:"#7b93ff" },
  { folder:"Ricochet",     ko:"튕김",          en:"Ricochet",      genre:"조준 · 반사",   icon:"🎯",
    desc:"벽에 튕기는 궤도를 예측해, 최소 발사로 모든 표적을 관통하라.", color:"#ff6b8a" },
  { folder:"Mirror",       ko:"거울",          en:"Mirror",        genre:"동시 조작 퍼즐", icon:"🪞",
    desc:"방향키 하나로 두 분신이 동시에 — 하나는 거울처럼 반대로. 둘 다 집으로.", color:"#9ff0ff" },
  { folder:"Program",      ko:"봇",            en:"Program",       genre:"프로그래밍 퍼즐", icon:"🤖",
    desc:"직접 움직이지 않는다. 명령을 짜서 실행하면 로봇이 그대로 — 모든 타일을 켜라.", color:"#b6f36a", badge:"NEW" },
];

const grid=document.getElementById('grid');
for(const g of GAMES){
  const a=document.createElement('a');
  a.className='card'; a.href=g.folder+'/index.html'; a.style.setProperty('--ac',g.color);
  a.innerHTML=`
    <div class="glow"></div>
    ${g.badge?`<span class="badge">${g.badge}</span>`:''}
    <div class="ico">${g.icon}</div>
    <div class="genre">${g.genre}</div>
    <h2>${g.ko}</h2>
    <div class="en">${g.en}</div>
    <div class="desc">${g.desc}</div>
    <span class="play">플레이 <span class="arw">→</span></span>`;
  grid.appendChild(a);
}
document.getElementById('n').textContent=GAMES.length;

// starfield
const bg=document.getElementById('bg');
for(let i=0;i<70;i++){ const s=document.createElement('span');
  s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%';
  s.style.animationDelay=(Math.random()*4)+'s'; s.style.transform='scale('+(0.5+Math.random()*1.6)+')';
  bg.appendChild(s); }
</script>
</body>
</html>
