<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>미니게임 아케이드 · MiniGame Arcade</title>
<style>
  :root{ --ink:#eef1ff; --muted:#8b90c4; --amber:#ffd27a; --wisp:#9ff0ff; --panel:rgba(16,18,38,.72); }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(130% 120% at 50% -10%,#181c38 0%,#080a12 60%,#05060c 100%);
    color:var(--ink);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:0 20px 60px}
  /* animated starfield */
  #bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  #bg span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.15;animation:tw 4s infinite ease-in-out}
  @keyframes tw{0%,100%{opacity:.06}50%{opacity:.35}}

  header{max-width:1080px;margin:0 auto;padding:56px 8px 30px;text-align:center}
  .kick{display:inline-block;letter-spacing:5px;font-size:12px;color:var(--wisp);margin-bottom:14px;font-weight:600}
  h1{margin:0;font-size:clamp(34px,6vw,58px);letter-spacing:2px;font-weight:900;
    background:linear-gradient(180deg,#fff,#b9c0ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--muted);font-size:15px;line-height:1.7;max-width:640px;margin:16px auto 0}
  .count{margin-top:14px;font-size:13px;color:var(--muted)} .count b{color:var(--amber)}

  .grid{max-width:1080px;margin:26px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px 20px 18px;overflow:hidden;
    backdrop-filter:blur(8px);transition:transform .18s,border-color .18s,box-shadow .18s}
  .card:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 1px var(--ac)}
  .card .glow{position:absolute;top:-40%;right:-30%;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,var(--ac),transparent 70%);opacity:.22;filter:blur(6px);transition:opacity .18s}
  .card:hover .glow{opacity:.4}
  .ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);box-shadow:0 0 26px -6px var(--ac);margin-bottom:14px}
  .genre{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ac);font-weight:700}
  .card h2{margin:6px 0 2px;font-size:21px;letter-spacing:.5px}
  .en{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .desc{color:var(--muted);font-size:13px;line-height:1.6;margin:12px 0 16px;flex:1}
  .play{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-weight:800;font-size:13.5px;color:var(--ac)}
  .play .arw{transition:transform .18s} .card:hover .play .arw{transform:translateX(4px)}
  .badge{position:absolute;top:16px;right:16px;font-size:10px;letter-spacing:1px;font-weight:800;padding:3px 8px;border-radius:20px;
    background:var(--ac);color:#10131f}

  footer{max-width:1080px;margin:44px auto 0;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  footer code{background:rgba(255,255,255,.06);padding:2px 7px;border-radius:6px;color:var(--wisp);font-size:12px}

  .cardfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
  .cbtn{position:relative;z-index:2;pointer-events:auto;cursor:pointer;font:inherit;font-size:12px;font-weight:700;
    color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;
    padding:6px 12px;display:inline-flex;align-items:center;gap:5px;transition:color .15s,border-color .15s,background .15s}
  .cbtn:hover{color:var(--ac);border-color:var(--ac);background:rgba(255,255,255,.09)}
  .cbtn b{color:var(--wisp);font-weight:800}

  /* comments modal */
  #cmodal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;
    background:rgba(4,5,12,.74);backdrop-filter:blur(4px)}
  #cmodal.on{display:flex}
  .cbox{width:min(94vw,470px);max-height:88vh;display:flex;flex-direction:column;background:#12152c;
    border:1px solid rgba(130,150,240,.3);border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .chead{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
  .chead .cico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
  .chead h3{margin:0;font-size:17px}
  .chead .csub{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
  .chead .cx{margin-left:auto;cursor:pointer;color:var(--muted);font-size:24px;line-height:1;padding:2px 9px;border-radius:8px}
  .chead .cx:hover{background:rgba(255,255,255,.08);color:#fff}
  .clist{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-height:90px}
  .cstate{color:var(--muted);font-size:13px;text-align:center;padding:22px 0;line-height:1.6}
  .citem{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 13px}
  .citem .cmeta{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-bottom:4px}
  .citem .cname{color:var(--amber);font-weight:700}
  .citem .ctime{color:var(--muted);flex:none}
  .citem .ctext{font-size:13.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .cform{border-top:1px solid rgba(255,255,255,.07);padding:12px 18px;display:flex;flex-direction:column;gap:8px}
  .cform .crow{display:flex;gap:8px}
  .cform input,.cform textarea{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    border-radius:10px;color:var(--ink);font:inherit;font-size:13.5px;padding:9px 11px;resize:none}
  .cform input:focus,.cform textarea:focus{outline:none;border-color:var(--wisp)}
  .cform .cname-in{flex:0 0 128px;min-width:0}
  .cform textarea{width:100%;min-height:46px}
  .cform .cbottom{display:flex;gap:8px;align-items:center}
  .cform .cnote{flex:1;font-size:11px;color:var(--muted)}
  .cpost{cursor:pointer;font:inherit;font-weight:800;font-size:14px;color:#0a1220;
    background:linear-gradient(180deg,#bff0ff,#63d6ff);border:0;padding:11px 20px;border-radius:10px;white-space:nowrap}
  .cpost:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div id="bg"></div>

<header>
  <div class="kick">MINIGAME CHALLENGE</div>
  <h1>미니게임 아케이드</h1>
  <p>지금까지 만든 게임들. 카드를 누르면 바로 플레이됩니다.<br>모두 순수 HTML5 · 단일 파일 · 설치 없이 브라우저에서 실행.</p>
  <div class="count"><b id="n">0</b>개의 게임</div>
</header>

<main class="grid" id="grid"></main>

<footer>
  각 게임 카드의 <code>💬 댓글</code>을 눌러 자유롭게 의견을 남겨주세요. 여러분의 피드백이 큰 힘이 됩니다!<br>
  <span style="opacity:.6">2026 미니게임 메이커스 챌린지</span>
</footer>

<script>
"use strict";
/* ============================================================

   folder 는 각 게임 폴더명 (그 안의 index.html 로 연결됨).

  { folder:"UmbraSurvivor",ko:"그림자 서바이벌",en:"Umbra Survivor",genre:"무한 아케이드", icon:"⚡",
    desc:"휩쓰는 빛을 피해 버틴 시간이 곧 점수. 기둥 그림자에 숨어라.", color:"#ff6b5a" },
  { folder:"LumenLine",    ko:"빛 구슬",       en:"Lumen Line",    genre:"물리 그리기",   icon:"🟡",
    desc:"선을 그려 빛 구슬을 굴려 등불에 넣는 물리 퍼즐.", color:"#9ff0ff" },
  { folder:"LightKeeper",  ko:"빛의 수호자",   en:"Light Keeper",  genre:"타워 디펜스",   icon:"🛡️",
    desc:"빛 타워를 세워 밀려오는 어둠을 막아라. 12웨이브.", color:"#ffcf6a" },
  { folder:"Squiggle",     ko:"꿈틀꿈틀",      en:"Squiggle",      genre:"낙서 물리 레이서", icon:"🐛",
    desc:"아무렇게나 그린 생명체가 살아나 결승선까지 기어간다.", color:"#b6f36a" },
  { folder:"OneSpark",     ko:"한 번의 불꽃",  en:"One Spark",     genre:"연쇄 폭발",     icon:"💥",
    desc:"딱 한 번의 불꽃으로 연쇄 폭발을 일으켜 목표만큼 터뜨려라.", color:"#ff9e5e" },
  { folder:"Still",        ko:"멈춤",          en:"Still",         genre:"시간 = 이동",   icon:"⏱️",
    desc:"움직일 때만 시간이 흐른다. 멈춰서 계획하고 빛의 틈으로. 100% 실력.", color:"#9ff0ff", badge:"KEEP" },
  { folder:"Rewind",       ko:"되감기",        en:"Rewind",        genre:"과거의 나와 협동", icon:"↺",
    desc:"되감으면 과거의 내가 유령으로 재생. 스위치를 밟게 해 문을 연다.", color:"#c07bff" },
  { folder:"Swap",         ko:"자리바꿈",      en:"Swap",          genre:"스왑 퍼즐",     icon:"🔀",
    desc:"틈은 못 건넌다. 저 너머 블록과 자리를 바꿔 순간이동으로 건너라.", color:"#7b93ff" },
  { folder:"Ricochet",     ko:"튕김",          en:"Ricochet",      genre:"조준 · 반사",   icon:"🎯",
    desc:"벽에 튕기는 궤도를 예측해, 최소 발사로 모든 표적을 관통하라.", color:"#ff6b8a" },
  { folder:"Mirror",       ko:"거울",          en:"Mirror",        genre:"동시 조작 퍼즐", icon:"🪞",
    desc:"방향키 하나로 두 분신이 동시에 — 하나는 거울처럼 반대로. 둘 다 집으로.", color:"#9ff0ff" },
  { folder:"Program",      ko:"봇",            en:"Program",       genre:"프로그래밍 퍼즐", icon:"🤖",
    desc:"직접 움직이지 않는다. 명령을 짜서 실행하면 로봇이 그대로 — 모든 타일을 켜라.", color:"#b6f36a" },
  { folder:"HoneyGarden",  ko:"꿀벌 정원",     en:"Honey Garden",  genre:"배치 타이쿤",   icon:"🍯",
    desc:"꽃을 심고 벌집을 옆에 둬 꿀을 불려라. 이웃 시너지로 최적화하는 방치형 타이쿤.", color:"#ffb300" },
  { folder:"Ensemble",     ko:"합주",          en:"Ensemble",      genre:"실시간 협동",   icon:"🎼",
    desc:"10초씩 달리며 과거의 나들과 손발을 맞춰라. 혼자선 절대 못 닿는 보물로.", color:"#4da6ff" },
  { folder:"KeepOpen",     ko:"창을 닫지 마세요!", en:"Keep The Window Open", genre:"메타 · 윈도우", icon:"🪟",
    desc:"캐릭터가 아니라 '창' 자체를 조작한다! 창 테두리를 드래그해 러너를 틈으로 통과시켜라.", color:"#1084d0" },
  { folder:"EchoDungeon",  ko:"소리로 그리는 던전", en:"Echo Dungeon", genre:"에코로케이션 스텔스", icon:"🔊",
    desc:"화면은 칠흑. 소리로만 지형을 그린다. 발소리로 살금살금, 돌을 던져 몬스터를 유인하고 열쇠를 찾아 탈출하라.", color:"#5fb8ff" },
  { folder:"SlimeSlingshot",ko:"슬라임 슬링샷", en:"Slime Slingshot", genre:"물리 궤적 액션", icon:"🟢",
    desc:"당겨 발사한 뒤 공중에서 성질을 바꾼다. 고무로 튕기고, 쇠로 부수고, 기체로 떠올라 정밀하게 골인.", color:"#8ed94f" },
  { folder:"AlchemyDice", ko:"알케미 다이스", en:"Alchemy Dice", genre:"주사위 합성 퍼즐", icon:"🎲",
    desc:"주사위를 5×5에 놓아 같은 숫자 3개를 모아 합성! 연쇄를 일으켜 원소 폭발로 그리드를 청소하라.", color:"#b980ff" },
  { folder:"ShadowTrace", ko:"섀도우 트레이스", en:"Shadow Trace", genre:"잔상 기억 트레이싱", icon:"✦",
    desc:"1초마다 반짝이는 빛의 길을 기억하고, 암흑 속을 손끝으로 더듬어 그려 출구까지. 감시자를 피해 타이밍 통과.", color:"#5cc8ff" },
  { folder:"GravityScroll", ko:"그라비티 스크롤", en:"Gravity Scroll", genre:"중력 역전 아케이드", icon:"🖱️",
    desc:"휠을 굴려 중력의 방향과 세기를 조작! 무너지는 탑에서 가시와 낙하물을 피해 최하층까지 탈출하라.", color:"#5c9cff" },
  { folder:"TabDiver", ko:"탭 다이버", en:"Tab Diver", genre:"차원 이동 플랫포머", icon:"🗂️",
    desc:"과거·미래 두 탭을 넘나든다. 과거에 심은 씨앗이 미래엔 발판으로! 두 차원의 출구에 모두 도달하라.", color:"#a878ff" },
  { folder:"ShadowIllusion", ko:"섀도우 일루전", en:"Shadow Illusion", genre:"광원 그림자 퍼즐", icon:"🔦",
    desc:"커서가 빛이다. 기둥 뒤 그림자만이 안전지대. 커서를 움직여 그림자 다리를 이어 정령을 출구로 인도하라.", color:"#9ff0ff" },
  { folder:"SpellParrier", ko:"스펠 패리어", en:"Spell Parrier", genre:"패링 · 타자 액션", icon:"⚔️",
    desc:"오른손 마우스로 투사체를 좌클릭 패링, 왼손 키보드로 적 위의 단어를 타이핑해 마법으로 격파! 뇌를 태우는 멀티태스킹.", color:"#ffb84d" },
  { folder:"KungFuRagdoll", ko:"슈퍼 쿵푸 래그돌", en:"Kung Fu Ragdoll", genre:"래그돌 물리 난투", icon:"🥋",
    desc:"흐느적 쿵푸 고수를 당겼다 놓아 슬링샷! 날아가는 관성으로 적을 발차기로 날리고 도미노 연쇄로 도장을 격파하라. 아쵸~!", color:"#ff8a2d" },
  { folder:"CoreFrame", ko:"코어 프레임", en:"Core Frame", genre:"정밀 벡터 비행", icon:"🛸",

  { folder:"ForgeOfTheDeep", ko:"심해의 대장간", en:"Forge of the Deep", genre:"낚시 · 제련 타이쿤 RPG", icon:"🔨",

];

const grid=document.getElementById('grid');
for(const g of GAMES){
  const a=document.createElement('a');
  a.className='card'; a.href=g.folder+'/index.html'; a.style.setProperty('--ac',g.color);
  a.innerHTML=`
    <div class="glow"></div>
    ${g.badge?`<span class="badge">${g.badge}</span>`:''}
    <div class="ico">${g.icon}</div>
    <div class="genre">${g.genre}</div>
    <h2>${g.ko}</h2>
    <div class="en">${g.en}</div>
    <div class="desc">${g.desc}</div>
    <div class="cardfoot">
      <span class="play">플레이 <span class="arw">→</span></span>
      <button class="cbtn" type="button">💬 <b data-cnt="${g.folder}">·</b></button>
    </div>`;
  const cb=a.querySelector('.cbtn');
  cb.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); openComments(g); });
  grid.appendChild(a);
}
document.getElementById('n').textContent=GAMES.length;

// starfield
const bg=document.getElementById('bg');
for(let i=0;i<70;i++){ const s=document.createElement('span');
  s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%';
  s.style.animationDelay=(Math.random()*4)+'s'; s.style.transform='scale('+(0.5+Math.random()*1.6)+')';
  bg.appendChild(s); }

/* ================= 댓글 (Supabase REST, 라이브러리 없이 fetch) ================= */
const SUPA_URL='https://lokayuzrvziyixclxopw.supabase.co';
const SUPA_KEY='sb_publishable_7Ob8NQor65RZIcWlXVqOKg_BfNYW8ny';
const SUPA_H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY};
const GMETA={}; GAMES.forEach(g=>GMETA[g.folder]=g);

function timeAgo(iso){ const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60)return '방금'; if(d<3600)return Math.floor(d/60)+'분 전';
  if(d<86400)return Math.floor(d/3600)+'시간 전'; if(d<2592000)return Math.floor(d/86400)+'일 전';
  return new Date(iso).toLocaleDateString('ko-KR'); }

// 카드 댓글 수 로드
async function loadCounts(){
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/comments?select=game',{headers:SUPA_H});
    if(!r.ok)return; const rows=await r.json(); const cnt={};
    rows.forEach(x=>{ cnt[x.game]=(cnt[x.game]||0)+1; });
    document.querySelectorAll('[data-cnt]').forEach(b=>{ b.textContent=cnt[b.dataset.cnt]||0; });
  }catch(e){ document.querySelectorAll('[data-cnt]').forEach(b=>{ b.textContent='0'; }); }
}

// 모달 DOM 1회 생성
const modal=document.createElement('div'); modal.id='cmodal';
modal.innerHTML=`
  <div class="cbox">
    <div class="chead">
      <div class="cico" id="cIco">🎮</div>
      <div><h3 id="cTitle">게임</h3><div class="csub" id="cSub">COMMENTS</div></div>
      <div class="cx" id="cClose">×</div>
    </div>
    <div class="clist" id="cList"></div>
    <div class="cform">
      <div class="crow">
        <input class="cname-in" id="cName" maxlength="24" placeholder="닉네임 (선택)">
      </div>
      <textarea id="cBody" maxlength="500" placeholder="이 게임 어땠나요? 의견을 남겨주세요"></textarea>
      <div class="cbottom">
        <span class="cnote" id="cNote">누구나 로그인 없이 남길 수 있어요</span>
        <button class="cpost" id="cPost">등록</button>
      </div>
    </div>
  </div>`;
document.body.appendChild(modal);
const cList=modal.querySelector('#cList'), cName=modal.querySelector('#cName'),
      cBody=modal.querySelector('#cBody'), cPost=modal.querySelector('#cPost'), cNote=modal.querySelector('#cNote');
let curFolder=null;

modal.querySelector('#cClose').addEventListener('click',closeComments);
modal.addEventListener('click',e=>{ if(e.target===modal) closeComments(); });
window.addEventListener('keydown',e=>{ if(e.key==='Escape'&&modal.classList.contains('on')) closeComments(); });

function openComments(g){
  curFolder=g.folder;
  modal.querySelector('#cIco').textContent=g.icon;
  modal.querySelector('#cTitle').textContent=g.ko;
  modal.querySelector('#cSub').textContent=g.en+' · 댓글';
  cBody.value=''; cNote.textContent='누구나 로그인 없이 남길 수 있어요'; cNote.style.color='';
  modal.classList.add('on');
  loadComments(g.folder);
}
function closeComments(){ modal.classList.remove('on'); }

function setState(msg){ cList.innerHTML=''; const d=document.createElement('div'); d.className='cstate'; d.textContent=msg; cList.appendChild(d); }

async function loadComments(folder){
  setState('불러오는 중…');
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/comments?game=eq.'+encodeURIComponent(folder)+
      '&select=*&order=created_at.desc&limit=200',{headers:SUPA_H});
    if(!r.ok){ setState('댓글을 불러오지 못했어요 😢'); return; }
    const rows=await r.json();
    if(!rows.length){ setState('아직 댓글이 없어요.\n첫 의견의 주인공이 되어보세요! ✨'); return; }
    cList.innerHTML='';
    rows.forEach(row=>{
      const it=document.createElement('div'); it.className='citem';
      const meta=document.createElement('div'); meta.className='cmeta';
      const nm=document.createElement('span'); nm.className='cname'; nm.textContent=row.name||'익명';
      const tm=document.createElement('span'); tm.className='ctime'; tm.textContent=timeAgo(row.created_at);
      meta.appendChild(nm); meta.appendChild(tm);
      const tx=document.createElement('div'); tx.className='ctext'; tx.textContent=row.body; // XSS 방지: textContent
      it.appendChild(meta); it.appendChild(tx); cList.appendChild(it);
    });
  }catch(e){ setState('네트워크 오류가 발생했어요.'); }
}

async function postComment(){
  const body=cBody.value.trim(), name=cName.value.trim();
  if(body.length<1){ cNote.textContent='내용을 입력해주세요'; cNote.style.color='#ff8a8a'; return; }
  cPost.disabled=true; cPost.textContent='등록 중…';
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/comments',{method:'POST',
      headers:Object.assign({},SUPA_H,{'Content-Type':'application/json',Prefer:'return=minimal'}),
      body:JSON.stringify({game:curFolder, name:name||null, body:body})});
    if(r.ok){ cBody.value=''; cNote.textContent='등록됐어요! 고마워요 💙'; cNote.style.color='#6cff9e';
      await loadComments(curFolder);
      const b=document.querySelector('[data-cnt="'+curFolder+'"]'); if(b) b.textContent=(parseInt(b.textContent,10)||0)+1;
    } else { cNote.textContent='등록 실패 ('+r.status+')'; cNote.style.color='#ff8a8a'; }
  }catch(e){ cNote.textContent='네트워크 오류로 등록 실패'; cNote.style.color='#ff8a8a'; }
  cPost.disabled=false; cPost.textContent='등록';
}
cPost.addEventListener('click',postComment);
cBody.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter') postComment(); });

loadCounts();
</script>
