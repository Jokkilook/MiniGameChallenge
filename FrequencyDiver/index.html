<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>주파수 조향사 · Frequency Diver</title>
<style>
  :root{ --amber:#ffb638; --grn:#4dff88; --ink:#cfe8d8; --muted:#6a8a76; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#04080a;color:var(--ink);
    font-family:"Consolas","Segoe UI",monospace;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04080a}
  canvas{display:block;cursor:crosshair;background:#050a0c}

  #hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:center;
    pointer-events:none;z-index:5;font-size:12.5px}
  #hud .pill{background:rgba(8,20,16,.7);border:1px solid rgba(77,255,136,.28);border-radius:6px;padding:5px 11px;
    letter-spacing:1px;white-space:nowrap;font-weight:700;color:var(--grn)}
  #hud .bar{width:110px;height:8px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle}
  #hpbar{height:100%;background:linear-gradient(90deg,#4dff88,#ffb638)}
  #btnReset{pointer-events:auto;cursor:pointer;color:var(--amber);border-color:rgba(255,182,56,.4)}

  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;background:radial-gradient(120% 100% at 50% 30%,rgba(6,20,16,.95),rgba(2,5,6,.98))}
  .screen h1{margin:0 0 4px;font-size:clamp(26px,7vw,46px);font-weight:900;letter-spacing:3px;color:var(--grn);
    text-shadow:0 0 18px rgba(77,255,136,.5)}
  .screen .sub{color:var(--amber);letter-spacing:6px;font-size:12px;margin-bottom:14px}
  .screen p{color:#9fc4ac;font-size:14px;line-height:1.85;max-width:500px;margin:5px 0}
  .screen p b{color:var(--grn)} .screen p .a{color:var(--amber)}
  .screen kbd{background:rgba(77,255,136,.12);border:1px solid rgba(77,255,136,.3);border-radius:4px;padding:1px 6px;font-size:12px;color:var(--grn)}
  button.go{margin-top:20px;pointer-events:auto;cursor:pointer;font:inherit;font-weight:800;font-size:16px;letter-spacing:2px;
    color:#052012;background:linear-gradient(180deg,#8affb0,#3be878);border:0;padding:13px 34px;border-radius:6px;box-shadow:0 0 26px -4px #3be878}
  button.go:active{transform:translateY(1px)}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .row button{pointer-events:auto;cursor:pointer;font:inherit;font-weight:700;font-size:14px;color:var(--grn);
    background:rgba(10,26,20,.85);border:1px solid rgba(77,255,136,.3);border-radius:6px;padding:10px 18px}
  .hint{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.7}
  .stars{font-size:30px;letter-spacing:8px;margin:4px 0;color:var(--amber)}
  #tut{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);z-index:15;width:min(92vw,520px);
    background:rgba(6,18,14,.95);border:1px solid rgba(77,255,136,.4);border-radius:10px;padding:13px 18px;text-align:center;
    display:none;box-shadow:0 12px 40px rgba(0,0,0,.6)}
  #tut .st{font-size:11px;letter-spacing:2px;color:var(--amber);font-weight:800;margin-bottom:4px}
  #tut .tx{font-size:14px;line-height:1.5} #tut .tx b{color:var(--grn)}
  #tut button{margin-top:9px;cursor:pointer;font:inherit;font-weight:800;font-size:12.5px;color:#052012;
    background:linear-gradient(180deg,#8affb0,#3be878);border:0;padding:7px 18px;border-radius:5px}
  #tut .skip{background:none;color:var(--muted);text-decoration:underline;box-shadow:none;margin-left:8px}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="hud">
  <span class="pill" id="stagePill">STAGE 1</span>
  <span class="pill">HP <span class="bar"><span id="hpbar"></span></span></span>
  <span class="pill" id="syncPill">SYNC 0%</span>
  <span class="pill" id="goalPill">◆ 0/3</span>
  <span class="pill" id="btnReset">↺ RESET</span>
</div>

<div class="screen" id="title">
  <div class="sub">FREQUENCY DIVER</div>
  <h1>주파수 조향사</h1>
  <p style="color:var(--amber);letter-spacing:2px;margin-top:-2px">FM-99</p>
  <p>마우스 <b>X축=주파수(Hz)</b>, <b>Y축=신호세기</b>로 미지의 파형과 <b>동기화(Phase Lock)</b>하고,<br>
     적의 붉은 파동을 <span class="a">좌클릭 역위상 상쇄</span>로 지워 생존하라.</p>
  <p style="font-size:12.5px;color:var(--muted)"><kbd>마우스</kbd> 주파수/세기 · <kbd>좌클릭/Space</kbd> 노이즈 캔슬 · <kbd>휠</kbd> 파형 변경</p>
  <button class="go" id="startBtn">시스템 부팅</button>
  <div class="hint">🔊 소리를 켜면 잡음이 맑게 뚫리는 피드백을 느낄 수 있어요</div>
</div>

<div class="screen" id="result" style="display:none">
  <div class="sub" id="resSub">SIGNAL LOCKED</div>
  <div class="stars" id="resStars"></div>
  <h1 id="resTitle" style="font-size:clamp(24px,5vw,36px)">동기화 완료</h1>
  <p id="resMsg"></p>
  <div class="row" id="resRow"></div>
</div>

<div id="tut">
  <div class="st" id="tutStep">STEP 1 / 3</div>
  <div class="tx" id="tutTx"></div>
  <div><button id="tutSkip" class="skip">건너뛰기</button></div>
</div>

<script>
"use strict";
(function(){
/* =========================================================================
   주파수 조향사 : FM-99 — Web Audio 실시간 튜닝 오실로스코프 퍼즐
   버그 방지: 오디오 resume / resize+rect / dt기반 / 클램핑+역루프 / 리스너 1회
   ========================================================================= */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var AW=960, AH=540, DPR=1, SC=1;
function layout(){                            // [규칙2] resize 시 캔버스 크기 동기화
  DPR=Math.min(2,window.devicePixelRatio||1);
  var vw=window.innerWidth, vh=window.innerHeight;
  SC=Math.min(vw/AW,vh/AH);
  var w=Math.round(AW*SC), h=Math.round(AH*SC);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
}
window.addEventListener('resize',layout);     // [규칙5] 1회만 등록

/* ---------- 오디오 엔진 ---------- */
var AC=null, master=null, tone=null, toneGain=null, noiseGain=null, audioReady=false;
function ensureAudio(){                        // [규칙1] 첫 상호작용에서 초기화 + resume
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    // 플레이어 톤
    tone=AC.createOscillator(); tone.type='sine'; tone.frequency.value=440;
    toneGain=AC.createGain(); toneGain.gain.value=0; tone.connect(toneGain); toneGain.connect(master);
    // 화이트노이즈(잡음)
    var n=AC.sampleRate*2, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    var ns=AC.createBufferSource(); ns.buffer=b; ns.loop=true;
    var nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=1200; nf.Q.value=0.5;
    noiseGain=AC.createGain(); noiseGain.gain.value=0; ns.connect(nf); nf.connect(noiseGain); noiseGain.connect(master);
    try{ tone.start(); ns.start(); }catch(e){}
    audioReady=true;
  }
  if(AC && AC.state==='suspended'){ AC.resume(); }
}
function updateAudio(freq,sync){ if(!audioReady||!AC)return;
  var t=AC.currentTime;
  tone.frequency.setTargetAtTime(freq, t, 0.02);
  toneGain.gain.setTargetAtTime(sync*0.16, t, 0.05);       // 맞을수록 맑은 톤
  noiseGain.gain.setTargetAtTime((1-sync)*0.10, t, 0.05);  // 안 맞으면 잡음
}
function blip(freq,dur,type,vol,to){ ensureAudio(); if(!AC)return;
  var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t); if(to)o.frequency.exponentialRampToValueAtTime(Math.max(30,to),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master||AC.destination); o.start(t); o.stop(t+dur+0.02); }
function sndLock(){ blip(660,0.14,'sine',0.2,990); setTimeout(function(){blip(1320,0.2,'triangle',0.16);},100); }
function sndCancel(){ blip(1400,0.1,'sawtooth',0.14,200); }
function sndHit(){ blip(140,0.24,'square',0.18,50); }

/* ---------- 파형 ---------- */
var WAVES=['sine','square','sawtooth','triangle'];
function waveY(type,phase){ // -1..1
  var p=((phase%1)+1)%1;
  if(type==='sine')return Math.sin(p*6.2832);
  if(type==='square')return p<0.5?1:-1;
  if(type==='sawtooth')return 2*p-1;
  return p<0.5?(4*p-1):(3-4*p); // triangle
}

/* ---------- 상태 ---------- */
var FMIN=100, FMAX=2000;
var CONSOLE={x:AW/2, y:AH-70};
var mode='title', sim=null, tutStep=0;

function makeSim(stage){
  var s={ stage:stage, hp:100, myFreq:800, myGain:0.5, myWave:'sine', sync:0, invPhase:0,
    signals:[], enemy:null, projectiles:[], particles:[], cancelRings:[],
    extracted:0, win:false, dead:false, t:0, cancelCd:0, flash:0, lockTimer:0 };
  if(stage===0){ // Stage1: 3 비밀 신호
    s.signals=[ {freq:420,gain:0.72,prog:0,done:false}, {freq:1050,gain:0.42,prog:0,done:false}, {freq:1580,gain:0.86,prog:0,done:false} ];
    s.target=3;
  } else if(stage===1){ // Stage2: 이동 주파수 적
    s.enemy={freq:800,gain:0.6,wave:'sine',hp:100,maxhp:100,shootT:1.0,shootEvery:1.3, boss:false};
    s.target=100;
  } else { // Stage3: 보스(파형 순환)
    s.enemy={freq:900,gain:0.65,wave:'sine',hp:150,maxhp:150,shootT:0.8,shootEvery:1.0, boss:true, waveT:0, waveIdx:0};
    s.target=150;
  }
  return s;
}

/* 동기화 계산 */
function calcSyncTo(s,t){
  var fTol=75, fm=Math.max(0,1-Math.abs(s.myFreq-t.freq)/fTol);
  var gm=Math.max(0,1-Math.abs(s.myGain-t.gain)/0.4);
  var wm=t.wave?(s.myWave===t.wave?1:0.45):1;
  return fm*gm*wm;
}
function activeTarget(s){
  if(s.stage===0){ var best=null,bs=-1; for(var i=0;i<s.signals.length;i++){ if(s.signals[i].done)continue;
    var v=calcSyncTo(s,s.signals[i]); if(v>bs){bs=v;best=s.signals[i];} } return best; }
  return s.enemy && s.enemy.hp>0 ? s.enemy : null;
}

/* ---------- 시뮬 스텝 (dt 기반 [규칙3]) ---------- */
function stepSim(s,dt){
  if(s.win||s.dead)return; s.t+=dt;
  if(s.cancelCd>0)s.cancelCd-=dt; if(s.flash>0)s.flash-=dt;
  // 적 주파수 이동/발사
  if(s.enemy && s.enemy.hp>0){ var e=s.enemy;
    if(s.stage===1){ e.freq=800+700*(0.5+0.5*Math.sin(s.t*0.9)); }
    else if(s.stage===2){ e.freq=700+900*(0.5+0.5*Math.sin(s.t*0.7));
      e.waveT+=dt; if(e.waveT>3.2){ e.waveT=0; e.waveIdx=(e.waveIdx+1)%3; e.wave=WAVES[e.waveIdx]; blip(300,0.1,'square',0.1); } }
    e.shootT-=dt; if(e.shootT<=0){ e.shootT=e.shootEvery;
      var ang=Math.atan2(CONSOLE.y-140-CONSOLE.y, 0); // 아래로
      s.projectiles.push({x:CONSOLE.x+(Math.random()*300-150), y:120, vy:130+Math.random()*40, freq:e.freq, r:16, hit:false});
    }
  }
  // 동기화
  var tgt=activeTarget(s); s.sync = tgt? calcSyncTo(s,tgt) : 0;
  // Stage1: 신호 추출
  if(s.stage===0 && tgt){ if(s.sync>=0.95){ tgt.prog=Math.min(1,tgt.prog+dt/1.1); s.flash=Math.max(s.flash,0.05);
      if(tgt.prog>=1 && !tgt.done){ tgt.done=true; s.extracted++; sndLock(); burst(s,CONSOLE.x,CONSOLE.y-140,'#4dff88',30);
        if(s.extracted>=3)s.win=true; } }
    else { tgt.prog=Math.max(0,tgt.prog-dt*0.5); } }
  // Stage2/3: 동기화 시 데미지
  if((s.stage===1||s.stage===2) && s.enemy && s.enemy.hp>0){ var thr=s.stage===2?0.9:0.9;
    if(s.sync>=thr){ s.enemy.hp-=(s.stage===2?24:30)*dt; s.enemy.hurt=0.1;
      if(Math.random()<0.4)burst(s,s.enemy.x||CONSOLE.x,140,'#4dff88',3);
      if(s.enemy.hp<=0){ s.enemy.hp=0; s.win=true; sndLock(); burst(s,CONSOLE.x,150,'#ffb638',60); } } }
  // 투사체 이동 [규칙3 dt] + 콘솔 피격
  for(var p=s.projectiles.length-1;p>=0;p--){ var pr=s.projectiles[p];
    pr.y+=pr.vy*dt;
    if(pr.y>=CONSOLE.y-18){ // 피격
      if(!pr.hit){ s.hp-=12; s.flash=0.12; sndHit(); burst(s,pr.x,CONSOLE.y,'#ff5a5a',10);
        if(s.hp<=0){ s.hp=0; s.dead=true; } }
      s.projectiles.splice(p,1); continue;
    }
    if(pr.y<-40||pr.y>AH+40) s.projectiles.splice(p,1);   // [규칙4] 경계 밖 제거
  }
  // 파티클 [규칙4 역루프]
  for(var i=s.particles.length-1;i>=0;i--){ var pt=s.particles[i]; pt.life-=dt*1.8; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vx*=0.94; pt.vy*=0.94; if(pt.life<=0)s.particles.splice(i,1); }
  for(var r=s.cancelRings.length-1;r>=0;r--){ var cr=s.cancelRings[r]; cr.rad+=380*dt; cr.life-=dt*1.6; if(cr.life<=0)s.cancelRings.splice(r,1); }
  // 클램프 [규칙4]
  s.hp=Math.max(0,Math.min(100,s.hp));
  s.myFreq=Math.max(FMIN,Math.min(FMAX,s.myFreq)); s.myGain=Math.max(0,Math.min(1,s.myGain));
}
function burst(s,x,y,c,n){ for(var i=0;i<n;i++){ var a=Math.random()*6.28,sp=60+Math.random()*200;
  s.particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,c:(i%3===0?'#fff':c)}); } }

/* 노이즈 캔슬 */
function doCancel(s){
  if(s.cancelCd>0||s.win||s.dead)return; s.cancelCd=0.12; s.cancelRings.push({rad:20,life:1});
  sndCancel(); var any=false;
  var CR=170, FTOL=140;
  for(var p=s.projectiles.length-1;p>=0;p--){ var pr=s.projectiles[p];
    var d=Math.hypot(pr.x-CONSOLE.x, pr.y-CONSOLE.y);
    if(d<CR && Math.abs(s.myFreq-pr.freq)<FTOL){ // 역위상 + 주파수 매칭
      burst(s,pr.x,pr.y,'#ffb638',16); s.projectiles.splice(p,1); any=true; s._canceled=(s._canceled||0)+1;
    }
  }
  if(any){ s.flash=Math.max(s.flash,0.06); }
}

/* ---------- 입력 [규칙5] 1회 등록 ---------- */
function tuneFromClient(clientX,clientY){ if(!sim)return;
  var r=cv.getBoundingClientRect();                       // [규칙2] rect 재계산
  var x=(clientX-r.left)/r.width*AW, y=(clientY-r.top)/r.height*AH;
  x=Math.max(0,Math.min(AW,x)); y=Math.max(0,Math.min(AH,y));
  sim.myFreq=FMIN+(x/AW)*(FMAX-FMIN);
  sim.myGain=1-(y/AH);
}
cv.addEventListener('mousemove',function(e){ tuneFromClient(e.clientX,e.clientY); });
cv.addEventListener('mousedown',function(e){ ensureAudio(); if(sim&&(mode==='play'||mode==='tut'||mode==='tutwait'))doCancel(sim); });
cv.addEventListener('wheel',function(e){ e.preventDefault(); if(!sim)return; var i=WAVES.indexOf(sim.myWave);
  i=(i+(e.deltaY>0?1:WAVES.length-1))%WAVES.length; sim.myWave=WAVES[i]; blip(500,0.05,'triangle',0.08); },{passive:false});
window.addEventListener('keydown',function(e){ ensureAudio();
  if(e.key===' '){ if(sim&&(mode==='play'||mode==='tut'||mode==='tutwait')){doCancel(sim);} e.preventDefault(); }
  if(e.key.toLowerCase()==='a'){ if(sim)sim.myWave=WAVES[(WAVES.indexOf(sim.myWave)+WAVES.length-1)%WAVES.length]; }
  if(e.key.toLowerCase()==='d'){ if(sim)sim.myWave=WAVES[(WAVES.indexOf(sim.myWave)+1)%WAVES.length]; }
});
document.getElementById('btnReset').addEventListener('click',function(){ if(mode==='tut'||mode==='tutwait')loadTut(); else if(sim)startStage(sim.stage); });

/* ---------- 스테이지/튜토리얼 ---------- */
var STAGES=[{name:'STAGE 1',sub:'비밀 주파수 포착'},{name:'STAGE 2',sub:'이동 주파수 괴물'},{name:'STAGE 3',sub:'삼중 공명 보스'}];
function startStage(i){ sim=makeSim(i); mode='play'; document.getElementById('stagePill').textContent=STAGES[i].name; sim._done=false; updHud(); }
function startTut(){ tutStep=0; mode='tut'; document.getElementById('tut').style.display='block'; loadTut(); }
var TUT=[
  {tx:'마우스를 <b>좌우로</b> 움직여 주파수를 맞추고, 오실로스코프의 두 파형을 하나로 합치세요! (주파수 SYNC)',
   setup:function(){ sim=makeSim(0); sim.signals=[{freq:1000,gain:0.5,prog:0,done:false}]; sim.target=1; sim.tutFreqOnly=true; },
   check:function(s){ var t=s.signals[0]; return Math.abs(s.myFreq-t.freq)<80; }},
  {tx:'이제 <b>마우스를 위아래로</b> 움직여 신호 세기까지 맞춰 <b>SYNC 95%</b> LOCK-ON!',
   setup:function(){ sim=makeSim(0); sim.signals=[{freq:1000,gain:0.7,prog:0,done:false}]; sim.target=1; },
   check:function(s){ return s.sync>=0.95; }},
  {tx:'적의 <b>붉은 파동</b>이 다가올 때 <b>좌클릭</b>으로 역위상 파동을 쏘아 상쇄하세요!',
   setup:function(){ sim=makeSim(0); sim.signals=[]; sim.tutCancel=true; sim._spawnT=0; },
   check:function(s){ return s._canceled>=1; }},
];
function loadTut(){ var st=TUT[tutStep]; st.setup(); mode='tut';
  document.getElementById('tutStep').textContent='STEP '+(tutStep+1)+' / 3'; document.getElementById('tutTx').innerHTML=st.tx; updHud(); }
function tutTick(dt){ if((mode!=='tut'&&mode!=='tutwait')||!sim)return;
  // 튜토리얼 3: 투사체 스폰 + 상쇄 카운트
  if(sim.tutCancel){ sim._spawnT=(sim._spawnT||0)-dt; if(sim._spawnT<=0 && sim.projectiles.length===0){ sim._spawnT=1.6;
      sim.projectiles.push({x:CONSOLE.x,y:120,vy:90,freq:sim.myFreq,r:16,hit:false}); }
    // 상쇄 감지: 직전 프레임 대비 제거 확인은 doCancel에서 처리 → 여기선 카운트 플래그
  }
  if(TUT[tutStep].check(sim)){ tutStep++;
    if(tutStep>=TUT.length){ mode='play'; document.getElementById('tut').style.display='none'; setTimeout(function(){startStage(0);},700); }
    else { mode='tutwait'; setTimeout(function(){ loadTut(); },500); } }
}
document.getElementById('tutSkip').addEventListener('click',function(){ document.getElementById('tut').style.display='none'; startStage(0); });

/* HUD/결과 */
function updHud(){ if(!sim)return; document.getElementById('hpbar').style.width=sim.hp+'%';
  document.getElementById('syncPill').textContent='SYNC '+Math.round(sim.sync*100)+'%';
  document.getElementById('syncPill').style.color=sim.sync>=0.9?'#4dff88':(sim.sync>=0.5?'#ffb638':'#6a8a76');
  var g;
  if(sim.stage===0)g='◆ '+sim.extracted+'/3';
  else if(sim.enemy)g='HP '+Math.max(0,Math.round(sim.enemy.hp/sim.enemy.maxhp*100))+'%';
  else g='';
  document.getElementById('goalPill').textContent=g; }
function endStage(win){ mode='result'; var i=sim.stage;
  if(win){ document.getElementById('resSub').textContent=STAGES[i].name+' CLEAR';
    document.getElementById('resStars').textContent= sim.hp>=70?'★★★':sim.hp>=35?'★★☆':'★☆☆';
    document.getElementById('resTitle').textContent= i>=2?'보스 침묵! 🎉':'동기화 완료';
    document.getElementById('resMsg').textContent='신호 안정도 '+Math.round(sim.hp)+'%'; sndLock();
  } else { document.getElementById('resSub').textContent=STAGES[i].name+' 실패';
    document.getElementById('resStars').textContent='☆☆☆'; document.getElementById('resTitle').textContent='신호 소실';
    document.getElementById('resMsg').textContent='잡음에 잠식됐다 — 재시도!'; blip(150,0.4,'sawtooth',0.16,50); }
  var row=document.getElementById('resRow'); row.innerHTML=''; var last=i>=STAGES.length-1;
  if(win&&!last) row.appendChild(mkbtn('다음 스테이지 →',function(){hide('result');startStage(i+1);}));
  if(win&&last) row.appendChild(mkbtn('처음부터',function(){hide('result');startStage(0);}));
  row.appendChild(mkbtn(win?'이 판 다시':'재시도',function(){hide('result');startStage(i);}));
  show('result');
}
function mkbtn(t,fn){ var b=document.createElement('button'); b.textContent=t; b.onclick=fn; return b; }
function show(id){document.getElementById(id).style.display='flex';}
function hide(id){document.getElementById(id).style.display='none';}

/* ---------- 루프 (단일 rAF, dt 기반 [규칙3/5]) ---------- */
var last=0;
function loop(now){ if(!last)last=now; var dt=Math.min(0.05,(now-last)/1000); last=now;   // [규칙3] dt 클램프
  if((mode==='play'||mode==='tut'||mode==='tutwait') && sim){
    stepSim(sim,dt); updateAudio(sim.myFreq, sim.sync); updHud();
    if(mode==='tut'||mode==='tutwait') tutTick(dt);
    if(sim.dead&&!sim._done){ sim._done=true; if(mode==='play')setTimeout(function(){endStage(false);},600); else setTimeout(loadTut,700); }
    if(sim.win&&!sim._done&&mode==='play'){ sim._done=true; setTimeout(function(){endStage(true);},700); }
  } else { updateAudio(800,0); }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 렌더 (CRT 오실로스코프) ---------- */
function render(){
  ctx.clearRect(0,0,AW,AH); ctx.fillStyle='#050a0c'; ctx.fillRect(0,0,AW,AH);
  if(!sim){ return; }
  // 스캔라인
  ctx.fillStyle='rgba(77,255,136,.025)'; for(var y=0;y<AH;y+=3)ctx.fillRect(0,y,AW,1);
  // 오실로스코프 프레임
  var ox=140, oy=110, ow=AW-280, oh=200;
  ctx.strokeStyle='rgba(77,255,136,.35)'; ctx.lineWidth=2; ctx.strokeRect(ox,oy,ow,oh);
  ctx.strokeStyle='rgba(77,255,136,.1)'; ctx.lineWidth=1;
  for(var gx=ox;gx<ox+ow;gx+=40){ctx.beginPath();ctx.moveTo(gx,oy);ctx.lineTo(gx,oy+oh);ctx.stroke();}
  for(var gy=oy;gy<oy+oh;gy+=40){ctx.beginPath();ctx.moveTo(ox,gy);ctx.lineTo(ox+ow,gy);ctx.stroke();}
  ctx.save(); ctx.beginPath(); ctx.rect(ox,oy,ow,oh); ctx.clip();
  var midY=oy+oh/2;
  var tgt=activeTarget(sim);
  // 타겟 파형(앰버)
  if(tgt){ drawWave(ox,ow,midY,oh, tgt.wave||'sine', tgt.freq, tgt.gain, sim.t*2, 'rgba(255,182,56,.85)', 2); }
  // 내 파형(그린)
  drawWave(ox,ow,midY,oh, sim.myWave, sim.myFreq, sim.myGain, sim.t*2, 'rgba(77,255,136,.95)', 2);
  ctx.restore();
  // 오실로 라벨
  ctx.fillStyle='rgba(77,255,136,.6)'; ctx.font='11px Consolas'; ctx.textAlign='left';
  ctx.fillText('FREQ '+Math.round(sim.myFreq)+' Hz   GAIN '+Math.round(sim.myGain*100)+'%   WAVE '+sim.myWave.toUpperCase(), ox+6, oy+16);
  if(tgt){ ctx.fillStyle='rgba(255,182,56,.7)'; ctx.textAlign='right'; ctx.fillText('TARGET '+Math.round(tgt.freq)+' Hz'+(tgt.wave?(' / '+tgt.wave.toUpperCase()):''), ox+ow-6, oy+16); }
  // SYNC 게이지
  var sy=oy+oh+16; ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(ox,sy,ow,10);
  ctx.fillStyle=sim.sync>=0.95?'#4dff88':(sim.sync>=0.6?'#ffb638':'#ff5a5a'); ctx.fillRect(ox,sy,ow*sim.sync,10);
  ctx.strokeStyle='rgba(77,255,136,.4)'; ctx.lineWidth=1; ctx.strokeRect(ox,sy,ow,10);
  // 95% 기준선
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.moveTo(ox+ow*0.95,sy-2); ctx.lineTo(ox+ow*0.95,sy+12); ctx.stroke();

  // Stage1 신호 목록
  if(sim.stage===0){ for(var i=0;i<sim.signals.length;i++){ var sg=sim.signals[i]; var bx=ox+i*(ow/3)+10, by=oy+oh+50;
    ctx.fillStyle=sg.done?'#4dff88':'rgba(255,182,56,.7)'; ctx.font='11px Consolas'; ctx.textAlign='left';
    ctx.fillText((sg.done?'✔':'◆')+' SIG'+(i+1)+' '+sg.freq+'Hz', bx, by);
    ctx.fillStyle='rgba(255,255,255,.1)'; ctx.fillRect(bx,by+6,ow/3-30,6);
    ctx.fillStyle=sg.done?'#4dff88':'#ffb638'; ctx.fillRect(bx,by+6,(ow/3-30)*sg.prog,6); } }

  // 적/보스
  if(sim.enemy && sim.enemy.hp>0){ var e=sim.enemy; var exx=CONSOLE.x, eyy=60;
    ctx.save(); ctx.shadowColor='#ff5a5a'; ctx.shadowBlur=e.hurt>0?20:12;
    ctx.fillStyle=e.hurt>0?'#fff':(e.boss?'#7a2030':'#5a2028'); ctx.strokeStyle='#ff5a5a'; ctx.lineWidth=2;
    var er=e.boss?42:26; ctx.beginPath(); ctx.arc(exx,eyy,er,0,6.28); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#ff9a9a'; ctx.font='10px Consolas'; ctx.textAlign='center'; ctx.fillText(Math.round(e.freq)+'Hz'+(e.boss?(' '+e.wave.toUpperCase()):''), exx, eyy-er-6);
    if(e.hurt>0)e.hurt-=0.016;
  }
  // 투사체(붉은 파동)
  for(var p=0;p<sim.projectiles.length;p++){ var pr=sim.projectiles[p];
    ctx.save(); ctx.strokeStyle='#ff5a5a'; ctx.lineWidth=2; ctx.shadowColor='#ff3a3a'; ctx.shadowBlur=8;
    ctx.beginPath(); for(var wx=-16;wx<=16;wx+=2){ var yy=pr.y+Math.sin((wx+sim.t*200)*0.4)*5; if(wx===-16)ctx.moveTo(pr.x+wx,yy);else ctx.lineTo(pr.x+wx,yy); } ctx.stroke(); ctx.restore(); }
  // 캔슬 링
  for(var c=0;c<sim.cancelRings.length;c++){ var cr=sim.cancelRings[c]; ctx.save(); ctx.globalAlpha=Math.max(0,cr.life)*0.6;
    ctx.strokeStyle='#4dff88'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(CONSOLE.x,CONSOLE.y,cr.rad,0,6.28); ctx.stroke(); ctx.restore(); }
  // 파티클
  for(var pa=0;pa<sim.particles.length;pa++){ var pt=sim.particles[pa]; ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.c;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,2.4,0,6.28); ctx.fill(); } ctx.globalAlpha=1;
  // 콘솔(플레이어)
  ctx.save(); ctx.shadowColor='#4dff88'; ctx.shadowBlur=12; ctx.fillStyle='#0d2a1c'; ctx.strokeStyle='#4dff88'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(CONSOLE.x-30,CONSOLE.y+16); ctx.lineTo(CONSOLE.x,CONSOLE.y-16); ctx.lineTo(CONSOLE.x+30,CONSOLE.y+16); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#4dff88'; ctx.beginPath(); ctx.arc(CONSOLE.x,CONSOLE.y,4,0,6.28); ctx.fill(); ctx.restore();
  // 피격 붉은 플래시
  if(sim.flash>0){ ctx.save(); ctx.globalAlpha=Math.min(0.4,sim.flash*2); ctx.fillStyle=sim.sync>=0.95?'#4dff88':'#ff3a3a'; ctx.fillRect(0,0,AW,AH); ctx.restore(); }
  ctx.textAlign='left';
}
function drawWave(ox,ow,midY,oh,type,freq,gain,phase,color,lw){
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath();
  var cycles=freq/180; var amp=(oh/2-8)*Math.max(0.08,gain);
  for(var px=0;px<=ow;px+=2){ var t=px/ow; var yy=midY - waveY(type, t*cycles + phase)*amp;
    if(px===0)ctx.moveTo(ox+px,yy); else ctx.lineTo(ox+px,yy); }
  ctx.stroke();
}

document.getElementById('startBtn').addEventListener('click',function(){ ensureAudio(); hide('title'); startTut(); });
layout(); requestAnimationFrame(loop);

/* ---------- 검증 노출 ---------- */
window.__freq={ makeSim:makeSim, stepSim:stepSim, calcSyncTo:calcSyncTo, activeTarget:activeTarget, doCancel:doCancel,
  WAVES:WAVES, CONSOLE:CONSOLE,
  setTune:function(s,f,g,w){ s.myFreq=f; s.myGain=g; if(w)s.myWave=w; },
  addProj:function(s,x,freq){ s.projectiles.push({x:x,y:CONSOLE.y-30,vy:100,freq:freq,r:16,hit:false}); },
  // 오토파일럿 검증
  runBot:function(si){ var s=makeSim(si); var dt=1/60;
    for(var f=0;f<60*60;f++){
      // 타겟에 맞춤
      var t=activeTarget(s); if(t){ s.myFreq=t.freq; s.myGain=t.gain; if(t.wave)s.myWave=t.wave; }
      // 다가오는 투사체 상쇄(주파수 맞춰 클릭)
      for(var p=0;p<s.projectiles.length;p++){ var pr=s.projectiles[p];
        if(pr.y>s.CONSOLE?0:0){} }
      var near=s.projectiles.some(function(pr){ return Math.hypot(pr.x-CONSOLE.x,pr.y-CONSOLE.y)<160; });
      if(near && s.cancelCd<=0){ // 주파수를 투사체에 맞춰 상쇄(가장 가까운 것)
        var np=null,nd=1e9; for(var q=0;q<s.projectiles.length;q++){var d=Math.hypot(s.projectiles[q].x-CONSOLE.x,s.projectiles[q].y-CONSOLE.y); if(d<nd){nd=d;np=s.projectiles[q];}}
        if(np){ s.myFreq=np.freq; doCancel(s); if(t){/* 재동기화는 다음 프레임 */} }
      }
      stepSim(s,dt);
      if(s.win) return {win:true, hp:Math.round(s.hp), t:Math.round(f/60)};
      if(s.dead) return {win:false, dead:true, t:Math.round(f/60)};
    }
    return {win:false, timeout:true, hp:Math.round(s.hp), extracted:s.extracted, enemyHp:s.enemy?Math.round(s.enemy.hp):null}; }
};
})();
</script>
