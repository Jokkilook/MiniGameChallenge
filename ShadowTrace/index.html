<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>섀도우 트레이스 · Shadow Trace</title>
<style>
  :root{ --ink:#eaf2ff; --muted:#8792c4; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#04060e;color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04060e}
  canvas{display:block;touch-action:none}

  #hud{position:fixed;top:0;left:0;right:0;padding:12px 14px;display:flex;gap:9px;align-items:center;
    justify-content:center;pointer-events:none;font-size:13px;z-index:5}
  #hud .pill{background:rgba(12,18,40,.6);border:1px solid rgba(120,150,230,.25);border-radius:20px;
    padding:5px 12px;letter-spacing:.5px;backdrop-filter:blur(5px);white-space:nowrap}
  #hud .pill b{color:#9ff0ff}
  #timePill{display:none} #timePill.on{display:inline-block} #timePill.warn{color:#ff8a8a;border-color:rgba(255,120,120,.5)}
  #btnReset{pointer-events:auto;cursor:pointer}

  #toast{position:fixed;top:52%;left:50%;transform:translate(-50%,-50%) scale(.8);z-index:8;pointer-events:none;
    font-weight:800;font-size:clamp(20px,5vw,30px);letter-spacing:1px;opacity:0;text-align:center;
    text-shadow:0 2px 12px rgba(0,0,0,.7)}
  #toast.show{animation:toastA 1.1s ease-out}
  @keyframes toastA{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
    75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:26px;background:radial-gradient(120% 100% at 50% 35%,rgba(10,16,40,.92),rgba(3,4,10,.97))}
  .screen h1{margin:0 0 4px;font-size:clamp(28px,7.5vw,50px);font-weight:900;letter-spacing:2px;
    background:linear-gradient(180deg,#fff,#8fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .screen .sub{color:#8792c4;letter-spacing:6px;font-size:12px;margin-bottom:16px}
  .screen p{color:#b6c0e6;font-size:14.5px;line-height:1.85;max-width:450px;margin:5px 0}
  .screen p b{color:#9ff0ff}
  button.go{margin-top:22px;pointer-events:auto;cursor:pointer;font:inherit;font-weight:800;font-size:16px;letter-spacing:1px;
    color:#05121e;background:linear-gradient(180deg,#bff0ff,#5cc8ff);border:0;padding:14px 34px;border-radius:30px;
    box-shadow:0 10px 30px -8px #37a8ff}
  button.go:active{transform:translateY(1px)}
  .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  .row button{pointer-events:auto;cursor:pointer;font:inherit;font-weight:700;font-size:14px;color:#dbe4ff;
    background:rgba(20,28,58,.85);border:1px solid rgba(120,150,230,.3);border-radius:12px;padding:11px 20px}
  .row button:active{transform:scale(.95)}
  .hint{color:#5c648f;font-size:12px;margin-top:16px;line-height:1.7}
  .stars{font-size:32px;letter-spacing:8px;margin:6px 0 4px}
  .em{font-size:30px;letter-spacing:6px;margin:8px 0}

  /* tutorial box */
  #tut{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);z-index:15;width:min(88vw,430px);
    background:rgba(14,20,46,.94);border:1px solid rgba(120,150,230,.4);border-radius:16px;padding:15px 18px;
    text-align:center;display:none;box-shadow:0 16px 46px rgba(0,0,0,.6)}
  #tut .st{font-size:11px;letter-spacing:2px;color:#5cc8ff;font-weight:800;margin-bottom:5px}
  #tut .tx{font-size:15px;line-height:1.6}
  #tut .tx b{color:#9ff0ff}
  #tut button{margin-top:12px;cursor:pointer;font:inherit;font-weight:800;font-size:14px;color:#05121e;
    background:linear-gradient(180deg,#bff0ff,#5cc8ff);border:0;padding:9px 22px;border-radius:20px}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="hud">
  <span class="pill" id="stagePill">STAGE 1</span>
  <span class="pill" id="triesPill">시도 <b>0</b></span>
  <span class="pill" id="timePill">⏱ <b>10.0</b></span>
  <span class="pill" id="btnReset">↺</span>
</div>

<div id="toast"></div>

<!-- title -->
<div class="screen" id="title">
  <div class="sub">SHADOW TRACE</div>
  <h1>섀도우 트레이스</h1>
  <p style="color:#8fd8ff;letter-spacing:2px;margin-top:-2px">잔상의 연금술사</p>
  <p><b>1초마다</b> 순간 밝혀지는 빛의 길을 기억하고,<br>암흑 속을 손끝으로 <b>더듬어 그려</b> 출구까지 도달하라.</p>
  <div class="em">✦ &nbsp; ✧ &nbsp; ✦</div>
  <button class="go" id="startBtn">튜토리얼 시작</button>
  <div class="hint">누른 채로 EXIT까지 한 번에 · 떼거나 벗어나면 처음부터</div>
</div>

<!-- result -->
<div class="screen" id="result" style="display:none">
  <div class="sub" id="resSub">CLEAR</div>
  <div class="stars" id="resStars"></div>
  <h1 id="resTitle">클리어!</h1>
  <p id="resMsg"></p>
  <div class="row" id="resRow"></div>
</div>

<!-- tutorial box -->
<div id="tut">
  <div class="st" id="tutStep">STEP 1 / 3</div>
  <div class="tx" id="tutTx"></div>
  <button id="tutBtn">다음</button>
</div>

<script>
"use strict";
(function(){
/* =========================================================================
   섀도우 트레이스 : 잔상의 연금술사 — Pure Canvas 2D (단일 파일)
   ========================================================================= */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var AW=800, AH=560, DPR=1, SC=1, OX=0, OY=0;
function layout(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  var vw=window.innerWidth, vh=window.innerHeight;
  SC=Math.min(vw/AW,vh/AH);
  var w=Math.round(AW*SC), h=Math.round(AH*SC);
  OX=Math.round((vw-w)/2); OY=Math.round((vh-h)/2);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
}
window.addEventListener('resize',layout);

/* ---------- 오디오 ---------- */
var AC=null;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(freq,dur,type,vol,to,delay){ var ac=audio(); if(!ac)return;
  var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(30,to),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02); }
function sndPulse(){ tone(1400,0.18,'sine',0.05,2100); tone(2100,0.14,'sine',0.03); }
function sndFail(){ tone(150,0.4,'sawtooth',0.22,50); tone(90,0.5,'square',0.14,40); }
function sndWin(){ [660,880,1100,1320,1600].forEach(function(f,i){ tone(f,0.16,'triangle',0.16,null,i*0.07); }); }
function sndSwitch(){ tone(880,0.1,'square',0.14,1320); tone(1320,0.14,'triangle',0.12,null,0.06); }
function vibrate(ms){ try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){} }

/* ---------- Catmull-Rom 스플라인 ---------- */
function catmull(P, per){
  var pts=[], n=P.length, cp=[P[0]].concat(P).concat([P[n-1]]);
  for(var i=1;i<cp.length-2;i++){
    var p0=cp[i-1],p1=cp[i],p2=cp[i+1],p3=cp[i+2];
    for(var s=0;s<per;s++){ var t=s/per,t2=t*t,t3=t2*t;
      var x=0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
      var y=0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
      pts.push([x,y]); }
  }
  pts.push(P[n-1]); return pts;
}
function distSeg(px,py,ax,ay,bx,by){
  var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  var t = l2>0 ? ((px-ax)*dx+(py-ay)*dy)/l2 : 0; t=Math.max(0,Math.min(1,t));
  var cx=ax+dx*t, cy=ay+dy*t; return {d:Math.hypot(px-cx,py-cy), t:t};
}
function distToPath(pts,px,py){
  var best=1e9, bi=0, bt=0;
  for(var i=0;i<pts.length-1;i++){ var r=distSeg(px,py,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]);
    if(r.d<best){best=r.d;bi=i;bt=r.t;} }
  return {d:best, idx:bi+bt};   // idx: 진행 파라미터(세그먼트 기준)
}
function pathLen(pts){ var L=0; for(var i=0;i<pts.length-1;i++)L+=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]); return L; }

/* ---------- 레벨 ---------- */
function makeLevel(cfg){
  var pts=catmull(cfg.controls, cfg.per||14);
  var lv={ pts:pts, R:cfg.R, start:pts[0], exit:pts[pts.length-1],
    watchers:(cfg.watchers||[]).map(function(w){return Object.assign({},w);}),
    timeLimit:cfg.timeLimit||0, len:pathLen(pts) };
  if(cfg.switchFrac!=null){ var si=Math.floor(cfg.switchFrac*(pts.length-1)); lv.sw={x:pts[si][0],y:pts[si][1],on:false}; }
  return lv;
}
var LV_CFG={
  tut:{ controls:[[150,410],[300,345],[480,275],[650,195]], R:28 },
  s1:{ controls:[[130,470],[130,300],[400,300],[400,150],[690,150],[690,470]], R:25 },
  s2:{ controls:[[160,120],[160,450],[640,450],[640,120]], R:25,
       watchers:[{x:400,cy:450,amp:120,w:1.7,ph:0,r:17,axis:'y'}] },
  s3:{ controls:[[110,120],[110,440],[350,440],[350,150],[590,150],[590,440],[720,440],[720,150]], R:22,
       switchFrac:0.52, timeLimit:10 },
};

/* ---------- 상태 ---------- */
var mode='title';      // title | tutorial | play | anim
var lv=null, stageIdx=0, tutStep=0;
var pulseT=0;          // 0..1 주기(1초)
var tracing=false, trail=[], particles=[], tries=0;
var timeLeft=0, timerRunning=false;
var glitchT=0, flashT=0, shake=0, gameT=0;
var STAGES=[ {key:'s1',name:'STAGE 1',sub:'기억과 직관'},
             {key:'s2',name:'STAGE 2',sub:'움직이는 감시자'},
             {key:'s3',name:'STAGE 3',sub:'스위치 & 타임어택'} ];

function pulseBright(t){ if(t<0.20)return 1; if(t<0.55)return 1-(t-0.20)/0.35; return 0; }

/* ---------- 좌표 변환 ---------- */
function toLogic(cx,cy){ return {x:(cx-OX)/SC, y:(cy-OY)/SC}; }

/* ---------- 트레이스 시작/판정 ---------- */
function nearStart(x,y){ return Math.hypot(x-lv.start[0],y-lv.start[1]) < lv.R*1.7; }
function beginTrace(x,y){
  if(tracing) return;
  if(!nearStart(x,y)){ toast('출발점(START)을 누르세요','#9ff0ff'); return; }
  tracing=true; trail=[[x,y,0]];
  if(lv.timeLimit){ timeLeft=lv.timeLimit; timerRunning=true; }
  tone(520,0.08,'triangle',0.1,760);
}
function moveTrace(x,y){
  if(!tracing) return;
  trail.push([x,y,0]); if(trail.length>140) trail.shift();
  // 입자
  for(var k=0;k<2;k++) particles.push({x:x+(Math.random()*8-4),y:y+(Math.random()*8-4),
     vx:(Math.random()*2-1)*20,vy:(Math.random()*2-1)*20,life:1,c:'#6fe0ff'});
  // 경로 이탈 판정
  var r=distToPath(lv.pts,x,y);
  if(r.d > lv.R){ failTrace('벽에 닿았다'); return; }
  // 감시자 충돌
  for(var i=0;i<lv.watchers.length;i++){ var w=lv.watchers[i];
    if(Math.hypot(x-w._x,y-w._y) < w.r+8){ failTrace('감시자에게 들켰다'); return; } }
  // 스위치
  if(lv.sw && !lv.sw.on && Math.hypot(x-lv.sw.x,y-lv.sw.y)<lv.R){ lv.sw.on=true; sndSwitch(); vibrate(20);
    burst(lv.sw.x,lv.sw.y,'#8fffcf',20); toast('스위치 ON! 출구 개방','#8fffcf'); }
  // 출구 도달
  var atExit=Math.hypot(x-lv.exit[0],y-lv.exit[1]) < lv.R*1.25;
  if(atExit && r.idx > (lv.pts.length-1)*0.6 && (!lv.sw || lv.sw.on)){ winStage(); }
}
function endTrace(){ if(!tracing)return; if(mode==='play'){ tracing=false; timerRunning=false; trail=[]; } }

function failTrace(reason){
  tracing=false; timerRunning=false;
  glitchT=0.45; flashT=0.35; shake=10; tries++;
  document.querySelector('#triesPill b').textContent=tries;
  sndFail(); vibrate([40,30,70]);
  toast(reason+' — 처음부터','#ff8a8a');
  trail=[];
  if(lv.sw) lv.sw.on=false;
}
function winStage(){
  tracing=false; timerRunning=false; mode='anim';
  sndWin(); vibrate([20,40,20,40,60]);
  burst(lv.exit[0],lv.exit[1],'#8fffcf',44);
  flashT=0.2;
  if(mode2==='tutorial'){ /* not used */ }
  setTimeout(showResult, 700);
}

/* ---------- 튜토리얼 ---------- */
var mode2=null;
var TUT=[
  { tx:'<b>1초마다</b> 반짝이는 빛의 길을 눈으로 따라가며 기억하세요!', btn:'다음' },
  { tx:'출발점을 <b>누른 채</b> 손을 떼지 말고 <b>EXIT까지</b> 그려 이동!', btn:null },
  { tx:'길이 어두워져도 <b>멈추지 말고</b> 기억을 믿고 그으세요!', btn:'게임 시작' },
];
function startTutorial(){
  mode2='tutorial'; mode='play'; stageIdx=-1; tutStep=0;
  lv=makeLevel(LV_CFG.tut); tries=0;
  document.querySelector('#triesPill b').textContent=0;
  document.getElementById('stagePill').textContent='TUTORIAL';
  document.getElementById('timePill').classList.remove('on');
  loadTutStep();
}
function loadTutStep(){
  var t=TUT[tutStep];
  var box=document.getElementById('tut'); box.style.display='block';
  document.getElementById('tutStep').textContent='STEP '+(tutStep+1)+' / 3';
  document.getElementById('tutTx').innerHTML=t.tx;
  var b=document.getElementById('tutBtn');
  if(t.btn){ b.style.display='inline-block'; b.textContent=t.btn; } else b.style.display='none';
  lv.sw&&(lv.sw.on=false); trail=[]; tracing=false;
}
document.getElementById('tutBtn').addEventListener('click',function(){
  if(tutStep===0){ tutStep=1; loadTutStep(); }
  else if(tutStep===2){ // 게임 시작
    document.getElementById('tut').style.display='none'; mode2=null; startStage(0);
  }
});
// 튜토리얼 step2: 실제로 그려서 출구 도달하면 step3
function tutReachedExit(){
  if(mode2==='tutorial' && tutStep===1){ tutStep=2; loadTutStep(); burst(lv.exit[0],lv.exit[1],'#8fffcf',30); sndWin(); return true; }
  return false;
}

/* ---------- 스테이지 ---------- */
function startStage(i){
  mode2=null; stageIdx=i; mode='play';
  var st=STAGES[i]; lv=makeLevel(LV_CFG[st.key]);
  tracing=false; trail=[]; particles=[]; tries=0; timerRunning=false;
  document.querySelector('#triesPill b').textContent=0;
  document.getElementById('stagePill').textContent=st.name;
  var tp=document.getElementById('timePill');
  if(lv.timeLimit){ tp.classList.add('on'); timeLeft=lv.timeLimit; tp.classList.remove('warn'); tp.querySelector('b').textContent=lv.timeLimit.toFixed(1); }
  else tp.classList.remove('on');
}
function showResult(){
  mode='result';
  var st=STAGES[stageIdx], res=document.getElementById('result');
  document.getElementById('resSub').textContent=st.name+' CLEAR';
  var stars = tries===0?'★★★' : tries<=2?'★★☆' : '★☆☆';
  document.getElementById('resStars').textContent=stars;
  document.getElementById('resTitle').textContent = tries===0?'완벽한 잔상! ✨':'클리어!';
  document.getElementById('resMsg').textContent = '시도 '+(tries+1)+'번 만에 통과'+(lv.timeLimit?(' · 남은 '+timeLeft.toFixed(1)+'초'):'');
  var row=document.getElementById('resRow'); row.innerHTML='';
  var last=stageIdx>=STAGES.length-1;
  if(!last) row.appendChild(mkbtn('다음 스테이지 →',function(){ hide('result'); startStage(stageIdx+1); }));
  else row.appendChild(mkbtn('처음부터',function(){ hide('result'); startStage(0); }));
  row.appendChild(mkbtn('이 판 다시',function(){ hide('result'); startStage(stageIdx); }));
  show('result');
}
function mkbtn(t,fn){ var b=document.createElement('button'); b.textContent=t; b.onclick=fn; return b; }

/* ---------- 입력 ---------- */
function down(x,y){ audio(); if(mode!=='play')return; beginTrace(x,y); }
function move(x,y){ if(mode!=='play')return; moveTrace(x,y); }
function up(){ if(mode!=='play')return; endTrace(); }
cv.addEventListener('pointerdown',function(e){ var p=toLogic(e.clientX,e.clientY); down(p.x,p.y); try{cv.setPointerCapture(e.pointerId);}catch(_){}} );
cv.addEventListener('pointermove',function(e){ var p=toLogic(e.clientX,e.clientY); move(p.x,p.y); });
cv.addEventListener('pointerup',function(){ up(); });
cv.addEventListener('pointercancel',function(){ up(); });
document.getElementById('btnReset').addEventListener('click',function(){
  if(mode2==='tutorial'){ loadTutStep(); }
  else if(stageIdx>=0){ startStage(stageIdx); }
});

/* ---------- 이펙트 ---------- */
function burst(x,y,c,n){ for(var i=0;i<n;i++){ var a=Math.random()*6.28,s=60+Math.random()*160;
  particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:(i%3===0?'#ffffff':c)}); } }
function toast(msg,color){ var el=document.getElementById('toast'); el.textContent=msg; el.style.color=color||'#fff';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }

/* ---------- 루프 ---------- */
var last=0;
function loop(ts){
  if(!last)last=ts; var dt=Math.min(0.05,(ts-last)/1000); last=ts; gameT+=dt;
  // 펄스
  var prev=pulseT; pulseT=(pulseT+dt/1.0)%1;
  if(prev>pulseT && (mode==='play')) sndPulse(); // 매 주기 시작에 '칭'
  // 감시자
  if(lv&&lv.watchers) for(var i=0;i<lv.watchers.length;i++){ var w=lv.watchers[i];
    if(w.axis==='y'){ w._x=w.x; w._y=w.cy+Math.sin(gameT*w.w+w.ph)*w.amp; }
    else { w._x=w.cx+Math.sin(gameT*w.w+w.ph)*w.amp; w._y=w.cy; } }
  // 타이머
  if(timerRunning && lv.timeLimit){ timeLeft-=dt; var tp=document.getElementById('timePill');
    tp.querySelector('b').textContent=Math.max(0,timeLeft).toFixed(1); tp.classList.toggle('warn',timeLeft<4);
    if(timeLeft<=0){ timeLeft=0; failTrace('시간 초과'); } }
  // 입자
  for(var p=particles.length-1;p>=0;p--){ var P=particles[p]; P.life-=dt*1.5; P.x+=P.vx*dt; P.y+=P.vy*dt; P.vx*=0.95; P.vy*=0.95; if(P.life<=0)particles.splice(p,1); }
  // 트레일 나이
  for(var q=0;q<trail.length;q++) trail[q][2]+=dt;
  while(trail.length && trail[0][2]>0.9) trail.shift();
  // 글리치/플래시/셰이크 감쇠
  if(glitchT>0)glitchT-=dt; if(flashT>0)flashT-=dt; if(shake>0)shake=Math.max(0,shake-dt*30);
  // 튜토리얼 step2 출구 판정
  if(mode2==='tutorial' && tutStep===1 && tracing){
    if(Math.hypot((trail.length?trail[trail.length-1][0]:0)-lv.exit[0],(trail.length?trail[trail.length-1][1]:0)-lv.exit[1])<lv.R*1.3){
      tracing=false; tutReachedExit();
    }
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 렌더 ---------- */
function render(){
  ctx.save();
  if(shake>0.3) ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
  ctx.clearRect(-20,-20,AW+40,AH+40);
  ctx.fillStyle='#05070f'; ctx.fillRect(0,0,AW,AH);
  if(!lv){ ctx.restore(); return; }

  var bright=pulseBright(pulseT);

  // 은은한 상시 힌트(아주 옅게)
  drawPathStroke('rgba(120,200,255,0.055)', lv.R*2, 0);
  // 펄스 발광
  if(bright>0.01){
    ctx.save(); ctx.shadowColor='rgba(120,220,255,'+bright+')'; ctx.shadowBlur=26*bright;
    drawPathStroke('rgba(120,220,255,'+(0.55*bright)+')', lv.R*2, 0);
    drawPathStroke('rgba(220,245,255,'+(0.9*bright)+')', lv.R*0.7, 0); // 중심 코어
    ctx.restore();
  }

  // 스위치
  if(lv.sw){ var sp=0.6+0.4*Math.sin(gameT*4);
    ctx.save();
    var col= lv.sw.on?'#8fffcf':'#ffd27a';
    ctx.shadowColor=col; ctx.shadowBlur=18; ctx.strokeStyle=col; ctx.lineWidth=3;
    ctx.globalAlpha= lv.sw.on?1:(0.5+0.5*bright);
    ctx.beginPath(); ctx.arc(lv.sw.x,lv.sw.y,14+ (lv.sw.on?0:sp*3),0,6.28); ctx.stroke();
    ctx.fillStyle=col; ctx.globalAlpha*=0.4; ctx.beginPath(); ctx.arc(lv.sw.x,lv.sw.y,8,0,6.28); ctx.fill();
    ctx.restore();
    ctx.fillStyle= lv.sw.on?'#8fffcf':'rgba(255,210,122,.85)'; ctx.font='10px Segoe UI'; ctx.textAlign='center';
    ctx.fillText(lv.sw.on?'ON':'SWITCH', lv.sw.x, lv.sw.y-22);
  }

  // START / EXIT 마커
  drawMarker(lv.start[0],lv.start[1], '#5cc8ff','START', 0.6+0.4*Math.sin(gameT*3));
  var exitLocked = lv.sw && !lv.sw.on;
  drawMarker(lv.exit[0],lv.exit[1], exitLocked?'#ff7a7a':'#8fffcf', exitLocked?'LOCK':'EXIT', 0.6+0.4*Math.sin(gameT*3+1));

  // 감시자
  for(var i=0;i<lv.watchers.length;i++){ var w=lv.watchers[i];
    var wa=Math.max(0.32, bright);
    ctx.save(); ctx.shadowColor='#ff4a5a'; ctx.shadowBlur=22*wa;
    ctx.fillStyle='rgba(255,70,90,'+wa+')';
    ctx.beginPath(); ctx.arc(w._x,w._y,w.r,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(255,220,120,'+wa+')';
    ctx.beginPath(); ctx.arc(w._x-4,w._y-2,2.4,0,6.28); ctx.arc(w._x+4,w._y-2,2.4,0,6.28); ctx.fill();
    ctx.restore();
  }

  // 플레이어 트레일(네온 잔상)
  if(trail.length>1){ ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.shadowColor='#6fe0ff'; ctx.shadowBlur=14;
    for(var t2=1;t2<trail.length;t2++){ var al=1-trail[t2][2]/0.9;
      ctx.strokeStyle='rgba(140,235,255,'+Math.max(0,al)+')'; ctx.lineWidth=6*Math.max(0.2,al);
      ctx.beginPath(); ctx.moveTo(trail[t2-1][0],trail[t2-1][1]); ctx.lineTo(trail[t2][0],trail[t2][1]); ctx.stroke(); }
    ctx.restore();
    // 커서 헤드
    var h=trail[trail.length-1];
    ctx.save(); ctx.shadowColor='#bff4ff'; ctx.shadowBlur=18; ctx.fillStyle='#eafcff';
    ctx.beginPath(); ctx.arc(h[0],h[1],7,0,6.28); ctx.fill(); ctx.restore();
  }

  // 입자
  for(var pp=0;pp<particles.length;pp++){ var Pt=particles[pp];
    ctx.globalAlpha=Math.max(0,Pt.life); ctx.fillStyle=Pt.c;
    ctx.beginPath(); ctx.arc(Pt.x,Pt.y,2.4,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;

  // 비네트
  var vg=ctx.createRadialGradient(AW/2,AH/2,AH*0.3,AW/2,AH/2,AH*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,AW,AH);

  // 글리치
  if(glitchT>0){ var g=glitchT/0.45;
    for(var s=0;s<8;s++){ var yy=Math.random()*AH, hh=4+Math.random()*18, off=(Math.random()*2-1)*20*g;
      ctx.drawImage(cv, 0,yy*DPR*SC, cv.width, hh*DPR*SC, off,yy, AW, hh); }
  }
  ctx.restore();

  // 붉은 섬광(글리치와 별개, 화면 전체)
  if(flashT>0){ ctx.save(); ctx.globalAlpha=(flashT/0.35)*0.4;
    ctx.fillStyle= (mode==='anim'||mode==='result')?'#8fffcf':'#ff2a3a'; ctx.fillRect(0,0,AW,AH); ctx.restore(); }
}
function drawPathStroke(color,width,dummy){
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(lv.pts[0][0],lv.pts[0][1]);
  for(var i=1;i<lv.pts.length;i++) ctx.lineTo(lv.pts[i][0],lv.pts[i][1]);
  ctx.stroke();
}
function drawMarker(x,y,color,label,pulse){
  ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=16;
  ctx.strokeStyle=color; ctx.lineWidth=3; ctx.globalAlpha=0.9;
  ctx.beginPath(); ctx.arc(x,y,16+pulse*4,0,6.28); ctx.stroke();
  ctx.fillStyle=color; ctx.globalAlpha=0.28; ctx.beginPath(); ctx.arc(x,y,11,0,6.28); ctx.fill();
  ctx.restore();
  ctx.fillStyle=color; ctx.font='bold 10px Segoe UI'; ctx.textAlign='center';
  ctx.fillText(label,x,y-24);
}

/* ---------- 화면 ---------- */
function show(id){ document.getElementById(id).style.display='flex'; }
function hide(id){ document.getElementById(id).style.display='none'; }
document.getElementById('startBtn').addEventListener('click',function(){ audio(); hide('title'); startTutorial(); });

layout(); requestAnimationFrame(loop);

/* ---------- 검증용 노출 ---------- */
window.__shadow={
  catmull:catmull, distToPath:distToPath, pathLen:pathLen, makeLevel:makeLevel, LV_CFG:LV_CFG,
  // 경로 자기근접(지름길) 최소거리: 인덱스 차가 큰 두 점 사이 최소거리
  minSelfDist:function(key){
    var lvl=makeLevel(LV_CFG[key]); var pts=lvl.pts, min=1e9, at=null;
    var gap=Math.max(6, Math.floor(pts.length*0.06));
    for(var i=0;i<pts.length;i++)for(var j=i+gap;j<pts.length;j++){
      var d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]); if(d<min){min=d;at=[i,j];}
    }
    return {min:Math.round(min), needGt:lvl.R*2, ok:min>lvl.R*2, R:lvl.R, len:Math.round(lvl.len), pts:pts.length, at:at};
  },
  // 감시자 통과 창: 하단 구간을 지날 때 감시자가 비켜있는 시간이 존재하는가
  watcherWindow:function(){
    var w=LV_CFG.s2.watchers[0]; // 수직 왕복
    var x0=175,x1=625,y=450,rr=w.r+14, safe=false, bestClear=0;
    for(var speed=300; speed<=760; speed+=40){
      for(var ph=0; ph<6.283; ph+=0.03){
        var ok=true, minGap=1e9;
        for(var x=x0; x<=x1; x+=4){ var t=(x-x0)/speed; var wy=w.cy+Math.sin(t*w.w+ph)*w.amp;
          var gap=Math.hypot(x-w.x,y-wy); if(gap<rr)ok=false; if(gap<minGap)minGap=gap; }
        if(ok && minGap>bestClear){ safe=true; bestClear=minGap; }
      }
    }
    return {passableWindowExists:safe, bestMinGap:Math.round(bestClear)};
  },
  // 스위치가 경로 위에 있고, 출구 전에 위치하는가 + 10초 이동 여유
  s3Check:function(){
    var lvl=makeLevel(LV_CFG.s3);
    var onPath=distToPath(lvl.pts, lvl.sw.x, lvl.sw.y).d < 1;
    var swIdx=distToPath(lvl.pts, lvl.sw.x, lvl.sw.y).idx;
    var exitIdx=lvl.pts.length-1;
    var reqSpeed=lvl.len/lvl.timeLimit; // 평균 필요 속도(px/s)
    return {switchOnPath:onPath, switchBeforeExit:swIdx<exitIdx*0.95, len:Math.round(lvl.len),
      timeLimit:lvl.timeLimit, requiredAvgSpeed:Math.round(reqSpeed), feasible:reqSpeed<420};
  }
};
})();
