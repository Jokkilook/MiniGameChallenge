<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PENG! · 밀고 날리는 파티 액션</title>
<style>
  /* ============================================================
     모던·샤프: 직각 · 얇은 1px 선 · 플랫 컬러 · 타이트한 대문자 라벨.
     그라디언트/글로우/둥근 모서리/블러 없음.
     ============================================================ */
  :root{
    --ink:#eef2f8; --dim:#8a97ae; --line:#243044; --line2:#33425e;
    /* 배경과 패널이 명도 1.5% 차이라 1px 선이 구조를 혼자 떠받치고 있었다 — 둘 다 올린다 */
    --bg:#0a0e15; --panel:#111823; --panel2:#161f2d;
    --acc:#4db3ff; --acc2:#2ee6b6; --warn:#ff6b5a;
    /* --you = '나' 색. PLAYER_COL 기본값과 같다 — 명단·채팅에서 이미 나를 뜻해 왔다.
       크롬(버튼)에도 이 색을 쓴다: 게임에 이미 있는 따뜻한 색이라 근거가 있고,
       차가운 --acc 만 쓰면 UI 가 파티게임이 아니라 계측 장비처럼 읽힌다. */
    --you:#ff8a3a; --you-line:#e8752a; --you-deep:#a84d18;
    --r:3px; --r2:6px;
    --mono:ui-monospace,"Cascadia Mono","Consolas","Roboto Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Inter","Segoe UI","Malgun Gothic",sans-serif;font-weight:600;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04060a}
  /* 커서는 '마우스가 잠긴 동안'에만 숨긴다. 예전엔 캔버스에 항상 cursor:none 이라
     ESC 로 락이 풀려도 커서가 계속 안 보였다 — 일시정지 메뉴를 눈으로 찾을 수가 없다. */
  canvas{display:block}
  canvas.locked{cursor:none}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.9}
  #crosshair.dry rect{fill:var(--warn)}      /* 탄 없음 — 가운데 점이 붉어진다 */
  /* 라운드 배너 — 중앙 상단. 조준선을 가리지 않게 위쪽에 둔다 */
  #roundMsg{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);
    background:rgba(8,11,17,.86);border:1px solid var(--acc2);padding:12px 26px;
    font-size:20px;font-weight:800;letter-spacing:.5px;color:#fff;white-space:nowrap;
    opacity:0;transition:opacity .18s linear}
  #roundMsg.on{opacity:1}
  /* HUD — 컨텍스트(안 변함)와 상태(매 순간 변함)를 분리한다.
     예전엔 칩 네 개가 한 줄에 같은 크기로 있어서, 맵 이름이 점수와 같은 무게로 읽혔다. */
  #ctxbar{position:absolute;top:11px;left:14px;display:flex;gap:12px;opacity:.55;
    font-size:11.5px;font-weight:700;color:#9dabc4}
  #statbar{position:absolute;top:0;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:10px;min-width:190px}
  /* 붕괴 예고 — 숫자를 읽는 게 아니라 차오르는 걸 곁눈으로 본다 */
  #collapseBar{width:170px;height:3px;background:rgba(8,11,17,.8);border:1px solid var(--line);
    display:none}
  #collapseBar.on{display:block}
  #collapseBar i{display:block;height:100%;width:0;background:var(--acc2);transition:width .1s linear}
  #collapseBar.warn i{background:var(--warn)}
  #statMain{display:flex;align-items:baseline;gap:3px;background:rgba(8,11,17,.75);
    border:1px solid var(--line);border-radius:var(--r);padding:4px 13px}
  #statMain b{font-family:var(--mono);font-size:20px;font-weight:700;color:#fff;letter-spacing:0}
  #statMain em{font-style:normal;font-size:10.5px;font-weight:800;color:#8492ad}
  /* 점수 — 사람마다 칩 하나. 색은 그 사람 몸 색이라 화면 속 캐릭터와 바로 이어진다 */
  #scoreRow{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;max-width:60vw}
  #scoreRow .sc{display:flex;align-items:center;gap:6px;background:rgba(8,11,17,.8);
    border:1px solid var(--line);padding:3px 9px;font-size:11.5px;font-weight:800;color:#c7d2e4}
  #scoreRow .sc.me{border-color:var(--you);color:#fff}
  #scoreRow .sc s{width:7px;height:7px;background:var(--c);flex:none}
  #scoreRow .sc b{font-family:var(--mono);font-weight:700;color:#fff}
  /* 아이템 상태 — 탄창 위. 작동 중은 실선 + 남은 시간 바, 보유 중은 점선 + 사용 키 */
  #items{position:absolute;right:18px;bottom:56px;display:flex;flex-direction:column;
    align-items:flex-end;gap:4px}
  #items .it{position:relative;overflow:hidden;border-radius:var(--r);background:rgba(8,11,17,.82);border:1px solid var(--c);
    padding:6px 11px;display:flex;align-items:center;gap:8px;min-width:176px;
    font-size:12.5px;font-weight:800;letter-spacing:.4px;color:#fff}
  #items .it.use{border-style:dashed}
  #items .it .ic{flex:none;width:22px;height:22px;font-size:16px;line-height:22px;text-align:center}
  #items .it img.ic{display:block;object-fit:contain}
  #items .it .nm{flex:1;color:var(--c)}
  #items .it b{font-family:var(--mono);font-weight:700}
  #items .it kbd{font-family:var(--mono);font-size:10.5px;font-weight:700;
    border:1px solid var(--line2);padding:1px 5px;color:#9dabc4}
  #items .it i{position:absolute;left:0;bottom:0;height:2px;background:var(--c)}
  #ammo{position:absolute;right:18px;bottom:18px;display:flex;gap:5px;align-items:flex-end}
  #ammo .p{position:relative;width:7px;height:28px;background:transparent;border:1px solid var(--line2);overflow:hidden}
  #ammo .p.on{background:var(--acc);border-color:var(--acc)}
  /* 재충전 중인 칸: 아래에서 위로 차오르는 막대 */
  #ammo .p i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--acc);opacity:.55;display:block}
  #ammo .p.charging{border-color:#3f5a7d}
  /* 힌트는 조준 영역 '아래'에 둔다. 예전엔 라운드 배너와 똑같이 top:22% 라
     경쟁에서 둘이 같은 픽셀에 겹쳐 찍혔다(아레나 맵도 hints 를 갖고 있다). */
  #msg{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);font-weight:800;font-size:clamp(17px,2.7vw,24px);
    letter-spacing:-.1px;color:#fff;background:rgba(8,11,17,.78);border-left:3px solid var(--acc);
    padding:9px 18px;opacity:0;transition:opacity .18s;text-align:left}
  #msg.on{opacity:1}
  #msg b{color:var(--acc);font-weight:900}
  /* 화면 */
  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px;background:var(--bg)}
  .screen.off{display:none}
  /* 영문 라벨에만 Kenney Future 를 건다(@font-face 의 unicode-range 가 ASCII 한정).
     한글은 매칭이 안 되어 Pretendard 로 떨어지므로 한 줄에 섞여도 안전하다.

     ※ 그래서 제목은 영문이어야 한다. 예전엔 작은 영문 라벨(.sub) 위에 큰 한글
       제목(대기방·맵 고르기·설정)이라, 애써 구운 폰트가 타이틀의 PENG! 한 곳에만
       나왔다. 위계를 뒤집어 큰 워드마크를 영문으로 올리고 한글을 .kr 로 내렸다. */
  .screen h1{margin:0;font-family:"KenneyFuture","Pretendard","Inter","Segoe UI","Malgun Gothic",sans-serif;
    font-size:clamp(38px,9vw,64px);font-weight:900;letter-spacing:-3px;color:#fff;line-height:1}
  /* 한글 제목은 자간을 조일 필요가 없다(라틴 워드마크의 -3px 은 글자를 붙이려는 것) */
  .screen h1:lang(ko){letter-spacing:-1px}
  .screen .sub{color:var(--acc);letter-spacing:3px;font-size:11px;margin-bottom:10px;font-weight:900;
    text-transform:uppercase;font-family:"KenneyFuture","Pretendard","Inter",sans-serif}
  /* 워드마크 밑에 붙는 한글 한 마디. 문장이 아니라 이름표다 — 마침표를 찍지 않는다. */
  .screen .kr{color:#8fa0bb;font-size:13px;font-weight:800;letter-spacing:.3px;margin:7px 0 0;line-height:1.4}
  .screen .kr b{color:#fff}
  .screen .kr em{font-style:normal;font-family:var(--mono);font-weight:700;color:#fff}
  /* 입력·값 위의 작은 라벨. "…를 입력하세요" 같은 안내문을 대신한다. */
  .fieldLabel{margin-top:15px;font-size:9.5px;font-weight:900;letter-spacing:2.4px;color:#6f7d96;
    font-family:"KenneyFuture","Pretendard","Inter",sans-serif}
  .fieldLabel a{margin-left:7px;color:var(--acc);text-decoration:none;font-size:9px;letter-spacing:1.6px;
    border-bottom:1px solid var(--line2);padding-bottom:1px}
  .fieldLabel a:hover{border-bottom-color:var(--acc)}
  /* 접속 상태 — 문장이 아니라 점 하나와 낱말. 자세한 사정은 눌러 봤을 때만 말한다. */
  .netline{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
    font-size:10.5px;font-weight:900;letter-spacing:1.8px;color:#7e8ca3;margin-top:18px;min-height:14px;
    font-family:"KenneyFuture","Pretendard","Inter",sans-serif}
  .netline i{width:7px;height:7px;flex:none;background:#3d4a60;font-style:normal}
  .netline.ok i{background:var(--acc2)}
  .netline.bad{color:var(--warn)}   .netline.bad i{background:var(--warn)}
  .netline s{text-decoration:none;letter-spacing:.2px;font-weight:700;color:#6f7d96;
    font-family:"Pretendard","Inter",sans-serif}
  .screen p{color:#9dabc4;font-size:14.5px;font-weight:500;line-height:1.7;max-width:520px;margin:6px 0}
  .screen p b{color:#fff;font-weight:800}
  .screen kbd{font-family:var(--mono);font-size:11.5px;font-weight:700;background:transparent;border:1px solid var(--line2);
    padding:2px 7px;margin:0 1px;color:#fff}
  /* 버튼 — 아래에 '입술'(box-shadow)이 있는 두툼한 버튼. 누르면 실제로 내려간다.
     Kenney UI 팩의 depth 버튼과 같은 모양인데 스프라이트가 아니라 CSS 다:
     색이 토큰으로 자유롭고, 어떤 크기에서도 안 깨지고, 9-slice 삽질이 없다.
     한글엔 대소문자가 없어 uppercase 는 무효이고 자간만 음절을 벌린다 — 둘 다 뺐다. */
  button.go{margin-top:0;cursor:pointer;font:inherit;font-weight:900;font-size:15px;letter-spacing:.4px;
    color:#2a1002;background:var(--you);border:1px solid var(--you-line);
    padding:13px 26px;border-radius:var(--r2);box-shadow:0 3px 0 var(--you-deep);
    transition:background .12s,color .12s,border-color .12s,box-shadow .08s,transform .08s}
  button.go:hover{background:#ffa45f;border-color:#ffa45f}
  button.go:active{transform:translateY(3px);box-shadow:0 0 0 var(--you-deep)}
  button.go.alt{background:transparent;color:var(--ink);border-color:var(--line2);
    box-shadow:0 3px 0 #131b27}
  button.go.alt:hover{background:rgba(255,255,255,.05);border-color:var(--acc);color:var(--acc)}
  button.go:disabled{opacity:1;cursor:not-allowed;background:transparent;color:#3d4a60;
    border-color:var(--line);box-shadow:none;transform:none}
  button.go:disabled:hover{background:transparent;color:#3d4a60;border-color:var(--line)}
  /* 일시정지는 다른 화면과 달리 뒤가 비쳐야 한다 — 어디서 멈췄는지 보이는 게
     "잠깐 멈춤"의 핵심이고, 불투명하면 게임을 나간 것처럼 느껴진다. */
  #pause{background:rgba(4,7,12,.72);backdrop-filter:blur(2px)}
  /* 시트 = 오버레이로 열린 화면. 같은 이유로 뒤가 비쳐야 한다(대기방 연습·게임이
     계속 돌고 있다는 걸 보여줘야 한다). .screen 의 불투명 배경을 덮어쓴다. */
  .screen.asSheet{background:rgba(4,7,12,.82);backdrop-filter:blur(3px);z-index:22;pointer-events:auto}
  /* 조작법 — 한 줄로 이어 붙이면 · 로 구분된 긴 문장이 된다. 2열 격자로 나눈다. */
  #pause .keyhelp{margin-top:22px;display:grid;grid-template-columns:repeat(2,auto);
    gap:7px 26px;font-size:12.5px;font-weight:600;color:#9dabc4}
  #pause .keyhelp div{display:flex;align-items:center;gap:7px;text-align:left}
  .menu{display:flex;flex-direction:column;gap:8px;margin-top:22px;width:min(320px,86vw)}
  .menu.row{flex-direction:row}
  .menu.row button{flex:1;padding:12px 8px;font-size:13px;letter-spacing:1.2px}
  .menu button{width:100%}
  /* 코드 입력/표시: 고정폭, 각진 테두리 */
  #codeInput{border-radius:var(--r);margin-top:18px;width:min(320px,80vw);text-align:center;font:800 29px/1.3 var(--mono);letter-spacing:12px;
    text-transform:uppercase;color:#fff;background:transparent;border:1px solid var(--line2);
    border-radius:0;padding:12px 8px 12px 20px;outline:none;transition:border-color .12s}
  #codeInput:focus{border-color:var(--acc)}
  #codeBig{margin-top:4px;font:800 clamp(32px,7.5vw,48px)/1.1 var(--mono);letter-spacing:14px;
    color:var(--acc);padding-left:14px}
  /* 명단: 각진 행, 좌측 상태 바 */
  #playerList{list-style:none;margin:16px 0 0;padding:0;width:min(320px,86vw);display:flex;flex-direction:column;gap:1px}
  #playerList li{background:rgba(255,255,255,.04);border-left:3px solid var(--acc2);padding:10px 13px;
    font-size:13.5px;font-weight:700;color:#fff;display:flex;align-items:center;gap:9px;text-align:left}
  #playerList li.me{border-left-color:#ff8a3a}
  #playerList li .dot{display:none}
  #playerList li .tag{margin-left:auto;font-size:10px;font-weight:900;letter-spacing:1.4px;color:#9dabc4;
    border:1px solid var(--line2);padding:2px 6px}
  /* 순위표 — 대기방 명단(#playerList)과 같은 행 스타일에 등수·점수만 얹는다 */
  ul.rank{list-style:none;margin:18px 0 0;padding:0;width:min(340px,86vw);display:flex;flex-direction:column;gap:1px}
  ul.rank li{background:rgba(255,255,255,.04);border-left:3px solid var(--line2);padding:10px 13px;
    font-size:13.5px;font-weight:700;color:#fff;display:flex;align-items:center;gap:9px;text-align:left}
  ul.rank li.me{background:rgba(255,138,58,.10)}
  ul.rank .rk{font-family:var(--mono);font-size:11px;color:#8492ad;flex:0 0 12px}
  ul.rank .tag{font-size:10px;font-weight:900;letter-spacing:1.4px;color:#9dabc4;
    border:1px solid var(--line2);padding:2px 6px}
  ul.rank .pts{margin-left:auto;font-family:var(--mono);font-size:16px;font-weight:700;color:#fff}
  /* 9-slice 패널 프레임(Kenney Space Expansion, 어두운 팔레트로 다시 칠한 것).
     여기 있는 건 스프라이트가 없을 때의 모습이다 — 진짜 프레임은 아래 에셋 주입부가
     같은 선택자로 덮어쓴다(명시도가 같고 뒤에 붙으므로 그쪽이 이긴다). */
  .panel9{background:rgba(10,14,22,.93);border:1px solid var(--line2)}
  /* 가운데 놓는 상자. .setBox 는 목록을 스크롤시키는 왼쪽 정렬판이고 이쪽은 가운데 정렬이다. */
  .card{width:min(460px,92vw);max-height:100vh;padding:22px 20px 20px;
    display:flex;flex-direction:column;align-items:center;text-align:center}
  /* 대기방(연습장): 전체를 가리지 않는 각진 패널. 화면 모서리에 딱 붙이면 프레임의
     세 변이 잘려 보이므로 살짝 띄운다. */
  /* 창이 낮으면 아래쪽 버튼(시작·나가기)이 화면 밖으로 잘려 대기방이 막힌다 —
     높이를 창에 묶고 안쪽만 스크롤시킨다(프레임은 제자리에 남는다). */
  .screen.asPanel{inset:auto;top:10px;right:10px;width:min(304px,86vw);
    height:auto;max-height:calc(100vh - 20px);overflow-y:auto;padding:12px 12px 14px;
    align-items:stretch;text-align:left}
  .screen.asPanel h1{font-size:25px;letter-spacing:-1px;margin:0}
  .screen.asPanel .kr{margin-top:4px;font-size:11.5px}
  .lobbyKeys{display:flex;align-items:center;gap:4px;margin-top:9px;flex-wrap:wrap}
  .lobbyKeys div{display:flex;align-items:center;gap:5px;margin-right:10px}
  .lobbyKeys span{font-size:10.5px;font-weight:800;color:#8492ad}
  /* 일시정지 중의 대기방 패널 — 딤(#pause, 20) 위로 올라와 계속 눌린다.
     설정 시트(.asSheet, 22)보다는 아래여야 시트를 열었을 때 제대로 가려진다. */
  .screen.asPanel.overPause{z-index:21}
  /* 패널이 딤 위에 살아 있으므로 일시정지 메뉴를 그만큼 왼쪽으로 민다 —
     가운데 정렬 그대로 두면 좁은 창에서 패널이 메뉴의 오른쪽 절반을 덮는다
     (실제로 '방 나가기'와 조작표 오른쪽 열이 가려졌다).
     기준 830px = 카드 460 + .screen 여백 56 + 패널 314. */
  @media (min-width:830px){ #pause.besidePanel{padding-right:330px} }
  /* 둘이 나란히 못 서는 폭에서는 패널을 딤 아래로 되돌린다. 대기방 버튼은 잠시
     못 누르지만, 겹쳐서 둘 다 못 읽는 것보다는 낫다(예전 동작과 같다). */
  @media (max-width:829px){ .screen.asPanel.overPause{z-index:auto} }
  .screen.asPanel .sub{font-size:10px;margin-bottom:4px;letter-spacing:3px}
  .screen.asPanel p{font-size:12px;font-weight:600;line-height:1.5;margin:2px 0}
  .screen.asPanel #codeBig{font-size:29px;letter-spacing:9px;margin-top:2px;padding-left:9px}
  .screen.asPanel #playerList{width:100%;margin-top:10px}
  .screen.asPanel #playerList li{padding:8px 11px;font-size:12.5px}
  .screen.asPanel .menu{width:100%;margin-top:12px}
  .screen.asPanel .menu.row button{padding:10px 6px;font-size:12px}
  .screen.asPanel .hint{font-size:11px;margin-top:8px}
  .optSmall{cursor:pointer;font:inherit;font-size:9.5px;font-weight:800;letter-spacing:1.4px;color:#9dabc4;
    background:transparent;border:1px solid var(--line2);padding:3px 7px;border-radius:0;text-transform:uppercase}
  .optSmall:hover{color:var(--acc);border-color:var(--acc)}
  .optSec{margin-top:9px;padding-top:6px;border-top:1px solid var(--line);
    font-size:9px;font-weight:900;letter-spacing:2px;color:#6f7d96;text-transform:uppercase}
  .optRow{display:flex;align-items:center;gap:7px;margin:4px 0}
  .optRow label{flex:0 0 96px;font-size:10.5px;font-weight:700;color:#9dabc4}
  .optRow input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:2px;background:var(--line2);outline:none;margin:0}
  .optRow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:15px;background:var(--acc);cursor:pointer;border:0}
  /* flex 자식은 기본이 min-width:auto 라 input 의 내재 폭(size=20 → 약 167px)이
     flex-basis 를 이겨 행이 통째로 삐져나간다. 0 으로 눌러야 basis 가 먹는다. */
  .optRow input{min-width:0}
  .optRow input[type=number]{flex:0 0 58px;font:inherit;font-family:var(--mono);font-size:11px;font-weight:700;
    color:#fff;background:transparent;border:1px solid var(--line2);border-radius:0;padding:3px 5px;outline:none;
    -moz-appearance:textfield}
  .optRow input[type=number]::-webkit-outer-spin-button,
  .optRow input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .optRow input[type=number]:focus{border-color:var(--acc)}
  /* 설정 화면이 같은 행 빌더를 쓰므로 나머지 행 종류도 여기 둔다 */
  .optSmall.on{color:var(--acc);border-color:var(--acc)}
  .optSeg{display:flex;gap:1px;flex:1}
  .optSeg .optSmall{flex:1}
  .optRow .optSmall.tog{flex:0 0 58px}
  .optTxt{flex:1;min-width:0;font:inherit;font-size:11.5px;font-weight:700;color:#fff;
    background:transparent;border:1px solid var(--line2);border-radius:0;padding:3px 6px;outline:none}
  .optTxt:focus{border-color:var(--acc)}
  .optCol{flex:0 0 58px;height:22px;padding:0;border:1px solid var(--line2);background:transparent;
    cursor:pointer;border-radius:0}
  /* 설정 화면 — 항목 목록만 스크롤시키고 제목과 '돌아가기'는 항상 보이게 한다.
     박스 전체를 스크롤시키면 화면이 낮을 때 나가는 버튼이 아래로 사라진다. */
  #setScr{padding:0}
  .setBox{width:min(440px,92vw);max-height:100vh;padding:20px 18px 18px;
    display:flex;flex-direction:column;align-items:stretch;text-align:left}
  .setBox h1{font-size:30px;letter-spacing:-1px;margin:0;text-align:left;flex:none}
  .setBox .sub{text-align:left;flex:none}
  .setBox .kr{text-align:left;flex:none;margin:4px 0 12px}
  .setBox .netline,.screen.asPanel .netline{justify-content:flex-start}
  .setBox #setRows{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:4px}
  .setBox .hint{flex:none;margin-top:10px}
  .setBox .menu{width:100%;flex:none;margin-top:14px}
  .setBox .optRow label{flex:0 0 116px}
  .setBox .optRow{margin:7px 0}
  /* 타이틀 태그라인 — 예전엔 인라인 style 로 자간 5px 대문자였다.
     한글엔 대소문자가 없어 uppercase 는 무효였고, 자간만 음절을 벌려 놨다. */
  .tagline{color:#b7c3d8;font-size:14px;font-weight:800;letter-spacing:.6px;margin:10px 0 4px}
  /* 맵 카드 — 썸네일은 캔버스에 그 자리에서 그린다(그림 파일이 없다) */
  #mapScr .setBox{width:min(660px,94vw)}
  #mapGrid{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;
    align-content:flex-start;padding:2px}
  #mapGrid.locked{pointer-events:none;opacity:.45}
  .mapCard{cursor:pointer;font:inherit;text-align:left;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    padding:0 0 7px;width:178px;transition:border-color .12s}
  .mapCard:hover{border-color:var(--line2)}
  .mapCard.on{border-color:var(--acc)}
  .mapCard canvas{display:block;width:176px;height:112px;background:#070a10;border-bottom:1px solid var(--line)}
  .mapCard .mcName{font-size:13px;font-weight:800;color:#fff;margin:7px 9px 2px}
  .mapCard.on .mcName{color:var(--acc)}
  .mapCard .mcMeta{font-size:10.5px;font-weight:600;color:#8492ad;margin:0 9px;line-height:1.4}
  /* 세그먼트 선택(모드) — 예전 <select> 자리 */
  .segPick{display:flex;gap:1px}
  .segPick button{cursor:pointer;font:inherit;font-size:12px;font-weight:800;letter-spacing:.2px;
    color:#9dabc4;background:transparent;border:1px solid var(--line2);border-radius:0;padding:6px 12px}
  .segPick button.on{color:#03080f;background:var(--acc);border-color:var(--acc)}
  .segPick.locked{pointer-events:none;opacity:.45}
  /* 대기방 맵 버튼 — 이름 + 작은 썸네일 */
  .mapBtn{cursor:pointer;font:inherit;display:flex;align-items:center;gap:8px;text-align:left;
    color:#fff;background:transparent;border:1px solid var(--line2);border-radius:0;padding:4px 8px 4px 4px}
  .mapBtn:hover:not(:disabled){border-color:var(--acc)}
  .mapBtn:disabled{opacity:.45;cursor:not-allowed}
  .mapBtn canvas{display:block;width:44px;height:28px;background:#070a10}
  .mapBtn .lmName{font-size:12px;font-weight:700;letter-spacing:0}
  /* 채팅: 각진 좌측 액센트 */
  /* 채팅은 화면 오버레이(z-index 20)보다 위에 있어야 게임 중에 보인다. 그래서
     전체를 덮는 메뉴·결과 화면에서는 아예 숨겨야 한다 — 안 그러면 말풍선이
     버튼 위에 겹쳐 찍힌다(결과 화면의 '다시' 가 실제로 그렇게 가려졌다). */
  #chat{position:fixed;left:0;bottom:0;z-index:30;width:min(400px,62vw);padding:0 0 12px 12px;pointer-events:none}
  #chat.off{display:none}
  #chatLog{display:flex;flex-direction:column;gap:1px;margin-bottom:5px}
  .cmsg{background:rgba(8,11,17,.78);border-left:3px solid var(--acc2);border-radius:0;
    padding:5px 11px;font-size:13px;font-weight:600;line-height:1.4;color:#fff;
    transition:opacity .45s linear;word-break:break-word}
  .cmsg.me{border-left-color:#ff8a3a}
  .cmsg.sys{border-left-color:var(--line2);color:#9dabc4;font-style:normal;font-weight:600}
  .cmsg b{color:var(--acc2);font-weight:900}
  .cmsg.me b{color:#ff9d55}
  #chatInput{display:none;width:100%;pointer-events:auto;font:inherit;font-size:13.5px;font-weight:600;color:#fff;
    background:rgba(8,11,17,.94);border:1px solid var(--acc);border-radius:0;padding:9px 11px;outline:none}
  #chatInput.on{display:block}
  /* .screen p 보다 우선하도록 명시도를 맞춘다(안 그러면 크기가 덮어씌워짐) */
  .screen p.hint, .hint{color:#8a97ae;font-size:12px;font-weight:600;margin-top:14px;line-height:1.75}
  .screen p.hint b, .hint b{color:#cfd9e8;font-weight:800}
  /* 실패했을 때만 나오는 줄. 빈 줄에도 자리를 잡아 둬야 나타날 때 버튼이 안 밀린다. */
  .screen p.hint.warnText, .hint.warnText{color:var(--warn);min-height:17px;margin-top:10px}
  .screen p.hint.warnText b, .hint.warnText b{color:#ffb9ad}
  /* 맵 선택(병합분) — 샤프 톤에 맞춤 */
  .pick{margin-top:16px;display:flex;align-items:center;gap:9px;color:#9dabc4;
    font-size:11px;font-weight:900;letter-spacing:.2px}
  /* select 는 브라우저 기본 외형이 배경을 덮으므로 appearance 를 꺼야 어두운 톤이 먹는다 */
  .pick select{font:inherit;font-size:13px;font-weight:700;letter-spacing:0;color:#fff;cursor:pointer;
    -webkit-appearance:none;appearance:none;background-color:#0d1219;
    border:1px solid var(--line2);border-radius:0;padding:7px 26px 7px 9px;outline:none;
    transition:border-color .12s;
    background-image:linear-gradient(45deg,transparent 50%,#8492ad 50%),linear-gradient(135deg,#8492ad 50%,transparent 50%);
    background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .pick select:focus{border-color:var(--acc)}
  .pick select:disabled{opacity:.45;cursor:not-allowed}
  .pick select option{background:#0d1219;color:#fff}
  .pick input[type=color]{flex:0 0 46px;height:24px;padding:0;border:1px solid var(--line2);
    background:transparent;cursor:pointer;border-radius:0}
  /* 모션은 딱 두 개다: 화면이 뜰 때 살짝 올라오는 것과 버튼이 눌리는 것(위 :active).
     그 이상은 3D 위에 얹힌 UI 를 산만하게 만든다. */
  @keyframes scrIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .screen:not(.off){animation:scrIn .14s ease-out}
  .screen.asPanel:not(.off),.screen.asSheet{animation:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<!-- 채팅: 로비·인게임 공용 (화면 오버레이보다 위) -->
<div id="chat">
  <div id="chatLog"></div>
  <input id="chatInput" maxlength="120" autocomplete="off" placeholder="메시지 입력 후 Enter · Esc 취소" />
</div>

</div>

<div id="hud">
  <!-- 샤프한 십자선: 중앙을 비운 4방향 직선 + 1px 점 -->
  <svg id="crosshair" viewBox="0 0 18 18" shape-rendering="crispEdges">
    <g stroke="#e8eef8" stroke-width="1">
      <line x1="9" y1="0" x2="9" y2="5"/><line x1="9" y1="13" x2="9" y2="18"/>
      <line x1="0" y1="9" x2="5" y2="9"/><line x1="13" y1="9" x2="18" y2="9"/>
    </g>
    <rect x="8.5" y="8.5" width="1" height="1" fill="#4db3ff"/>
  </svg>
  <!-- 라운드 정산 배너 — 떨어뜨린 직후 잠깐 뜨고, 다음 라운드가 시작되면 사라진다 -->
  <div id="roundMsg"></div>
  <!-- 컨텍스트: 경기 내내 안 변하는 것들. 흐리게, 구석에.
       예전엔 맵 이름과 접속 상태가 상태 정보와 같은 줄에 같은 크기로 있었다. -->
  <div id="ctxbar"><span id="mapV">맵</span><span id="mpV">솔로</span></div>
  <!-- 상태: 매 순간 변하는 것들. 화면 위 가운데. -->
  <div id="statbar">
    <div id="collapseBar"><i></i></div>
    <div id="statMain"><b id="timeV">0.0</b><em id="timeU">초</em></div>
    <div id="scoreRow"></div>
  </div>
  <!-- 아이템 상태: 작동 중(시간제) / 보유 중(쓸 수 있는 것) -->
  <div id="items"></div>
  <div id="ammo"></div>
  <div id="msg"></div>
</div>

<!-- 타이틀은 이름과 시작 버튼만 남긴다. 예전엔 설명 문단 둘 + 키 안내 두 줄이 깔려
     있어 낮은 창에서는 버튼이 화면 밖으로 밀려났다. 조작법은 일시정지 화면에 있고,
     무슨 게임인지는 모드 선택 화면이 한 줄씩 설명한다. -->
<div class="screen" id="title">
  <h1>PENG!</h1>
  <p class="tagline">밀고 날리는 파티 액션</p>
  <div class="menu">
    <button class="go" id="soloBtn">플레이</button>
    <button class="go alt" id="joinBtn">방 참가하기</button>
    <button class="go alt" id="setBtn">설정</button>
  </div>
  <p class="netline mpwarn" id="mpWarn"></p>
</div>

<!-- 협동 모드는 지금 출입구가 없다(경쟁만 출시). 규칙·코스·결승선 코드는 그대로
     살아 있으므로 나중에 이 자리에 모드 선택 화면을 다시 넣으면 된다. -->

<!-- 참가: 세션 코드 입력.
     "친구에게 받은 세션 코드를 입력하세요" 를 지웠다 — 제목이 JOIN 이고 라벨이
     '세션 코드'이고 자리표시자가 ABC123 이면, 그 문장은 같은 말을 네 번째로 하는 것이다. -->
<div class="screen off" id="joinScr">
  <div class="card panel9">
    <h1>JOIN</h1>
    <p class="kr">방 참가</p>
    <div class="fieldLabel">세션 코드</div>
    <input id="codeInput" maxlength="6" placeholder="ABC123" autocomplete="off" spellcheck="false" />
    <p class="hint warnText" id="joinErr"></p>
    <div class="menu row">
      <button class="go" id="joinGoBtn">참가</button>
      <button class="go alt" id="joinBackBtn">뒤로</button>
    </div>
  </div>
</div>

<!-- 대기방 -->
<div class="screen off asPanel panel9 tight" id="lobbyScr">
  <h1>LOBBY</h1>
  <p class="kr">대기방 <em id="lobbyCount">1/6</em></p>
  <div class="fieldLabel">세션 코드 <a href="#" id="copyCode">복사</a></div>
  <div id="codeBig">------</div>
  <ul id="playerList"></ul>
  <div class="pick"><span id="mapPickLabel">맵</span>
    <button type="button" id="lobbyMapBtn" class="mapBtn">
      <canvas width="88" height="56"></canvas><span class="lmName">—</span>
    </button></div>
  <label class="pick">내 색 <input type="color" id="colSel" /></label>
  <p class="hint" id="lobbyHint"></p>
  <!-- 연습장 조작 — 문장 대신 키 타일. 채워 넣는 건 buildLobbyKeys(). -->
  <div class="lobbyKeys" id="lobbyKeys"></div>
  <div class="menu row">
    <button class="go alt" id="botAddBtn">+ AI</button>
    <button class="go alt" id="botDelBtn">− AI</button>
  </div>
  <div class="menu row">
    <button class="go" id="lobbyStartBtn" disabled>시작</button>
    <button class="go alt" id="lobbyLeaveBtn">나가기</button>
  </div>
</div>

<!-- 맵 브라우저. 타이틀 흐름에서는 화면으로, 대기방에서는 오버레이로 열린다
     (후자는 mode 가 'lobbyScr' 로 남아야 뒤의 연습 물리가 산다). -->
<div class="screen off" id="mapScr">
  <div class="setBox panel9">
    <h1>MAP</h1>
    <p class="kr">맵 고르기</p>
    <div id="mapGrid"></div>
    <p class="hint" id="mapScrNote"></p>
    <p class="hint warnText" id="mapErr"></p>
    <p class="netline mpwarn"></p>
    <div class="menu row">
      <button class="go" id="mapHostBtn">방 만들기</button>
      <button class="go alt" id="mapSoloBtn">혼자 둘러보기</button>
      <button class="go alt" id="mapBack">뒤로</button>
    </div>
  </div>
</div>
<!-- 설정. 타이틀에서는 화면으로, 일시정지에서는 오버레이(.asSheet)로 열린다 —
     후자는 mode 가 'play' 로 남아야 뒤의 물리와 HUD 가 살아 있다. -->
<div class="screen off" id="setScr">
  <div class="setBox panel9">
    <h1>SETTINGS</h1>
    <p class="kr">설정</p>
    <div id="setRows"></div>
    <p class="hint" id="setNote"></p>
    <div class="menu"><button class="go" id="setBack">돌아가기</button></div>
  </div>
</div>
<!-- 경쟁 결과. 명단은 대기방(#playerList)과 같은 마크업·CSS 를 쓴다 —
     색 스와치, '(나)' 강조, AI 배지가 새 CSS 없이 그대로 나온다.
     제목은 WIN/LOSE 로 두고 누가 이겼는지는 그 아래 한 줄에 적는다 — 이겼는지부터
     0.2 초 안에 읽혀야 하고, 그건 이름보다 단어가 빠르다. -->
<div class="screen off" id="vsWin">
  <div class="card panel9">
    <h1 id="vsWinTitle">RESULT</h1>
    <p class="kr" id="vsWinWho"></p>
    <ul id="vsList" class="rank"></ul>
    <p class="hint" id="vsWinNote"></p>
    <div class="menu row">
      <button class="go" id="vsAgainBtn">다시</button>
      <button class="go alt" id="vsLobbyBtn">대기방으로</button>
      <button class="go alt" id="vsMenuBtn">메인 메뉴</button>
    </div>
  </div>
</div>

<div class="screen off" id="win">
  <div class="card panel9">
    <h1>FINISH</h1>
    <p class="kr">결승선 도착</p>
    <p id="winMsg"></p>
    <div class="menu row">
      <button class="go" id="retryBtn">다시</button>
      <button class="go alt" id="menuBtn">메인 메뉴</button>
    </div>
  </div>
</div>

<!-- 일시정지 — ESC 로 포인터락이 풀리면 뜬다. 게임 중과 대기방 연습 중 둘 다에서 뜬다.
     showScreen 이 관리하는 화면들과 달리 mode 를 바꾸지 않는다: 게임은 계속
     'play'(또는 'lobbyScr') 여야 HUD 와 물리 상태가 유지되고, 계속하기로 그대로 돌아간다. -->
<div class="screen off" id="pause">
  <div class="card panel9">
    <h1>PAUSED</h1>
    <p class="kr" id="pauseWhere"></p>
    <p class="netline" id="pauseNote"></p>
    <div class="menu row">
      <button class="go" id="pauseResume">계속하기</button>
      <button class="go alt" id="pauseSettings">설정</button>
      <button class="go alt" id="pauseLeave">나가기</button>
    </div>
    <div class="keyhelp" id="keyhelp"></div>
  </div>
</div>

<!-- 공용 모듈 + 코스 데이터. 고전 <script src> 라 file:// 더블클릭에서도 로드된다.
     levels/_all.js 는 server.js 가 levels/ 폴더를 훑어 자동으로 만든다 —
     맵을 추가해도 이 파일을 고칠 필요가 없다. -->
<script src="level.js"></script>
<script src="levels/_all.js"></script>
<!-- 총·투사체 3D 메시(Kenney Blaster Kit, CC0). *baked.js 는 Mesh/*.glb 를
     미리 구워둔 정점 데이터로 tools/bake.html 이 만든다 — 모델을 바꿨을 때만 다시 굽는다.
     없으면 총은 기본 박스로, 투사체는 기존 빌보드로 폴백한다. -->

<script>
"use strict";
(function(){
/* =========================================================================
   PENG! — 공기폭발(PoofGun) 넉백 이동 FPS 프로토타입 (WebGL, 외부 라이브러리 없음)
   외부 라이브러리 없음. 블록형 로우폴리.
   ========================================================================= */
// 레벨 파일이 하나도 안 실렸으면 게임을 켤 수 없다 — 조용히 깨지지 않게 먼저 알린다.
if(!window.PENG || !PENG.PHYS || !PENG.defaultLevel()){
  document.getElementById('title').innerHTML =
    '<div class="card panel9"><h1>NO LEVELS</h1>'+
    '<p class="kr">코스 데이터를 못 불러왔다</p>'+
    '<p class="hint warnText"><b>level.js</b> 와 <b>levels/</b> 폴더가 index.html 옆에 있어야 합니다</p></div>';
  return;
}
var cv=document.getElementById('cv');
var gl=cv.getContext('webgl',{antialias:true, alpha:false, depth:true})
      || cv.getContext('experimental-webgl',{antialias:true, alpha:false, depth:true});
var W=960, H=560, DPR=1, SC=1;   // W/H = 논리 해상도(종횡비 기준)
function layout(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  var vw=window.innerWidth, vh=window.innerHeight; SC=Math.min(vw/W, vh/H);
  var w=Math.round(W*SC), h=Math.round(H*SC);
  cv.style.width=w+'px'; cv.style.height=h+'px'; cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
  if(gl) gl.viewport(0,0,cv.width,cv.height);
}
window.addEventListener('resize',layout);

/* ---------- 설정 저장 ----------
   키는 전부 'peng.' 접두 — 기존 peng.color / peng.solomap 과 같은 규칙이다.
   localStorage 가 막힌 환경(file:// 시크릿 창 등)에서도 게임이 멈추면 안 되므로 전부 try. */
function stGet(k, d){ try{ var v=localStorage.getItem('peng.'+k); return v==null?d:v; }catch(e){ return d; } }
function stNum(k, d){ var v=parseFloat(stGet(k,'')); return isFinite(v)?v:d; }
function stPut(k, v){ try{ localStorage.setItem('peng.'+k, String(v)); }catch(e){} }

/* 설정으로 조절되는 값들. 예전엔 셋 다 변수조차 아니었다 —
   감도는 mousemove 핸들러 안 지역변수, 볼륨은 ensureAudio 안 상수,
   기본 시점은 makeSim 안 리터럴이라 바깥에서 건드릴 방법이 없었다. */
var MOUSE_SENS=0.0022;   // 마우스 1픽셀당 라디안
var VOLUME=0.5, MUTED=false;
var TP_DEFAULT=true;     // 새 판을 3인칭으로 시작할지 (V 로 언제든 전환)

/* ---------- 오디오 ---------- */
var AC=null,master=null;
function ensureAudio(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=MUTED?0:VOLUME;master.connect(AC.destination);}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); }
// 볼륨은 살아 있는 gain 에 즉시 반영한다 — 설정에서 슬라이더를 움직이면 바로 들려야 한다
function applyVolume(){ if(master) master.gain.value = MUTED?0:VOLUME; }
function setVolume(v){ VOLUME=Math.max(0,Math.min(1,v)); stPut('vol', VOLUME); applyVolume(); }
function setMuted(m){ MUTED=!!m; stPut('mute', MUTED?1:0); applyVolume(); }
function tone(f,dur,type,vol,to){ ensureAudio(); if(!AC)return; var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t); if(to)o.frequency.exponentialRampToValueAtTime(Math.max(30,to),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master||AC.destination);o.start(t);o.stop(t+dur+0.02); }
function sndShoot(){ tone(560,0.06,'square',0.11,260); tone(240,0.05,'triangle',0.08); }
function sndPoof(){ tone(140,0.18,'square',0.16,50); tone(320,0.1,'sawtooth',0.1,90); }
function sndJump(){ tone(400,0.08,'sine',0.08,600); }
function sndWin(){ [523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.16,'triangle',0.13);},i*90);}); }
function sndDie(){ tone(200,0.2,'sawtooth',0.1,80); }

/* ---------- UI 소리 ----------
   구운 ogg(Kenney UI Pack, CC0)를 AudioContext 로 디코드해 master 게인에 물린다.
   <audio> 엘리먼트로 틀면 설정의 볼륨·음소거가 안 먹는다 — 그쪽은 master 를 안 거친다.
   디코드는 비동기라 첫 소리 하나는 놓칠 수 있는데, 버튼은 누르기 전에 반드시
   스쳐 지나가므로(pointerover) 그때 시작해 두면 누를 때는 이미 준비돼 있다. */
var UIBUF={}, uiDecoding=false;
function uiDecode(){
  if(uiDecoding || !window.UI_SND) return;
  ensureAudio(); if(!AC) return;
  uiDecoding=true;
  Object.keys(UI_SND).forEach(function(k){
    try{
      var s=UI_SND[k], bin=atob(s.slice(s.indexOf(',')+1)), u=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      AC.decodeAudioData(u.buffer, function(d){ UIBUF[k]=d; }, function(){});
    }catch(e){}
  });
}
function uiSnd(k, vol){
  uiDecode(); ensureAudio();
  var b=UIBUF[k]; if(!b||!AC) return;
  var s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=b; g.gain.value=(vol==null?0.45:vol);
  s.connect(g); g.connect(master||AC.destination); s.start();
}
/* 소리를 낼 자격이 있는 것 — 화면 위의 조작 요소만. 캔버스 클릭은 발사라 소리가 따로 있다.
   #pause 도 .screen 이므로 한 선택자로 둘 다 걸린다. */
function uiCtl(t){
  return (t && t.closest) ? t.closest('.screen button,.screen a,.screen input,.screen label,.mapCard') : null;
}
var uiHover=null;
document.addEventListener('pointerover',function(e){
  var el=uiCtl(e.target); if(!el || el.disabled || el===uiHover){ if(!el) uiHover=null; return; }
  uiHover=el; uiSnd('tap',0.3);
});
document.addEventListener('pointerdown',function(e){
  var el=uiCtl(e.target); if(!el || el.disabled) return; uiSnd('click',0.5);
});

/* ---------- 벡터 ---------- */
function sub(a,b){return {x:a.x-b.x,y:a.y-b.y,z:a.z-b.z};}
function len(a){return Math.hypot(a.x,a.y,a.z);}
function dot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z;}

/* ---------- 레벨 ---------- */
// 코스 데이터는 levels/*.js 로 분리돼 있다 — editor.html 이 같은 형식을 읽고 쓴다.
// LEVEL 은 "지금 켜져 있는 맵"을 가리키는 변수. 맵을 바꿀 때는 setLevel() 을 쓴다.
var LEVEL=null, CURLEVEL=null;
/* 혼자 플레이용 맵 — 메인 메뉴 선택. 방(멀티) 맵인 CURLEVEL 과 완전히 분리돼 있다.
   둘을 한 변수로 쓰던 시절엔 메인 메뉴에서 고른 맵이 방 맵까지 바꿔서,
   대기방 선택과 어느 쪽이 진짜인지 헷갈렸다. */
var SOLO_LEVEL=null;
function setSoloLevel(id){
  if(!PENG.getLevel(id)) return false;
  SOLO_LEVEL=id; try{ localStorage.setItem('peng.solomap', id); }catch(e){}
  return true;
}
/* 협동 관문 표식 — 물리 판정에서 파생된 장식 박스(level.js 의 coopMarkers).
   LEVEL.boxes 에 합치지 않고 따로 둔다: 그리기만 하면 되는 것들이고, 레벨 데이터에
   섞으면 에디터 시험 플레이 후 저장할 때 표식이 파일에 딸려 들어간다. */
var MARKS=[];
/* 아이템 패드 — setLevel 이 로드 시점에 buildPads() 를 부르므로 선언이 여기 있어야 한다.
   아래 아이템 구역에 두면 그 시점엔 아직 undefined 라 터진다(var 는 선언만 끌어올려진다). */
var PADS=[];
/* 킷 조각 설정 — 이것도 선언이 여기 있어야 한다. setLevel 은 로드 시점에 불리고,
   그 안의 buildStaticPieces()/buildCollapseFloor() 가 STATION 과 PIECE_* 를 읽는다.
   아래 렌더 구역에 두면 그 시점엔 아직 undefined 라 터지고(var 는 선언만 끌어올려진다),
   스크립트가 통째로 멈춰 메인 메뉴의 맵 목록까지 안 채워진다.
   실제로 에디터로 만든 조각 맵이 알파벳순 첫 번째가 되어 기본 맵으로 잡히자 그렇게 됐다. */
/* 1킷유닛 = 몇 미터인가. 레벨의 collapse.size 가 진짜 출처이고 여기는 폴백이다.
   2.95 인 이유: 킷의 문 구멍이 0.65유닛인데 플레이어가 1.8m 라, 2.6 으로 두면
   구멍이 1.69m 라서 문을 못 지나간다(Kenney 는 더 작은 캐릭터 기준으로 만들었다).
   2.95 면 구멍이 1.92m 가 되어 머리 위로 여유가 생긴다. */
var STATION={ buf:null, count:0, parts:null, unit:2.95 };
var STATION_LIGHT=[0.42,0.80,0.43];        // 간이 방향광 — 킷 색만 쓰면 전부 납작해 보인다
/* 조각 모양에서 충돌 박스를 뽑는다.
   손으로 "벽=1x1x0.3" 식으로 적으면 문이 뚫린 벽도 통짜가 되고 탁자 밑도 막힌다.
   대신 XZ 를 격자로 나눠 기둥마다 '지오메트리가 있는 y 구간'을 재고, 같은 구간을 가진
   기둥을 직사각형으로 합친다. 킷 조각은 대부분 상자를 이어 붙인 형태라 이 방법이
   모양을 거의 그대로 잡는다 — 문 구멍·탁자 밑·난간 사이가 자동으로 비워진다.
   기둥 안에 지오메트리가 있는지는 '기둥 중심이 삼각형의 XZ 투영 안에 있는가'로 본다.
   삼각형의 XZ 바운딩박스를 쓰면 넉넉하게 잡혀서 문 구멍이 도로 막힌다. */
var PIECE_RES=16;                      // 1칸을 몇 등분해 훑을지(1유닛=3m 이므로 칸당 19cm)
/* override 표는 '킷/이름' 과 '이름' 을 둘 다 갖는다. 예전엔 이름만 썼는데 킷이 다섯이
   되면서 factory/floor 가 station 의 floor 규칙을, forest/tree 가 survival 의 나무
   규칙을 물려받아 엉뚱한 콜리전을 갖게 됐다(실측 4건). 짧은 이름은 예전 레벨·생성기
   호환으로 남긴다 — 그쪽은 정거장·서바이벌을 가리킨다. */
function kitTbl(kit, obj){ var o={}; for(var k in obj){ o[k]=obj[k]; o[kit+'/'+k]=obj[k]; } return o; }
function tblMerge(){ var o={};
  for(var i=0;i<arguments.length;i++){ var a=arguments[i]; for(var k in a) o[k]=a[k]; }
  return o; }
/* 바닥 조각은 표면 장식을 무시하고 '평평한 한 장'으로 친다.
   요철까지 판정에 넣으면 데크에 15~30cm 턱이 흩어져 달리다 걸린다 —
   빠르게 밀고 밀리는 경기에서 그건 그냥 사고다.
   값은 두께(킷유닛), 또는 [두께, 안쪽으로 줄일 비율].
   피크의 바위 슬래브는 원반 가장자리가 베벨이라 통째로 잡으면 그만큼 발이 뜬다.
   실측(체비셰프 반경별 최고점): 반경 0.9 까지는 윗면이 거의 그대로고(낙차 rock-flat
   0.03 · rock-flat-grass 0.06 유닛) 마지막 10% 에서만 확 떨어진다 — 0.90 으로 자른다. */
var PIECE_FLAT=tblMerge(
  kitTbl('station',  {'floor':0.3, 'floor-detail':0.3, 'floor-panel':0.3}));
/* '윗면만' 충돌시키는 조각. 바위 슬래브는 원반이라 테두리가 급경사인데, 그걸 그대로
   넣으면 겹쳐 깔린 슬래브의 테두리마다 벽이 서서 데크를 가로지를 수가 없다
   (실측: 15번 중 13~15번 멈춤). 그렇다고 통짜 납작 상자로 두면 보이는 모양과 아예
   달라진다. 그래서 걸을 수 있는 기울기(SLOPE_MAX)의 면만 남긴다 —
   보이는 윗면을 그대로 밟게 되고, 테두리 벽은 사라진다. */
var PIECE_TOPONLY=tblMerge(kitTbl('survival', {'rock-flat':1, 'rock-flat-grass':1}));
/* 통짜 상자·줄기 기둥 같은 '단순화' override 는 없앴다. 격자를 8 → 16 으로 올리니
   기둥 방식만으로도 몸이 안 샌다(실측: 울타리·문 달린 울타리·간판·철판·나무 모두
   최대 틈 0~0.19m 로 몸 지름 0.7m 보다 좁다). 보이는 모양과 부딪히는 모양이 같은 게
   맞고, 손으로 맵을 만들 때 예측이 된다.
   난간(rail)만 기둥 사이가 1.6m 로 벌어져 몸이 지나간다 — 그건 실제 생김새가 그렇다.
   PIECE_SOLID={'rail':1} 로 되돌리면 예전처럼 통짜 낮은 벽이 된다. */
var PIECE_SOLID={};
var PIECE_TRUNK={};
/* 조각 자체의 원점이 어긋난 것들을 로컬에서 보정한다(회전 전에 더한다).
   wall 의 슬래브는 칸 중심선(z=0)에 있는데 wall-corner 의 두 팔은 ±0.25 에 있어서
   그냥 놓으면 벽과 0.25 만큼 어긋나 틈이 벌어진다. 두께는 둘 다 0.3 으로 같으므로
   (-0.25,-0.25) 옮기면 팔이 이웃 벽의 슬래브와 정확히 한 줄이 된다. */
var PIECE_OFF=kitTbl('station', {'wall-corner':[-0.25,-0.25]});
/* 코너는 팔이 0.8 인데 필요한 길이는 0.65 라, 정렬하면 이웃 벽과 0.15(=0.44m) 겹친다.
   길이를 줄이면 반대로 틈이 벌어지므로 겹침은 그대로 두되, 조각을 3% 줄여
   옆면이 벽면보다 안쪽(4.5mm)에 오게 한다 — 같은 평면이 사라져 깜박임이 없어지고,
   겹침이 남아 있어 틈도 안 생긴다. */
var PIECE_SCALE=kitTbl('station', {'wall-corner':0.97});
var RAIL_SOLID=1;                      // 0 이면 난간을 장식으로(통과) 되돌린다
/* 킷 목록도 여기 있어야 한다 — 로드 시점 setLevel 이 stationParts() 를 부르는데,
   이게 아래에 있으면 그때 undefined 라 조각 사전이 통째로 비고, 그 빈 사전이
   캐시돼 그 뒤로 모든 맵이 조각 없이 뜬다. */
var KIT_ORDER=[['station','STATION_BAKED'],['survival','SURVIVAL_BAKED'],
               ['factory','FACTORY_BAKED'],['forest','FOREST_BAKED'],['proto','PROTO_BAKED']];
function baseName(t){ var i=t.lastIndexOf('/'); return i<0?t:t.slice(i+1); }
/* 절차적 아레나 시드. MATCH_SEED 는 방장이 굴려 start 에 실어 보내고(전원이 같은 지형을
   봐야 한다), FLOOR_SEED 는 거기에 라운드 번호를 섞은 값이라 라운드마다 판이 바뀐다.
   선언이 여기 있어야 한다 — setLevel 이 로드 시점에 buildCollapseFloor 를 부른다. */
var MATCH_SEED=1, FLOOR_SEED=1;
function roundSeed(n){ return ((MATCH_SEED>>>0) ^ Math.imul(n+1, 0x9E3779B1)) >>> 0; }
function newSeed(){ return (Math.random()*0xFFFFFFFF)>>>0; }
/* 대기방 연습장 시드는 방 코드에서 뽑는다. 대기방에서도 서로가 보이므로 지형이
   같아야 하는데(안 그러면 상대가 허공에 서 있다), 방마다는 달라야 한다.
   방 코드는 이미 전원이 공유하고 있어서 새 메시지 없이 이게 성립한다. */
function seedFromStr(str){
  var h=0x811C9DC5>>>0;
  for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); }
  return h>>>0;
}
function lobbySeed(){ return (MP&&MP.room) ? seedFromStr(MP.room) : newSeed(); }
/* 등록된 레벨 데이터는 원본 그대로 둬야 한다 — 무너지는 아레나가 boxes 를 실시간으로
   고치기 때문에, 예전처럼 LEVEL 이 원본을 그대로 가리키면 한 판 하고 나면 맵이
   영구히 부서진 채로 남는다. 얕은 복사 + 박스만 복사하면 충분하다(박스 ≤ 100). */
function cloneLevel(d){
  var c={}, k;
  for(k in d) c[k]=d[k];
  c.boxes=d.boxes.map(function(b){ var o={}; for(var kk in b) o[kk]=b[kk]; return o; });
  // 조각도 복사한다 — 붕괴가 _gone 을 찍기 때문에 원본을 그대로 쓰면 한 판 하고 나면
  // 그 맵이 영구히 부서진 채로 남는다(박스와 같은 이유)
  if(d.pieces) c.pieces=d.pieces.map(function(q){ var o={}; for(var kk in q) o[kk]=q[kk]; return o; });
  return c;

/* 정적 조각 맵 — kiteditor.html 이 만든 레벨. 생성기 없이 조각 목록을 그대로 깔고
   모양에서 뽑은 충돌체를 붙인다. unit 은 1킷유닛이 몇 미터인지(기본 3m). */
function buildStaticPieces(){
  if(!LEVEL || !LEVEL.pieces || !LEVEL.pieces.length) return;
  STATION.unit = LEVEL.unit || STATION.unit;
  var U=STATION.unit, PP=stationParts();
  LEVEL.pieces.forEach(function(pc){
    if(pc.deco) return;
    var m=PP[pc.t]; if(!m) return;
    var useTri = (PIECE_FLAT[pc.t]==null);
    pieceColliders(pc, m, U, {col:'#6b7280', _hide:true})
      .forEach(function(b){ b._tri=useTri; LEVEL.boxes.push(b); });
  });
  buildStation(LEVEL.pieces);
}
function setLevel(id){
  var d=PENG.getLevel(id);
  if(!d){ id=PENG.defaultLevel(); d=PENG.getLevel(id); }   // 모르는 맵이면 기본 맵으로
  if(!d) return false;

     지난 맵의 조각이 그대로 남아 허공에 떠 있는다(그리기는 STATION.count 만 본다). */
  STATION.count=0; STATION.pending=null;

  buildStaticPieces();                                     // 에디터로 놓은 조각
  buildTriSoup();                                          // 조각의 삼각형 = 실제 이동 판정
  buildPads();                                             // 아이템 패드 위치

  var mv=document.getElementById('mapV'); if(mv) mv.textContent='🗺 '+(d.name||id);

/* ---------- 무너지는 바닥 ----------
   맵을 새로 만들지 않고도 매 라운드 다른 판이 되게 하는 장치. 레벨 파일에는
   collapse 스펙만 있고 실제 바닥 타일은 여기서 깐다. 각 타일은 중심에서 몇 번째
   고리인지(_ring)를 들고 있고, 라운드가 흐르면 바깥 고리부터 떨어져 나간다.
   바닥 위 구조물(단·엄폐물)도 자기 고리와 함께 떨어진다 — 안 그러면 허공에 뜬다. */
function buildCollapseFloor(){
  var C=LEVEL&&LEVEL.collapse; if(!C) return;
  // 원본에서 통째로 다시 만든다. 타일만 지우면 지난 라운드에 같이 떨어진
  // 단·엄폐물이 _fall/deco 상태로 남아 2라운드부터 아레나가 텅 빈다.
  var src=PENG.getLevel(CURLEVEL);
  LEVEL.boxes = src ? cloneLevel(src).boxes
                    : LEVEL.boxes.filter(function(b){ return !b._tile; });
  var maxR=0, i, j;
  // 타일 사이에 살짝 틈을 준다 — 경계가 보여야 어디가 무너질지 읽힌다.
  // 틈(0.08m)은 몸 반지름(0.35m)보다 훨씬 좁아 사이로 빠지지 않는다.
  var TH=C.size*0.48;
  function tile(cx,cy,cz,ring,col){
    LEVEL.boxes.push({ cx:cx, cy:cy, cz:cz, hx:TH, hy:C.hy, hz:TH,
      col:col, _tile:true, _ring:ring, _col0:col });
    if(ring>maxR) maxR=ring;
  }
  if(C.gen==='station'){
    /* 우주 정거장 — 코어에서 복도를 뻗어 포드를 붙이는 조립식.
       조각은 정적 VBO 로 따로 그리고, 여기서는 충돌체만 LEVEL.boxes 에 넣는다.
       _ring 은 '분리 순서'다 — 기존 붕괴 코드가 그대로 쓴다(큰 값부터 떨어져 나간다). */
    STATION.unit = C.size || STATION.unit;      // 레벨이 정한 칸 크기를 따른다
    var ST=PENG.genStation(FLOOR_SEED), U=STATION.unit, PP=stationParts();
    /* 충돌체는 조각 '모양'에서 뽑는다 — 목록을 따로 받지 않는다.
       그래야 문 구멍으로 지나가고 탁자 밑으로 들어갈 수 있다. */
    ST.pieces.forEach(function(pc){
      if(pc.deco) return;                       // 순수 장식(지금은 없다)
      var m=PP[pc.t]; if(!m) return;
      var bs=pieceBoxes(m, pc.t), r=pc.rot&3;
      var po=PIECE_OFF[pc.t], pox=po?po[0]:0, poz=po?po[1]:0;
      var ps=PIECE_SCALE[pc.t]||1;
      for(var q=0;q<bs.length;q++){
        var b=bs[q], x=(b.cx+pox)*ps, z=(b.cz+poz)*ps, hx=b.hx*ps, hz=b.hz*ps;
        for(var t=0;t<r;t++){ var tx=z; z=-x; x=tx; var th=hz; hz=hx; hx=th; }
        LEVEL.boxes.push({ cx:(pc.i+x)*U, cy:(pc.y+b.cy*ps)*U, cz:(pc.j+z)*U,
          hx:hx*U, hy:b.hy*ps*U, hz:hz*U,
          col:C.col, _tile:true, _ring:pc.order, _col0:C.col,
          /* 보이는 건 킷 조각 쪽이다 — 이건 광선(조준·폭발 가림)용.
             몸의 이동 판정은 _tri 표시를 보고 삼각형 쪽으로 넘긴다. */
          _hide:true, _tri:(PIECE_FLAT[pc.t]==null) });
      }
      if(pc.order>maxR) maxR=pc.order;
    });
    LEVEL._pieces = ST.pieces;
    LEVEL.spawns = ST.spawns.map(function(s2){ return {x:s2.i*U, y:0, z:s2.j*U}; });
    LEVEL.pads   = ST.pads.map(function(p2){ return {x:p2.i*U, y:0, z:p2.j*U}; });
    LEVEL.start  = LEVEL.spawns[0];
    LEVEL._gen   = [ST.info];
    buildStation(ST.pieces);
  } else if(C.gen==='peak'){
    /* 피크 — 판 전체가 킷 조각이다. 색칠한 박스 지면도, 박스로 쌓은 절벽도 없다.
       그림은 STATION 정적 VBO 가, 충돌은 조각 모양에서 뽑은 박스가 맡는다.
       바위 슬래브는 배율을 키워 '발판'으로 쓰고, 윗면이 전부 같은 평면에 오도록
       생성기가 y 를 내려 놓는다(자세한 건 level.js 의 genPeak 주석). */
    STATION.unit = C.size || STATION.unit;
    var PK=PENG.genPeak(FLOOR_SEED), U2=STATION.unit, PP2=stationParts();
    PK.pieces.forEach(function(pc){
      if(pc.order>maxR) maxR=pc.order;
      if(pc.deco) return;                       // 산체·풀 — 보이기만 하고 통과
      var m=PP2[pc.t]; if(!m) return;
      pieceColliders(pc, m, U2, {col:C.col, _tile:true, _ring:pc.order, _col0:C.col,
                                 _hide:true})
        .forEach(function(b){ b._tri=(PIECE_FLAT[pc.t]==null); LEVEL.boxes.push(b); });
    });
    if(PK.maxRing>maxR) maxR=PK.maxRing;
    LEVEL._pieces = PK.pieces;
    LEVEL.spawns = PK.spawns.map(function(s2){ return {x:s2.i*U2, y:s2.h*U2, z:s2.j*U2}; });
    LEVEL.pads   = PK.pads.map(function(p2){ return {x:p2.i*U2, y:p2.h*U2, z:p2.j*U2}; });
    LEVEL.start  = LEVEL.spawns[0];
    LEVEL._gen   = [PK.info];
    buildStation(PK.pieces);
  } else if(C.gen){
    /* 절차적 판 — 시드 하나로 전원이 같은 지형을 만든다(릴레이라 지형 권위가 없다).
       FLOOR_SEED 는 라운드마다 바뀐다: 경기 시드 + 라운드 번호. */
    var G=PENG.genArena(C, FLOOR_SEED);
    /* 바닥은 병합된 슬랩으로 깐다. 낱개 타일이면 2.6m 정사각형 눈금이 그대로 보여
       아무리 파내도 '바둑판'으로 읽힌다. 슬랩은 틈 없이 맞물리므로 이음매가 안 보인다
       — 어느 고리가 무너질지는 예고 깜빡임이 고리 전체를 물들여서 그대로 읽힌다. */
    G.slabs.forEach(function(sl){
      var col=sl.h>0?(C.platCol||'#6b8fc4'):C.col;
      LEVEL.boxes.push({ cx:sl.cx, cy:C.y+sl.h, cz:sl.cz,
        hx:sl.hx, hy:C.hy, hz:sl.hz, col:col, _tile:true, _ring:sl.ring, _col0:col });
      if(sl.ring>maxR) maxR=sl.ring;
    });
    // 구조물 — 통째로 한 고리에 속하게 해서 무너질 때 반쪽만 남지 않는다
    G.structures.forEach(function(st){
      st.boxes.forEach(function(b){
        b.cy+=C.y+C.hy;                       // 바닥 윗면 기준으로 올린다
        b._ring=st.ring; b._col0=b.col;
        LEVEL.boxes.push(b);
      });
    });
    // 스폰·패드도 생성 결과를 따른다 — 없어진 칸 위에 서면 시작하자마자 떨어진다
    LEVEL.spawns = G.spawns.map(function(s){ return {x:s.i*C.size, y:s.h, z:s.j*C.size}; });
    LEVEL.pads   = G.pads.map(function(p){ return {x:p.i*C.size, y:p.h+(p.center?0.7:0), z:p.j*C.size}; });
    LEVEL.start  = LEVEL.spawns[0];
    LEVEL._gen   = G.used;
  } else {
    var n=Math.ceil(C.radius/C.size);
    for(i=-n;i<=n;i++) for(j=-n;j<=n;j++){
      var cx=i*C.size, cz=j*C.size;
      if(Math.hypot(cx,cz)>C.radius) continue;
      tile(cx, C.y, cz, Math.round(Math.hypot(cx,cz)/C.size), C.col);
    }
  }
  for(i=0;i<LEVEL.boxes.length;i++){ var b=LEVEL.boxes[i];
    if(b._tile||b.deco||b._ring!=null) continue;   // 구조물은 이미 제 고리를 들고 있다
    b._ring=Math.round(Math.hypot(b.cx,b.cz)/C.size); b._col0=b.col;
  }
  LEVEL._maxRing=maxR; LEVEL._gone=0;
}
function dropRing(r){
  if(!LEVEL) return;
  // 정거장: 그 순서의 조각을 통째로 목록에서 빼고 VBO 를 다시 만든다(분리 = 떨어져 나감)
  if(LEVEL._pieces){
    var any=false;
    for(var q=0;q<LEVEL._pieces.length;q++){
      var pp=LEVEL._pieces[q];
      if(pp.order===r && !pp._gone){ pp._gone=true; any=true; }
    }
    if(any){
      /* VBO 는 고리 오름차순으로 쌓여 있다(buildStation) — 링 분리는 그리는 정점 수를
         줄이는 것으로 끝난다. 예전처럼 통째로 다시 만들면(수십 ms) 무너지는 순간마다
         프레임이 떨어져 화면이 튄다. 충돌용 삼각형 그물은 여전히 다시 짜야 한다. */
      if(STATION.ends){
        var cnt=0;
        for(var e=0;e<STATION.ends.length;e++) if(STATION.ends[e].order<r) cnt=STATION.ends[e].count;
        STATION.count=cnt;
      } else buildStation(LEVEL._pieces);
      buildTriSoup();
    }
  }
  for(var i=0;i<LEVEL.boxes.length;i++){ var b=LEVEL.boxes[i];
    if(b.deco || b._ring!==r || b._fall) continue;
    b._fall=true; b._vy=0; b.deco=true;      // deco = 이제 밟히지도 총알을 막지도 않는다
    b.col=b._col0||b.col;
  }
  tone(90,0.5,'sawtooth',0.10,38);            // 낮게 깔리는 붕괴음
}
/* 라운드 시계에 맞춰 고리를 떨어뜨리고, 떨어지는 중인 타일을 아래로 흘린다.
   ROUND.phase 가 'live' 일 때만 새로 무너뜨린다 — 라운드 정산 중에 판이 계속
   사라지면 다음 라운드 시작 위치가 이미 없어져 있다. */
function collapseTick(dt){
  var C=LEVEL&&LEVEL.collapse; if(!C) return;
  if(ROUND.phase==='live' && LEVEL._maxRing){
    var want = ROUND.t<C.first ? 0 : Math.floor((ROUND.t-C.first)/C.every)+1;
    // 고리 0(가운데 단)은 남긴다 — 마지막에 설 자리가 없으면 라운드가 무승부로 끝난다
    var keep=C.keepRings||1;
    while(LEVEL._gone<want && LEVEL._maxRing-LEVEL._gone>=keep){
      dropRing(LEVEL._maxRing-LEVEL._gone); LEVEL._gone++;
    }
    // 다음에 무너질 고리를 깜빡여 예고한다(피할 시간을 주지 않으면 그냥 사고사다)
    var nextR=LEVEL._maxRing-LEVEL._gone;
    var tNext=C.first+LEVEL._gone*C.every;
    var warn = nextR>=1 && ROUND.t>tNext-C.warn && ROUND.t<tNext;
    var hot = warn && (Math.floor(ROUND.t*7)%2===0);
    for(var i=0;i<LEVEL.boxes.length;i++){ var b=LEVEL.boxes[i];
      if(b._fall || b._ring==null || b.deco) continue;
      b.col = (b._ring===nextR && hot) ? C.warnCol : (b._col0||b.col);
    }
  }
  // 떨어지는 타일 — 가속해서 내려가고 충분히 멀어지면 목록에서 뺀다
  var alive=false;
  for(var k=0;k<LEVEL.boxes.length;k++){ var f=LEVEL.boxes[k];
    if(!f._fall) continue;
    f._vy=(f._vy||0)+GRAV*0.55*dt; f.cy-=f._vy*dt; alive=true;
  }
  if(alive) LEVEL.boxes=LEVEL.boxes.filter(function(b){
    return !(b._fall && b.cy < LEVEL.killY-10); });
}

/* 접촉 여유(m). 착지는 s.p.y 에 발판 윗면 값을 그대로 대입한다(moveAxis 참조). 그래서

   프레임의 x/z 이동이 부동소수점 반올림에 따라 "발판에 파묻힘"으로 읽혀 통째로 되돌려졌다

var HIT_EPS=1e-4;

/* 근접 신관: 광선이 팀원 몸 근처를 지나가면 지형까지 가지 않고 거기서 터뜨린다.

function peerFuse(o, d, maxT, out){
  if(out) out.hit=false;

  var now = (typeof performance!=='undefined') ? performance.now() : 0;

    var t = (cx-o.x)*d.x + (cy-o.y)*d.y + (cz-o.z)*d.z;           // 광선 위 최근접 지점

/* ---------- 협동 기믹: 연동 압력판 ----------

   밟는 사람은 건널 수 없으므로, 건너간 사람이 반대편 판을 밟아 되갚는 왕복 릴레이가 된다. */
var LINK_ON={};

  return Math.abs(x-b.cx) <= b.hx+PEER_R && Math.abs(z-b.cz) <= b.hz+PEER_R &&

  for(var q=0;q<LEVEL.boxes.length;q++) if(LEVEL.boxes[q].plate) LINK_ON[LEVEL.boxes[q].plate]=false;
  for(var i=0;i<LEVEL.boxes.length;i++){ var b=LEVEL.boxes[i]; if(!b.plate) continue;
    var on = onPlate(b, s.p.x, s.p.y, s.p.z);

function boxSolid(b){ return !b.deco && (!b.link || !!LINK_ON[b.link]); }

/* ---------- 폴리곤 충돌 ----------

   광선(조준선·투사체·폭발 가림·봇 시야)은 기존 상자를 계속 쓴다 — 거긴 넉넉해도

var TSOUP=null, TCELL=1.5;
function buildTriSoup(){

  /* '평평한 한 장'으로 치기로 한 조각(바닥·바위 슬래브)은 삼각형에 안 넣는다.
     원본 윗면이 살짝 볼록해서 삼각형 그대로 밟으면 데크가 도로 울퉁불퉁해진다 —

  for(q=0;q<list.length;q++){ pc=list[q];
    if(pc.deco||pc._gone||PIECE_FLAT[pc.t]!=null) continue;
    m=P[pc.t]; if(m) total+=m.idx.length; }
  if(!total) return;
  // 미리 크기를 재고 한 번에 채운다 — Array.push 로 40만 개를 쌓으면 로딩이 눈에 띈다
  var arr=new Float32Array(total*3), w=0;
  for(q=0;q<list.length;q++){
    pc=list[q]; if(pc.deco || pc._gone || PIECE_FLAT[pc.t]!=null) continue;

    var M=pieceBasis(pc), off=PIECE_OFF[pc.t], ox=off?off[0]:0, oz=off?off[1]:0;
    var I=m.idx, Q=m.pos, bx=pc.i*U, by=pc.y*U, bz=pc.j*U;
    var m0=M[0],m1=M[1],m2=M[2],m3=M[3],m4=M[4],m5=M[5],m6=M[6],m7=M[7],m8=M[8];
    var topOnly=(PIECE_TOPONLY[pc.t]!=null);
    for(var k=0;k<I.length;k+=3){
      var t0=w;
      for(var e=0;e<3;e++){

        arr[w++]=bx+(m0*px+m3*py+m6*pz)*U;

        arr[w++]=bz+(m2*px+m5*py+m8*pz)*U;

      if(topOnly && triNy(arr, t0) < SLOPE_MAX) w=t0;

     이걸로 대부분을 걸러 낸다(실측: 분리축까지 가는 게 1/10 로 줄었다). */

    var o=t*9;
    var x0=Math.min(arr[o],arr[o+3],arr[o+6]), x1=Math.max(arr[o],arr[o+3],arr[o+6]);
    var y0=Math.min(arr[o+1],arr[o+4],arr[o+7]), y1=Math.max(arr[o+1],arr[o+4],arr[o+7]);
    var z0=Math.min(arr[o+2],arr[o+5],arr[o+8]), z1=Math.max(arr[o+2],arr[o+5],arr[o+8]);
    bb[t*6]=x0; bb[t*6+1]=y0; bb[t*6+2]=z0; bb[t*6+3]=x1; bb[t*6+4]=y1; bb[t*6+5]=z1;
    for(var i=Math.floor(x0/TCELL);i<=Math.floor(x1/TCELL);i++)
      for(var j=Math.floor(y0/TCELL);j<=Math.floor(y1/TCELL);j++)
        for(var k2=Math.floor(z0/TCELL);k2<=Math.floor(z1/TCELL);k2++){
          var key=((i+512)*1024+(j+512))*1024+(k2+512);   // 숫자 키 — 문자열 연결이 비싸다

/* 몸 상자에 닿는 삼각형 번호를 공용 버퍼에 모은다(콜백·배열 할당 없이).
   반환값은 개수, 결과는 TCAND[0..cnt) 에 들어간다. */
var TCAND=[], _tseen=[], _tmark=0;
function triGather(x0,y0,z0,x1,y1,z1){
  if(!TSOUP) return 0;
  _tmark++;
  var g=TSOUP.grid, bb=TSOUP.bb, cnt=0;
  var i0=Math.floor(x0/TCELL), i1=Math.floor(x1/TCELL);
  var j0=Math.floor(y0/TCELL), j1=Math.floor(y1/TCELL);
  var k0=Math.floor(z0/TCELL), k1=Math.floor(z1/TCELL);
  for(var i=i0;i<=i1;i++) for(var j=j0;j<=j1;j++) for(var k=k0;k<=k1;k++){
    var L=g[((i+512)*1024+(j+512))*1024+(k+512)]; if(!L) continue;
    for(var q=0;q<L.length;q++){
      var t=L[q]; if(_tseen[t]===_tmark) continue; _tseen[t]=_tmark;
      var o6=t*6;
      if(bb[o6]>x1||bb[o6+3]<x0||bb[o6+1]>y1||bb[o6+4]<y0||bb[o6+2]>z1||bb[o6+5]<z0) continue;
      TCAND[cnt++]=t*9;
    }

/* 상자 vs 삼각형(분리축 13개). 겹치면 true. */
function boxTri(cx,cy,cz,hx,hy,hz, V,o){
  var ax=V[o]-cx, ay=V[o+1]-cy, az=V[o+2]-cz;
  var bx=V[o+3]-cx, by=V[o+4]-cy, bz=V[o+5]-cz;
  var gx=V[o+6]-cx, gy=V[o+7]-cy, gz=V[o+8]-cz;
  if(Math.min(ax,bx,gx)>hx || Math.max(ax,bx,gx)<-hx) return false;
  if(Math.min(ay,by,gy)>hy || Math.max(ay,by,gy)<-hy) return false;
  if(Math.min(az,bz,gz)>hz || Math.max(az,bz,gz)<-hz) return false;
  var ex=[bx-ax,by-ay,bz-az], fx=[gx-bx,gy-by,gz-bz], gx2=[ax-gx,ay-gy,az-gz];
  var E=[ex,fx,gx2];
  for(var i=0;i<3;i++){
    var e=E[i];
    // 축 = e × (1,0,0) / (0,1,0) / (0,0,1)
    var axes=[[0,-e[2],e[1]],[e[2],0,-e[0]],[-e[1],e[0],0]];
    for(var j=0;j<3;j++){
      var A=axes[j];
      var p0=A[0]*ax+A[1]*ay+A[2]*az, p1=A[0]*bx+A[1]*by+A[2]*bz, p2=A[0]*gx+A[1]*gy+A[2]*gz;
      var r=hx*Math.abs(A[0])+hy*Math.abs(A[1])+hz*Math.abs(A[2]);
      if(Math.min(p0,p1,p2)>r || Math.max(p0,p1,p2)<-r) return false;
    }

  var nx=ex[1]*fx[2]-ex[2]*fx[1], ny=ex[2]*fx[0]-ex[0]*fx[2], nz=ex[0]*fx[1]-ex[1]*fx[0];
  var d=nx*ax+ny*ay+nz*az, rr=hx*Math.abs(nx)+hy*Math.abs(ny)+hz*Math.abs(nz);
  return Math.abs(d)<=rr;
}
/* 삼각형 면이 사각형(XZ) 위에서 갖는 y 의 극값. 볼록×볼록 교집합이라 극값은
   꼭짓점에서 나온다 — 사각형 안의 삼각형 꼭짓점 / 삼각형 안의 사각형 꼭짓점 /
   변끼리의 교점만 보면 된다. 이게 있어야 경사면 위에 정확히 설 수 있다. */
function surfY(V,o, x0,x1,z0,z1, wantMax){

    var w1=((bz-cz)*(px-cx)+(cx-bx)*(pz-cz))*iA, w2=((cz-az)*(px-cx)+(ax-cx)*(pz-cz))*iA;
    return w1*ay+w2*by+(1-w1-w2)*cy; }

    else if(wantMax){ if(y>best) best=y; } else if(y<best) best=y; }
  function inTri(px,pz){

    return !(((s1<0)||(s2<0)||(s3<0)) && ((s1>0)||(s2>0)||(s3>0))); }
  // 1) 사각형 안의 삼각형 꼭짓점
  if(ax>=x0&&ax<=x1&&az>=z0&&az<=z1) upd(ay);
  if(bx>=x0&&bx<=x1&&bz>=z0&&bz<=z1) upd(by);
  if(cx>=x0&&cx<=x1&&cz>=z0&&cz<=z1) upd(cy);

  if(inTri(x0,z0)) upd(planeY(x0,z0));

  for(var e=0;e<3;e++){
    var px1,pz1,px2,pz2;
    if(e===0){ px1=ax; pz1=az; px2=bx; pz2=bz; }
    else if(e===1){ px1=bx; pz1=bz; px2=cx; pz2=cz; }
    else { px1=cx; pz1=cz; px2=ax; pz2=az; }
    var dx=px2-px1, dz=pz2-pz1, t, Z, X;
    if(dx>1e-9||dx<-1e-9){
      t=(x0-px1)/dx; if(t>=0&&t<=1){ Z=pz1+dz*t; if(Z>=z0&&Z<=z1) upd(planeY(x0,Z)); }
      t=(x1-px1)/dx; if(t>=0&&t<=1){ Z=pz1+dz*t; if(Z>=z0&&Z<=z1) upd(planeY(x1,Z)); }
    }
    if(dz>1e-9||dz<-1e-9){
      t=(z0-pz1)/dz; if(t>=0&&t<=1){ X=px1+dx*t; if(X>=x0&&X<=x1) upd(planeY(X,z0)); }
      t=(z1-pz1)/dz; if(t>=0&&t<=1){ X=px1+dx*t; if(X>=x0&&X<=x1) upd(planeY(X,z1)); }
    }
  }
  return best;
}
/* 면이 얼마나 누워 있나 — 정규화한 법선의 |y|. 1 이면 수평, 0 이면 수직.
   감기 방향(앞/뒤면)이 조각마다 다를 수 있어 절댓값을 쓴다. */
function triNy(V,o){
  var ux=V[o+3]-V[o], uy=V[o+4]-V[o+1], uz=V[o+5]-V[o+2];
  var wx=V[o+6]-V[o], wy=V[o+7]-V[o+1], wz=V[o+8]-V[o+2];
  var nx=uy*wz-uz*wy, ny=uz*wx-ux*wz, nz=ux*wy-uy*wx;
  var L=Math.sqrt(nx*nx+ny*ny+nz*nz);
  return L>1e-12 ? Math.abs(ny)/L : 0;
}
/* 걸어 오를 수 있는 최대 경사. cos 값이라 0.65 = 약 49도.
   이게 없으면 '높이차가 턱(0.34m) 안쪽이면 통과' 규칙 때문에 거의 수직인 벽도
   한 스텝에 조금씩만 파고들며 계속 기어오를 수 있다 — 실측으로 81도까지 올라갔다. */
var SLOPE_MAX=0.65;
function triBlocked(px,py,pz){
  if(!TSOUP) return false;
  var cy=py+PH_HY;
  var cnt=triGather(px-PH_HX,py,pz-PH_HZ, px+PH_HX,py+2*PH_HY,pz+PH_HZ);
  for(var q=0;q<cnt;q++)
    if(boxTri(px,cy,pz, PH_HX,PH_HY,PH_HZ, TSOUP.v,TCAND[q])) return true;
  return false;
}
function boxBlocked(px,py,pz){
  for(var i=0;i<LEVEL.boxes.length;i++){ var b=LEVEL.boxes[i];
    if(!boxSolid(b) || b._tri) continue;   // 장식·꺼진 발판은 통과 / _tri 는 삼각형이 맡는다
    if(aabbHit(px,py,pz,b)) return true; }
  return triBlocked(px,py,pz);
}
function resolvePeers(s){
  if(GAMEMODE!=='versus') return;
  if(typeof MP==='undefined' || !MP || !MP.peers) return;   // 솔로·검증 하네스
  if(typeof peerSample!=='function') return;
  var now=(typeof performance!=='undefined')?performance.now():0, minD=PEER_R*2;
  for(var id in MP.peers){
    var ps=peerSample(MP.peers[id], now); if(!ps) continue;
    // 세로로 안 겹치면(머리 위·발밑) 그냥 지나간다 — 안 그러면 위에서 떨어질 때 끼인다
    if(Math.abs(s.p.y-ps.y) >= PH_HY*2) continue;
    var dx=s.p.x-ps.x, dz=s.p.z-ps.z, d=Math.hypot(dx,dz);
    if(d>=minD) continue;
    if(d<1e-4){ dx=Math.sin(s.yaw); dz=Math.cos(s.yaw); d=1; }  // 완전히 포개짐 → 등 뒤로
    var nx=dx/d, nz=dz/d, push=(minD-d)*0.5+0.001;
    // 밀려나다 벽/엄폐물 속으로 들어가면 안 된다 — 파고드는 축은 되돌린다
    var ox=s.p.x, oz=s.p.z;
    s.p.x+=nx*push; if(boxBlocked(s.p.x,s.p.y,s.p.z)) s.p.x=ox;
    s.p.z+=nz*push; if(boxBlocked(s.p.x,s.p.y,s.p.z)) s.p.z=oz;
    // 파고드는 속도 성분만 지운다(옆으로 미끄러지는 건 남겨야 몸이 붙어도 움직인다)
    var vn=s.v.x*nx+s.v.z*nz;
    if(vn<0){ s.v.x-=vn*nx; s.v.z-=vn*nz; }
  }
}
/* ---- 수렴 조준 ----
   3인칭 카메라는 눈 뒤(조준 중엔 오른쪽 옆)에 있다. 그래서 눈에서 정직하게 정면으로 쏘면
   화면 정중앙과 탄착점이 '거리에 따라 다른 양'으로 어긋난다. 조준점을 탄착점에 붙여 두면
   회전·이동으로 그 거리가 변할 때마다 조준점이 화면을 미끄러지고, 모서리를 스칠 땐
   근거리↔원거리로 뚝 점프한다 — 조준선 전체가 흔들리는 것처럼 보인다.
   그래서 반대로 맞춘다. 화면 정중앙(=카메라 중앙 광선)이 닿는 지점을 목표로 잡고,
   탄은 눈에서 그 지점을 향해 쏜다. 목표는 카메라 중앙축 위에 있으므로 거리가 아무리
   변해도 언제나 화면 정중앙에 투영된다 → 조준점이 못 박힌 듯 고정된다.
   1인칭은 카메라가 곧 눈이라 결과가 forwardVec 과 같다(계산을 건너뛴다).
   aimD 는 눈에서 그 목표까지의 거리 — 탄이 목표에 닿기 전에 막혔는지 판별하는 데 쓴다.
   수렴을 안 쓰는 경로(1인칭·퇴화)는 '막힘'이라는 개념 자체가 없으므로 aimD=0 을 준다. */
function aimRay(s){
  var o=eyePos(s), f=forwardVec(s);
  if(!s.tp) return {o:o, d:f, aimD:0};
  setCamera(s);          // 마지막 렌더 뒤에 마우스가 더 움직였을 수 있다 — 지금 시점으로 다시 잡는다
  /* 광선은 카메라 위치가 아니라 '카메라 중앙축 위에서 눈과 가장 가까운 점'(q)에서 쏜다.
     축 위라서 "정중앙에 투영된다"는 성질은 그대로인데, 카메라와 플레이어 사이의 지형은
     건너뛴다. 3인칭 카메라엔 충돌이 없어 위를 보면 바닥에 파묻히는데, 거기서부터 훑으면
     "코앞 0.2m 에서 막힘"이 나와 조준이 통째로 엉킨다(파묻힌 프레임의 절반이 그랬다). */
  var back=(o.x-CAMPOS.x)*CAMF.x + (o.y-CAMPOS.y)*CAMF.y + (o.z-CAMPOS.z)*CAMF.z;
  var q={x:CAMPOS.x+CAMF.x*back, y:CAMPOS.y+CAMF.y*back, z:CAMPOS.z+CAMF.z*back};
  var t=BLAST_RANGE;
  for(var i=0;i<LEVEL.boxes.length;i++){ if(!boxSolid(LEVEL.boxes[i])) continue;
    var h=rayBox(q,CAMF,LEVEL.boxes[i]); if(h<t)t=h; }
  t=peerFuse(q, CAMF, t);             // 팀원 근접 신관도 "화면 중앙" 기준으로 본다
  // 몸이 벽에 붙어 t 가 0 으로 무너지면 목표가 발밑으로 내려앉는다 — 하한을 건다
  if(t<CONV_MIN) t=CONV_MIN;
  var dx=q.x+CAMF.x*t-o.x, dy=q.y+CAMF.y*t-o.y, dz=q.z+CAMF.z*t-o.z;
  var L=Math.hypot(dx,dy,dz);
  if(!(L>1e-4)) return {o:o, d:f, aimD:0};
  return {o:o, d:{x:dx/L, y:dy/L, z:dz/L}, aimD:L};
}
/* ---------- AI 봇 ----------
   서버는 순수 중계라 물리도 레벨도 없다. 그래서 봇은 '방장의 클라이언트'가 돌리고,
   서버는 가상 참가자 슬롯만 잡아 준다. 게스트 입장에서는 사람과 구별되지 않는다.
   봇도 사람과 똑같이 stepSim 을 돌린다 — 별도 물리를 만들면 반드시 어긋난다. */
var BOTS=[];                 // [{id, name, sim, ...}] — 방장만 채운다
var BOT_FIRE_CD=0.55;        // 사격 간격(사람보다 느리게 — 완벽하면 재미없다)
var BOT_AIM_ERR=0.10;        // 조준 오차(rad)
var BOT_RANGE=13;            // 이 거리 안이면 쏜다
var BOT_EDGE=2.2;            // 이만큼 앞에 바닥이 없으면 물러난다
var BOT_MIN_CLEAR=2.4;       // 이보다 가까운 게 막고 있으면 사격을 참는다
/* 발밑에 설 곳이 있는지 — 봇이 스스로 떨어지지 않게 하는 가장 중요한 판정.
   이게 없으면 봇은 상대를 쫓다가 그대로 낭떠러지로 걸어 들어간다. */
function groundAt(x, z, y){
  for(var i=0;i<LEVEL.boxes.length;i++){ var b=LEVEL.boxes[i];
    if(!boxSolid(b)) continue;
    if(Math.abs(x-b.cx)>b.hx+0.2 || Math.abs(z-b.cz)>b.hz+0.2) continue;
    var top=b.cy+b.hy;
    if(top<=y+1.2 && top>y-6) return top;      // 걸어 내려갈 수 있는 범위
  }
  return null;
}
/* 지금 보고 있는 방향으로 뭐가 얼마나 가까이 있나. 벽에 코를 박고 쏘면
   자기 폭발 반경 안에서 터져 스스로 날아간다 — 봇이 '이상하게' 보이는 큰 원인. */
function botClear(s){
  var o=eyePos(s), d=forwardVec(s), t=BLAST_RANGE;
  for(var i=0;i<LEVEL.boxes.length;i++){ if(!boxSolid(LEVEL.boxes[i])) continue;
    var h=rayBox(o,d,LEVEL.boxes[i]); if(h<t) t=h; }
  return t;
}
/* 가장 가까운 상대를 고른다 — 사람이든 다른 AI 든 가리지 않는다.
   예전엔 봇끼리 서로 무시해서 사람만 두들겨 맞는 난투가 됐다.
   자기 자신은 MP.peers 에도 들어 있으므로(렌더·충돌 재사용) 반드시 빼야 한다. */
function botTarget(bot){
  var bs=bot.sim, best=null, bd=1e9;
  var now=(typeof performance!=='undefined')?performance.now():0;
  for(var id in MP.peers){
    if(+id===bot.id) continue;                                   // 나 자신
    var ps=peerSample(MP.peers[id], now); if(!ps) continue;
    var d=Math.hypot(ps.x-bs.p.x, ps.z-bs.p.z); if(d<bd){ bd=d; best={x:ps.x,y:ps.y,z:ps.z,d:d}; } }
  // 방장 자신
  if(sim && !sim.practice){
    var d2=Math.hypot(sim.p.x-bs.p.x, sim.p.z-bs.p.z);
    if(d2<bd){ bd=d2; best={x:sim.p.x, y:sim.p.y, z:sim.p.z, d:d2}; } }
  return best;
}
function botThink(bot, dt){
  FIRING_BOT=true;
  var s=bot.sim, inp={mf:false,mb:false,ml:false,mr:false,jump:false};
  bot.cd=Math.max(0,(bot.cd||0)-dt);
  var tgt=botTarget(bot);
  var gx=tgt?tgt.x:0, gz=tgt?tgt.z:0;
  var dx=gx-s.p.x, dz=gz-s.p.z, dist=Math.hypot(dx,dz)||1;
  s.yaw=Math.atan2(dx,dz);                       // 시선은 항상 표적

  /* 가고 싶은 '월드 방향'을 먼저 정하고 마지막에 입력으로 바꾼다.
     예전엔 정면만 짚어 봐서 옆걸음(strafe) 중에는 낭떠러지를 그대로 밟았다 —
     봇이 재미없어지는 가장 큰 이유가 '스스로 떨어지기'다. */
  var toC=Math.hypot(s.p.x,s.p.z)||1;
  var cx=-s.p.x/toC, cz=-s.p.z/toC;              // 판 가운데 쪽
  var mx=0, mz=0;
  if(dist>6.5){ mx=dx/dist; mz=dz/dist; }
  else if(dist<3.0){ mx=-dx/dist; mz=-dz/dist; }
  else {
    if(bot.strafe==null || Math.random()<0.008) bot.strafe=Math.random()<0.5;
    var sgn=bot.strafe?1:-1;
    mx=-dz/dist*sgn; mz=dx/dist*sgn;             // 표적 주위를 돈다
  }
  /* 붕괴 대비 — 지금 서 있는 고리가 다음에 무너질 고리면 상대고 뭐고 안쪽으로 물러난다.
     이게 없으면 봇은 표적만 보고 버티다 발밑이 통째로 사라져 그대로 떨어진다
     (실측: 이 규칙 없이는 30초에 4번 자멸했다). */
  var CC=LEVEL.collapse;
  if(CC && LEVEL._maxRing!=null){
    var myRing=Math.round(toC/CC.size);
    if(myRing >= LEVEL._maxRing-(LEVEL._gone||0)){ mx=cx; mz=cz; }
  }
  // 안전 확인 — 가려는 쪽에 바닥이 없으면 가운데로 방향을 튼다
  if(s.onGround && groundAt(s.p.x+mx*BOT_EDGE, s.p.z+mz*BOT_EDGE, s.p.y)===null){
    if(groundAt(s.p.x+cx*BOT_EDGE, s.p.z+cz*BOT_EDGE, s.p.y)!==null){ mx=cx; mz=cz; }
    else { mx=0; mz=0; }                          // 사방이 낭떠러지면 그냥 버틴다
  }

  /* 복귀 사격 — 떨어지는 중이거나 발밑에 아무것도 없으면 아래를 쏴 다시 뜬다.
     공중 조작이 약하므로(0.10) 동시에 가운데 쪽으로 밀어 준다. */
  var below = groundAt(s.p.x, s.p.z, s.p.y);
  var 위험 = !s.onGround && (s.v.y < -4) && (below===null || s.p.y - below > 3);
  if(위험){
    mx=cx; mz=cz;
    if(s.ammo>0 && bot.cd<=0){
      s.pitch=-PITCH_LIM; doFire(s); bot.cd=BOT_FIRE_CD*0.4; botBroadcastShot(bot);
    }
  } else if(tgt){
    // 조준 — 상대 발밑을 노려야 넉백이 위로 뜬다. 약간의 오차를 준다(완벽하면 재미없다).
    var eye=s.p.y+EYE, aimY=tgt.y+0.1;
    s.pitch=Math.atan2(aimY-eye, Math.max(0.6,tgt.d)) + (Math.random()*2-1)*BOT_AIM_ERR;
    s.yaw += (Math.random()*2-1)*BOT_AIM_ERR;
    /* 코앞이 막혔을 때만 참는다. 봇은 상대 '발밑'을 노리므로 광선이 표적 근처
       바닥에 닿는 게 정상이다 — 기준을 폭발 반경(4.2m)으로 잡으면 정상 사격까지
       전부 막혀 사격이 3분의 1로 줄어든다. 자기가 휘말릴 거리만 막는다. */
    var clear=botClear(s);
    if(clear < BOT_MIN_CLEAR){ bot.strafe=!bot.strafe; }
    else if(tgt.d<BOT_RANGE && s.ammo>0 && bot.cd<=0 && ROUND.phase==='live'){
      doFire(s); bot.cd=BOT_FIRE_CD; botBroadcastShot(bot);
    }
  }
  s.pitch=Math.max(-PITCH_LIM, Math.min(PITCH_LIM, s.pitch));

  /* 끼임 감지 — 봇은 점프를 안 하므로 계단·벽·탑 앞에서 영영 비벼댄다.
     가려는데 실제로 안 움직였으면 뛰어넘어 보고, 그래도 안 되면 방향을 튼다. */
  var f=Math.hypot(mx,mz);
  if(f>1e-3 && s.onGround){
    var moved=Math.hypot(s.p.x-(bot.px||0), s.p.z-(bot.pz||0));
    bot.stuck = (moved < 0.03) ? (bot.stuck||0)+dt : 0;
    if(bot.stuck>0.16){ inp.jump=true; }
    if(bot.stuck>0.7){ bot.strafe=!bot.strafe; bot.stuck=0; }
  } else bot.stuck=0;
  bot.px=s.p.x; bot.pz=s.p.z;

  // 월드 방향 → 시선 기준 입력(전후·좌우)
  if(f>1e-3){
    var fx=Math.sin(s.yaw), fz=Math.cos(s.yaw);
    var fwd=(mx*fx+mz*fz)/f, rgt=(mx*Math.cos(s.yaw)-mz*Math.sin(s.yaw))/f;
    if(fwd>0.35) inp.mf=true; else if(fwd<-0.35) inp.mb=true;
    if(rgt>0.35) inp.mr=true; else if(rgt<-0.35) inp.ml=true;
  }
  FIRING_BOT=false;
  return inp;
}
/* doFire 는 자기 폭발을 s.blasts 에 넣고 mpSend 로 '내 id' 로 알린다.
   봇의 사격은 봇 id 로 나가야 하므로, doFire 안의 전송을 막고 여기서 다시 보낸다. */
var BOT_SHOT=null;
function botBroadcastShot(bot){
  if(!BOT_SHOT) return;
  var m=BOT_SHOT; BOT_SHOT=null;
  m.bot=bot.id; mpSend(m);
}
function botStep(dt, now){
  if(!BOTS.length) return;
  for(var i=0;i<BOTS.length;i++){
    var bot=BOTS[i], s=bot.sim;
    stepSim(s, Math.min(0.05,dt), botThink(bot, dt));
    // 떨어졌으면 방장이 대신 신고한다
    if(GAMEMODE==='versus' && (s.fell||0)>(bot.lastFell||0)){
      bot.lastFell=s.fell; var bby=creditOf(s);
      mpSend({t:'fell', bot:bot.id, by:bby}); scoreFall(bot.id, bby);
    }
    // 봇 상태를 '피어'로 넣어 두면 렌더·충돌·근접신관이 전부 그대로 동작한다
    var pe=MP.peers[bot.id] || (MP.peers[bot.id]={buf:[]});
    pe.seen=now; pe.name=bot.name; if(bot.col) pe.col=bot.col;
    pe.buf.push({t:now, x:s.p.x, y:s.p.y, z:s.p.z, yaw:s.yaw, pitch:s.pitch, rc:s.recoil||0});
    if(pe.buf.length>16) pe.buf.shift();
    if(MP.connected && now-(bot.lastSend||0)>45){ bot.lastSend=now;
      mpSend({t:'st', bot:bot.id, x:Math.round(s.p.x*1000)/1000, y:Math.round(s.p.y*1000)/1000,
        z:Math.round(s.p.z*1000)/1000, yaw:Math.round(s.yaw*1000)/1000,
        pitch:Math.round(s.pitch*1000)/1000, rc:Math.round((s.recoil||0)*100)/100}); }
  }
}
// 봇 명단을 로스터에 맞춘다(서버가 슬롯의 주인이다)
/* AI 몸통 색 — 서로, 그리고 사람과 구별돼야 한다. 무작위 색상(HSL)에서 뽑되
   채도·명도를 묶어 배경(어두운 남색)에 묻히지 않게 한다. */
function randBotColor(){
  var h=Math.random()*360, sat=0.62, lig=0.58;
  function f(n){ var k=(n+h/30)%12, a=sat*Math.min(lig,1-lig);
    var v=lig-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));
    return ('0'+Math.round(v*255).toString(16)).slice(-2); }
  return '#'+f(0)+f(8)+f(4);
}
function syncBots(){
  if(!mpIsHost()){ BOTS.length=0; return; }
  var want=MP.players.filter(function(p){ return p.bot; });
  BOTS=BOTS.filter(function(b){ return want.some(function(p){ return p.id===b.id; }); });
  want.forEach(function(p){
    if(BOTS.some(function(b){ return b.id===p.id; })) return;
    var s=makeSim(); s.tp=false;
    var col=randBotColor();
    BOTS.push({ id:p.id, name:p.name, sim:s, cd:0, lastFell:0, lastSend:0, col:col });
    // 내 화면과 팀원 화면 양쪽에 같은 색이 적용되게
    var pc=MP.peers[p.id]||(MP.peers[p.id]={buf:[]}); pc.col=col;
    if(MP.connected) mpSend({t:'col', bot:p.id, c:col});
  });
}
function botsRespawn(){
  BOTS.forEach(function(b, i){
    var sp=(LEVEL.spawns&&LEVEL.spawns.length)
      ? LEVEL.spawns[(ROUND.n+1+i)%LEVEL.spawns.length] : LEVEL.start;
    b.sim.p={x:sp.x,y:sp.y,z:sp.z}; b.sim.v={x:0,y:0,z:0};
    b.sim.ammo=AMMO_MAX; b.sim.items={}; b.sim.charges={};
    b.sim.blasts.length=0; b.sim.projectiles.length=0; b.sim.particles.length=0;
    b.lastFell=b.sim.fell||0; b.cd=0;
  });
}
/* ---------- 아이템 ----------

function randItem(){

function buildPads(){
  PADS.length=0;
  var L=LEVEL&&LEVEL.pads; if(!L) return;

  for(var i=0;i<L.length;i++) PADS.push({x:L[i].x, y:L[i].y, z:L[i].z, cd:0, item:randItem()});
  PADS_NEEDITEM = PADS.some(function(p){ return !p.item; });
