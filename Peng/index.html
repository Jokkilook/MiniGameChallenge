function applyLevelToPractice(){
  if(mode!=='lobbyScr') return;
  FLOOR_SEED=lobbySeed(); buildCollapseFloor(); buildPads();
  sim=makeSim(); sim.practice=true; acc=0; last=0;
}
// 대기방 = 연습장. 기다리는 동안 실제로 움직이고 쏴볼 수 있다(기록은 세지 않음).
function enterLobby(levelId){
  if(levelId) setLevel(levelId);
  // 방마다 다른 연습장 — 예전엔 로드 시 시드(1) 그대로라 어느 방을 만들어도 똑같았다
  FLOOR_SEED=lobbySeed(); buildCollapseFloor(); buildPads();
  if(!sim || !sim.practice){ sim=makeSim(); sim.practice=true; }
  acc=0; last=0; showScreen('lobbyScr'); renderLobby();
}
function startGame(levelId){
  // 내게 없는 맵이면 setLevel 이 기본 맵으로 떨군다. 그걸 조용히 넘기면
  // "같은 방인데 서로 다른 맵을 달리는" 상태가 되고, 한참 뒤에야 알아채게 된다.
  var missing = levelId && !PENG.getLevel(levelId);
  if(levelId) setLevel(levelId);
  /* 피어 버퍼는 비우되 '몸통 색'은 살린다. 예전엔 통째로 비워서 대기방에서 고른
     색(사람·AI 모두)이 게임에 들어가는 순간 기본색으로 되돌아갔다 —
     색을 다시 보내는 쪽은 아무도 없다(서버는 join 때만 알려준다). */
  var _keepCol={};
  for(var _pk in MP.peers) if(MP.peers[_pk].col) _keepCol[_pk]=MP.peers[_pk].col;
  MP.peers={};
  for(var _ck in _keepCol) MP.peers[_ck]={buf:[], col:_keepCol[_ck]};
  sim=makeSim(); resetScores(); resetRound(); lastFell=0; CAM_LEN=null;
  // 경쟁은 1라운드부터 각자 다른 스폰에서 시작한다(둘 다 LEVEL.start 면 겹쳐서 시작한다)
  if(GAMEMODE==='versus' && !sim.practice) newArena();
  // 게스트도 시작할 때 피어를 비우므로 봇 색을 다시 알려 준다
  if(MP.connected) BOTS.forEach(function(b){ if(b.col) mpSend({t:'col', bot:b.id, c:b.col}); });
  showScreen('play'); acc=0; last=0; requestLock();
  if(missing){
    var warn='맵 불일치 · 내 쪽에 "'+levelId+'" 가 없어 "'+(LEVEL.name||CURLEVEL)+'" 로 시작 (levels/ 폴더 필요)';
    // 방 전원에게 알린다(서버가 본인에게도 되돌려 주므로 내 화면에도 뜬다).
    // 호스트도 알아야 다시 시작하든 맵을 바꾸든 할 수 있다.
    if(MP.connected) mpSend({t:'ch', text:warn}); else pushChat('', warn, false, true);
  }
}

var CURVP=null;
function projectWorld(p){                 // 월드 → 논리 화면(W,H) 좌표. 카메라 뒤면 null
  var V=CURVP; if(!V) return null;
  var x=p[0], y=p[1], z=p[2];
  var cx=V[0]*x+V[4]*y+V[8]*z+V[12];
  var cy=V[1]*x+V[5]*y+V[9]*z+V[13];
  var cw=V[3]*x+V[7]*y+V[11]*z+V[15];
  if(cw<=0.0001) return null;
  return { x:(cx/cw*0.5+0.5)*W, y:(1-(cy/cw*0.5+0.5))*H };
}
/* 조준점은 화면 정중앙에 못 박는다. 수렴 조준(aimRay)이 "정중앙이 가리키는 곳"으로
   쏘도록 방향을 맞춰 주므로, 여기서 탄착점을 다시 투영해 옮길 필요가 없다 —
   예전엔 그 투영값을 그대로 썼고, 거리가 바뀔 때마다 조준점이 화면을 미끄러졌다.
   단 하나 남는 예외: 눈과 목표 사이가 막혀 탄이 먼저 터지는 경우(몸은 화면 중앙보다
   1.25m 옆에 있으니 모서리에 걸린다). 그때 조준점을 옮기면 다시 튀므로,
   위치는 그대로 두고 흐리게만 해서 "지금은 보이는 데를 못 쏜다"를 알린다. */
function updateCrosshair(s){
  var el=document.getElementById('crosshair'); if(!el) return;
  var rect=cv.getBoundingClientRect();
  if(rect.width<1 || rect.height<1){ el.style.left='50%'; el.style.top='50%'; return; }
  el.style.left=(rect.left + rect.width*0.5)+'px';
  el.style.top =(rect.top  + rect.height*0.5)+'px';
  var _ar=aimRay(s), o=_ar.o, d=_ar.d, tHit=BLAST_RANGE;   // doFire 와 완전히 같은 광선
  for(var i=0;i<LEVEL.boxes.length;i++){ if(!boxSolid(LEVEL.boxes[i])) continue;
    var t=rayBox(o,d,LEVEL.boxes[i]); if(t<tHit)tHit=t; }
  tHit = peerFuse(o, d, tHit);
  el.style.opacity = (tHit < _ar.aimD-0.05) ? '0.3' : '0.9';
  /* 탄이 떨어졌다는 신호. 지금까지는 오른쪽 아래 게이지에만 있었는데,
     교전 중에는 화면 구석을 볼 여유가 없어 조준선 한가운데에도 표시한다. */
  el.classList.toggle('dry', s.ammo<=0);
}
function requestLock(){ try{ cv.requestPointerLock(); }catch(e){} }
/* ---------- 일시정지 ----------
   ESC 는 keydown 으로 잡을 수 없다. 포인터락 중에 ESC 를 누르면 브라우저가 그걸
   '락 해제' 제스처로 먼저 가져가고 페이지에는 키 이벤트를 주지 않는다.
   그래서 '락이 풀렸다'를 일시정지 신호로 쓴다 — 알트탭·창 밖 클릭으로 풀려도
   메뉴가 뜨는데, 그것도 대부분의 브라우저 FPS 가 하는 동작이라 그대로 둔다.

   ※ 대기방에서도 똑같이 뜬다. 거기도 발밑에 물리가 돌고 마우스가 잠겨 있으므로
     ESC 의 뜻이 게임 안과 같아야 한다. 예전엔 대기방의 ESC 가 '마우스만 푼다'라
     화면에는 아무 일도 안 일어났고, 그걸 안내문 한 줄("Esc 로 마우스를 풀면 버튼을
     누를 수 있어요")로 메우고 있었다 — 문구로 메우는 동작은 대개 빠진 동작이다.

     대신 대기방에서는 오른쪽 패널을 딤 위로 올려 계속 눌리게 둔다. 방을 나가고
     AI 를 넣고 맵을 고르는 게 그 화면의 용건인데, 메뉴가 덮으면 통째로 막힌다. */
var PAUSED=false;
function inWorld(){ return mode==='play' || mode==='lobbyScr'; }
function openPause(){
  // 오버레이(설정 시트 등)가 떠 있으면 그것부터다 — 안 그러면 시트를 여느라 푼
  // 포인터락이 곧바로 일시정지로 이어져 시트 위에 메뉴가 겹친다.
  if(PAUSED || OVERLAY || !inWorld()) return;
  var lobby=(mode==='lobbyScr');
  PAUSED=true; keys={}; jumpEdge=false; jumpBuf=0;
  buildKeyHelp(); uiSnd('swap',0.3);
  document.getElementById('lobbyScr').classList.toggle('overPause', lobby);
  document.getElementById('pause').classList.toggle('besidePanel', lobby);
  // 어디서 멈췄는지 — 맥락 없이 메뉴만 뜨면 방금까지 뭘 하고 있었는지 흐려진다
  var w=document.getElementById('pauseWhere');
  if(w) w.innerHTML = lobby
    ? '대기방 <em>'+(MP.room||'—')+'</em>'
    : (LEVEL.name||CURLEVEL) + (sim && !sim.practice ? ' <em>'+sim.t.toFixed(1)+'초</em>' : '');
  var note=document.getElementById('pauseNote');
  note.className = 'netline' + (MP.connected ? ' ok' : '');
  /* 멀티에서 일시정지는 나를 지켜주지 않는다 — 물리는 계속 돈다. 그 사실을
     설명하는 대신 결과만 적는다. '다른 사람은 계속 뛰고 있다'는 문장이기도 했고,
     경쟁은 코스를 뛰는 게 아니라 아레나에서 밀어내는 것이라 사실도 아니었다. */
  note.innerHTML = MP.connected ? '<i></i>LIVE <s>멈춘 건 나뿐</s>' : '<i></i>PAUSED';
  // 버튼은 맥락에 맞게. 대기방에서 '나가기'는 게임이 아니라 방을 나가는 것이다
  document.getElementById('pauseResume').textContent = lobby ? '연습으로' : '계속하기';
  document.getElementById('pauseLeave').textContent  = lobby ? '방 나가기' : '나가기';
  document.getElementById('pause').classList.remove('off');
}
function closePause(relock){
  if(!PAUSED) return;
  PAUSED=false;
  document.getElementById('pause').classList.add('off');
  document.getElementById('lobbyScr').classList.remove('overPause');
  document.getElementById('pause').classList.remove('besidePanel');
  // 오래 멈춰 있었으면 그동안 쌓인 시간을 버린다 — 안 그러면 재개 순간 한꺼번에 돈다
  keys={}; jumpEdge=false; jumpBuf=0; acc=0; last=0;
  if(relock) requestLock();
}
document.getElementById('pauseResume').addEventListener('click',function(){ closePause(true); });
/* 일시정지 → 설정은 오버레이로 연다. 화면(showScreen)으로 열면 mode 가 바뀌어
   HUD 와 물리 상태가 날아가고, '계속하기'로 돌아올 자리가 사라진다. */

document.getElementById('pauseLeave').addEventListener('click',function(){

// 잠기지 않은 상태에서 화면을 클릭하면 마우스를 잠근다(발사는 아래 mousedown 이 담당)
cv.addEventListener('click',function(){ ensureAudio(); if(chatting) return;
  if(PAUSED || OVERLAY) return;          // 시트는 화면 일부만 덮는다 — 캔버스 클릭이 새어든다
  if((mode==='play'||mode==='lobbyScr') && !locked) requestLock(); });
/* 우클릭 홀드 = 조준 모드. contextmenu 는 document 에서 막아야 한다 —
   포인터락 중에는 이벤트가 캔버스가 아니라 document 로 가기 때문에, cv 에만 걸면
   메뉴가 떠서 락이 풀리고 그 다음 좌클릭이 '재잠금'으로 먹혀 발사가 안 됐다. */
document.addEventListener('contextmenu',function(e){
  if(mode==='play'||mode==='lobbyScr') e.preventDefault(); });
/* 발사는 click 대신 mousedown 으로 처리한다. click 은 좌버튼을 뗄 때만 오고
   다른 버튼과 겹치면 누락될 수 있어, 조준(우클릭) 중 좌클릭이 씹히는 원인이 된다. */
window.addEventListener('mousedown',function(e){
  if(chatting || !sim) return;
  // 디버그 패널·버튼을 누른 건 조작이 아니다(잠금 중이면 발사로 새어나간다)
  if(e.target && e.target.closest && e.target.closest('.asSheet')) return;
  if(e.button===2){ sim.aimHold=true; return; }
  if(e.button===0 && locked && !OVERLAY && (mode==='play'||mode==='lobbyScr')){
    ensureAudio(); doFire(sim); }
});
window.addEventListener('mouseup',function(e){ if(e.button===2 && sim) sim.aimHold=false; });
// 창 밖으로 나가면 버튼을 놓친다 → 조준이 걸린 채 남지 않게
window.addEventListener('blur',function(){ if(sim) sim.aimHold=false; });
document.addEventListener('pointerlockchange',function(){
  locked=(document.pointerLockElement===cv);
  cv.classList.toggle('locked', locked);        // 풀리는 즉시 커서가 보이게
  // 채팅을 열려고 푼 게 아니라면 락이 풀린 것 = ESC 를 눌렀다는 뜻
  if(!locked && inWorld() && !chatting && !OVERLAY) openPause();
});
document.addEventListener('mousemove',function(e){ if(!locked||!sim)return; var sX=MOUSE_SENS;
  // 시야각 하한이 -1.45rad(83.1°)이면 "발밑"을 쏴도 폭발 중심이 몸보다 7° 앞에 생겨
  // 방사형 밀어내기가 오히려 전진 속도를 2.1m/s 깎았다. 거의 수직까지 내려가게 해
  // 고전적인 로켓점프(수직 추진 + 전진 속도 유지)가 성립하도록 한다.
  sim.yaw+=e.movementX*sX; sim.pitch-=e.movementY*sX;
  sim.pitch=Math.max(-PITCH_LIM,Math.min(PITCH_LIM,sim.pitch)); });
window.addEventListener('keydown',function(e){
  // 채팅 입력 중에는 게임 조작이 먹지 않도록 완전히 차단
  if(chatting){
    if(e.key==='Enter'){ e.preventDefault(); closeChat(true); }
    else if(e.key==='Escape'){ closeChat(false); }
    return;
  }
  /* ESC 우선순위: 오버레이 → 메뉴 뒤로 → 일시정지 토글. 위에서 걸리면 아래는 안 본다.
     lobbyScr 은 MENU_SCREENS 에 없다 — 거기서 ESC 는 '뒤로'가 아니라 게임 안과 똑같은
     일시정지다(아래 openPause 로 떨어진다). 방을 나가는 건 그 메뉴 안에서 고른다. */
  if(e.key==='Escape'){
    if(OVERLAY){ e.preventDefault(); closeOverlay(true); return; }
    if(MENU_SCREENS[mode] && mode!=='title'){ e.preventDefault(); backScreen(); return; }
  }
  // 락이 이미 풀린 상태에서 누른 ESC 는 keydown 으로 들어온다 — 메뉴 토글로 쓴다
  if(e.key==='Escape' && inWorld()){ e.preventDefault();
    if(PAUSED) closePause(true); else openPause(); return; }
  if(PAUSED) return;                       // 멈춰 있는 동안은 게임 키가 전부 죽는다
  if(e.key==='Enter' && (mode==='play'||mode==='lobbyScr')){ e.preventDefault(); openChat(); return; }
  ensureAudio(); var k=e.key.toLowerCase(); keys[k]=true;
  if(k===' '){ jumpEdge=true; e.preventDefault(); } if(k==='r'&&sim)respawn(sim);
  if(k==='f'&&sim&&mode==='play') usePulse(sim);
  if(k==='v'&&sim)sim.tp=!sim.tp;
  if(k==='p'){ SHOW_COL=!SHOW_COL; toastCol(); }
});
window.addEventListener('keyup',function(e){ if(chatting) return; keys[e.key.toLowerCase()]=false; });

/* P — 콜리전 보기. '보이는 모양과 부딪히는 모양이 같은가'를 눈으로 확인하는 용도다.
   실제 판정에 쓰이는 것만 그린다:
     청록 = 조각의 삼각형(몸이 실제로 부딪히는 것)
     연두 = 이동 판정에 쓰이는 상자 — 박스 코스의 발판, 그리고 '평평한 한 장'으로
            치기로 한 바닥·바위 슬래브(PIECE_FLAT)
     주황 = 지금 무너지는 중인 고리
   조각마다 딸려 있는 _tri 상자는 광선(조준·폭발 가림) 전용이라 안 그린다 —
   예전엔 그걸 그리는 바람에 '아직 상자로 부딪히는구나'로 읽혔다. */
var SHOW_COL=false;
var colMsgT=0;
function toastCol(){
  roundBanner(SHOW_COL?'콜리전 보기 켬 — 청록=조각 삼각형 · 연두=상자 발판':'콜리전 보기 끔');
  clearTimeout(colMsgT); colMsgT=setTimeout(function(){ roundBanner(''); }, 1600);
}
/* 삼각형 수프 — 카메라 근처만. 피크가 4만 삼각형이라 전부 그리면 선이 12만 개다. */
var COL_TRI_R=26;
function colTris(cx,cy,cz){
  if(!TSOUP) return;
  var V=TSOUP.v, c=[0.25,0.95,0.85], R=COL_TRI_R;
  var cnt=triGather(cx-R,cy-R,cz-R, cx+R,cy+R,cz+R);
  for(var q=0;q<cnt;q++){
    var o=TCAND[q];
    for(var e=0;e<3;e++){
      var a=o+e*3, b2=o+((e+1)%3)*3;
      LINE.push(V[a],V[a+1],V[a+2], c[0],c[1],c[2], V[b2],V[b2+1],V[b2+2], c[0],c[1],c[2]);
    }
  }
}
function colWire(b){
  var c = b._fall ? [1,0.45,0.25] : (b._hide ? [0.25,0.95,0.85] : [0.55,1,0.45]);
  /* 2cm 부풀린다 — 보이는 발판은 이미 같은 자리에 검은 외곽선이 있어서, 딱 맞춰
     그리면 z-파이팅으로 묻혀 아무것도 안 보인다(실측: 협곡에서 초록 선 0픽셀). */
  var g=0.02;
  var x0=b.cx-b.hx-g,x1=b.cx+b.hx+g,y0=b.cy-b.hy-g,y1=b.cy+b.hy+g,z0=b.cz-b.hz-g,z1=b.cz+b.hz+g;
  var P8=[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],
          [x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]];
  var E=[0,1,1,2,2,3,3,0, 4,5,5,6,6,7,7,4, 0,4,1,5,2,6,3,7];
  for(var i=0;i<E.length;i+=2){ var a=P8[E[i]], d=P8[E[i+1]];
    LINE.push(a[0],a[1],a[2],c[0],c[1],c[2], d[0],d[1],d[2],c[0],c[1],c[2]); }
}
var last=0, acc=0, STEP=1/120, jumpBuf=0;
function loop(now){ if(!last)last=now; var dt=Math.min(0.05,(now-last)/1000); last=now;
  // 본선(play)과 대기방 연습(lobbyScr) 모두 물리를 돌린다 — 기다리는 동안 몸을 풀 수 있게
  if((mode==='play'||mode==='lobbyScr') && sim){
    // 점프 입력을 프레임이 아니라 시간으로 들고 있는다.
    // 예전엔 서브스텝이 한 번도 안 돈 프레임에서도 jumpEdge 를 지워버려서,
    // 화면 주사율이 시뮬(120Hz)보다 높으면 그 비율만큼 점프가 통째로 씹혔다
    // (144Hz 17% · 165Hz 27% · 240Hz 50%).
    if(jumpEdge){ jumpBuf=JUMP_BUF; jumpEdge=false; }
    /* 라운드 진행 — 경쟁 본선에서만. 정산 중에는 조작을 막는다(그 사이에 밀어붙여
       다음 라운드 시작 위치를 뺏는 걸 방지). 물리는 계속 돌려 몸이 자연스럽게 안착한다. */
    var vsLive = (GAMEMODE==='versus' && !sim.practice);
    if(vsLive){
      ROUND.t+=dt;
      collapseTick(dt);
      // 판이 바닥까지 무너지고 잠깐 지나면 새 판으로 갈아엎는다(조작은 안 멈춘다)
      var _C=LEVEL.collapse;
      if(_C && LEVEL._maxRing!=null &&
         LEVEL._maxRing-(LEVEL._gone||0) < (_C.keepRings||1) &&
         ROUND.t > _C.first + (LEVEL._gone||0)*_C.every + ARENA_HOLD) newArena();
      if(arenaMsgT>0 && (arenaMsgT-=dt)<=0) roundBanner('');
    }
    var frozen = PAUSED;
    if(!frozen) padTick(dt);               // 정산·일시정지 중에는 패드를 안 먹는다
    var inp = frozen ? {mf:false,mb:false,ml:false,mr:false,jump:false}
                     : { mf:keys['w'], mb:keys['s'], ml:keys['a'], mr:keys['d'], jump:false };
    if(frozen) jumpBuf=0;
    acc+=dt; var guard=0;
    // 솔로에서만 시간까지 멈춘다. 멀티는 다른 사람이 계속 뛰고 있어서 나 혼자
    // 시간을 세울 수 없다 — 메뉴를 열어둔 채로도 물리는 돌아간다(가만히 서 있는 셈).
    if(PAUSED && !MP.connected) acc=0;
    while(acc>=STEP && guard<12){
      inp.jump = jumpBuf>0;
      stepSim(sim,STEP, inp);
      if(sim.jumped) jumpBuf=0;             // 실제로 소비됐을 때만 비운다
      acc-=STEP; guard++;
    }
    if(jumpBuf>0) jumpBuf=Math.max(0, jumpBuf-dt);
    // 멀티: 내 상태 ~22Hz 전송 + 끊긴 피어 정리
    if(MP.connected && now-MP.lastSend>45){ MP.lastSend=now;
      mpSend({t:'st', name:MP.name, x:Math.round(sim.p.x*1000)/1000, y:Math.round(sim.p.y*1000)/1000, z:Math.round(sim.p.z*1000)/1000,
        yaw:Math.round(sim.yaw*1000)/1000, pitch:Math.round(sim.pitch*1000)/1000, rc:Math.round((sim.recoil||0)*100)/100}); }
    botStep(dt, now);            // 방장이 AI 참가자를 대신 굴린다
    for(var _pid in MP.peers){ if(now-(MP.peers[_pid].seen||0)>5000) delete MP.peers[_pid]; }
    // 경쟁: 내가 떨어졌으면 알리고 점수를 반영한다(떨어진 본인이 신고 → 양쪽 규칙이 같아 일치)
    if(vsLive && ROUND.phase==='live' && (sim.fell||0)>lastFell){
      lastFell=sim.fell;
      var _by=creditOf(sim);
      if(MP.connected) mpSend({t:'fell', by:_by});
      scoreFall(MP.id!=null?MP.id:-1, _by);
    }
    // HUD — 모드·상황마다 보여야 하는 게 다르다(아래 renderHud 참고)
    renderHud(sim, vsLive);
    renderItems(sim);
    renderAmmo(sim.ammo, sim.ammo<AMMO_MAX ? sim.ammoT/AMMO_REGEN : 0);
    if(sim.win){ renderWin(sim); showScreen('win'); sndWin(); if(locked)document.exitPointerLock(); }
    if(mode==='play') showHint(sim); else showHint(null);
  }
  render(dt);
  // 조준점은 표시용이므로 실패해도 루프를 멈추면 안 된다(예전에 여기서 게임이 얼었다)
  if((mode==='play'||mode==='lobbyScr') && sim){ try{ updateCrosshair(sim); }catch(e){} }
  requestAnimationFrame(loop);
}
/* ---------- HUD ----------
   예전엔 칩 두 개에 문자열로 욱여넣어서 경쟁 화면의 시간 칩이 'R3  붕괴 4.2' 가 됐다 —
   라운드 번호·라벨·카운트다운 셋이 한 덩어리라 읽으려면 파싱을 해야 했다.
   지금은 자리마다 하나씩 맡는다: 큰 숫자 / 붕괴 막대 / 사람별 점수 칩.
   매 프레임 DOM 을 건드리지 않도록 renderItems 처럼 서명을 비교한다. */
var HUD_SIG={};
function hudSet(el, txt){ if(el && HUD_SIG[el.id]!==txt){ HUD_SIG[el.id]=txt; el.textContent=txt; } }
function renderHud(s, vsLive){
  var C=LEVEL.collapse, bar=document.getElementById('collapseBar');

  // 큰 숫자 — 연습이면 안내, 경쟁이면 라운드 경과, 협동이면 기록
  if(s.practice){ hudSet(document.getElementById('timeV'),'자유 연습'); hudSet(document.getElementById('timeU'),''); }
  else { hudSet(document.getElementById('timeV'), s.t.toFixed(1)); hudSet(document.getElementById('timeU'),'초'); }

  /* 붕괴까지 남은 시간은 숫자로 읽는 게 아니라 막대가 차오르는 걸 곁눈으로 본다.
     교전 중에 소수점 한 자리를 읽고 있을 여유가 없다. */
  var showBar = !!(vsLive && C && LEVEL._maxRing-LEVEL._gone>=1);
  bar.classList.toggle('on', showBar);
  if(showBar){
    var span=C.every || 1, left=(C.first+LEVEL._gone*C.every)-ROUND.t;
    if(LEVEL._gone===0) span=C.first || 1;
    var f=Math.max(0,Math.min(1, 1-left/span));
    bar.firstChild.style.width=(f*100).toFixed(1)+'%';
    bar.classList.toggle('warn', left<=(C.warn||1.5));
  }

  // 점수 — 사람마다 칩 하나. 색은 그 사람 몸 색이라 화면 속 캐릭터와 바로 이어진다
  var row=document.getElementById('scoreRow');
  if(!vsLive || s.practice){ if(HUD_SIG.scoreRow!==''){ HUD_SIG.scoreRow=''; row.innerHTML=''; } return; }
  var ps = MP.players.length ? MP.players : [{id:MP.id, name:MP.name}];
  var sig = 'R'+ROUND.n+'|'+ps.map(function(p){ return p.id+':'+(SCORES[p.id]||0)+':'+(p.name||''); }).join(',');
  if(HUD_SIG.scoreRow===sig) return;
  HUD_SIG.scoreRow=sig;
  row.innerHTML='';
  ps.slice().sort(function(a,b){ return (SCORES[b.id]||0)-(SCORES[a.id]||0); }).forEach(function(p){
    var d=document.createElement('div'); d.className='sc'+(p.id===MP.id?' me':'');
    d.style.setProperty('--c', peerCol(p.id));
    d.innerHTML='<s></s>'+esc(p.name||nameOf(p.id))+' <b>'+(SCORES[p.id]||0)+'</b>';
    row.appendChild(d);
  });
}
// 그 사람 몸 색 — 나는 내가 고른 색, 남은 서버가 알려준 색(없으면 회색)
function peerCol(id){
  if(id===MP.id) return PLAYER_COL;
  var pr=MP.peers[id]; return (pr&&pr.col) || '#8492ad';
}
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// 탄창 게이지. frac = 다음 한 발의 충전 진행도(0~1) → 그 칸만 아래에서 위로 차오른다.
function renderAmmo(n, frac){
  var el=document.getElementById('ammo');
  if(el.children.length!==AMMO_MAX){ el.innerHTML='';
    for(var i=0;i<AMMO_MAX;i++){ var d=document.createElement('div'); d.className='p';
      d.appendChild(document.createElement('i')); el.appendChild(d); } }
  for(var i=0;i<AMMO_MAX;i++){
    var slot=el.children[i], full=(i<n), charging=(!full && i===n);
    slot.classList.toggle('on', full);
    slot.classList.toggle('charging', charging);
    slot.firstChild.style.height = charging ? (Math.max(0,Math.min(1,frac))*100).toFixed(1)+'%' : '0%';
  }
}
/* ---------- 키 아이콘 ----------
   Kenney Input Prompts Pixel(CC0) 타일맵의 16px 칸을 스프라이트로 쓴다.
   값은 타일 번호(34칸/줄). 두 칸짜리 넓은 키는 [번호, 2] 로 적는다.
   구운 타일맵이 없으면 예전처럼 글자 <kbd> 로 떨어진다. */
var KEYTILE={
  w:86, a:120, s:121, d:122, r:88, v:158, f:123, p:94,
  esc:17, enter:[134,2], space:[236,2], shift:[255,2], tab:[189,2], ctrl:[221,2],
  lmb:77, rmb:78, wheel:79
};
var KEYTEXT={ w:'W', a:'A', s:'S', d:'D', r:'R', v:'V', f:'F', p:'P',
  esc:'Esc', enter:'Enter', space:'Space', shift:'Shift', tab:'Tab', ctrl:'Ctrl',
  lmb:'좌클릭', rmb:'우클릭', wheel:'휠' };
function keyHTML(k){
  var t=KEYTILE[k];
  if(!window.UI_KEYS || t==null) return '<kbd>'+(KEYTEXT[k]||k)+'</kbd>';
  var wide = (t instanceof Array); if(wide) t=t[0];
  var col=t%34, row=Math.floor(t/34);
  return '<i class="key'+(wide?' w2':'')+'" title="'+(KEYTEXT[k]||k)+'"'
       + ' style="background-position:-'+(col*32)+'px -'+(row*32)+'px"></i>';
}
function keysHTML(){ var o=''; for(var i=0;i<arguments.length;i++) o+=keyHTML(arguments[i]); return o; }
// 일시정지의 조작법 표. 키 아이콘이 준비된 뒤에 만들어야 해서 열 때마다 짓는다.
var KEYHELP=[
  [['w','a','s','d'],'이동'], [['space'],'점프'],
  [['lmb'],'펑!'],            [['rmb'],'조준'],
  [['r'],'리스폰'],           [['v'],'시점 전환'],
  [['enter'],'채팅'],         [['esc'],'일시정지']
];
function buildKeyHelp(){
  var h=document.getElementById('keyhelp'); if(!h) return;
  h.innerHTML = KEYHELP.map(function(e){
    return '<div>'+e[0].map(keyHTML).join('')+'<span>'+e[1]+'</span></div>';
  }).join('');
}
/* 대기방 연습장 안내 — 딱 두 가지만. 마우스를 어떻게 잡고 어떻게 놓는가.
   나머지 조작은 잡은 다음 ESC 로 열리는 일시정지 화면이 전부 보여준다. */

function renderVsWin(bestId){

  var t=document.getElementById('vsWinTitle');
  t.textContent = win ? 'WIN' : 'LOSE';
  t.style.color = win ? 'var(--you)' : '#fff';
  var w=document.getElementById('vsWinWho');

  var ul=document.getElementById('vsList'); ul.innerHTML='';

    (LEVEL.name||CURLEVEL)+' · '+ROUND.n+'라운드 · 선취 '+VS_WIN;

            한글은 매칭이 안 되어 Pretendard 로 자연히 떨어진다.
   · 키 타일맵 — 16px 픽셀아트라 정수배(×2)로만 키우고 보간을 끈다.
   · 패널 — 64px 스프라이트를 16px 로 잘라 9-slice 로 늘린다. 모서리 16칸 안에
            나사가 들어 있어서, 상자가 아무리 커져도 나사는 안 늘어난다.
   · 커서 — 메뉴 전체에 화살표, 누를 수 있는 것 위에서만 점 붙은 화살표.
            OS 손가락 커서로 갈아타면 그 순간만 윈도우 커서가 튀어나온다. */
(function(){
  var css='';
  if(window.UI_FONT)
    css+='@font-face{font-family:"KenneyFuture";src:url('+UI_FONT+') format("truetype");'
        +'font-display:swap;unicode-range:U+0020-007E}';
  if(window.UI_KEYS)
    css+='.key{background-image:url('+UI_KEYS+')}'
        +'.key{display:inline-block;vertical-align:-7px;width:32px;height:32px;'
        +'background-size:1088px 768px;image-rendering:pixelated;margin:0 1px}'
        +'.key.w2{width:64px}';
  if(window.UI_PANEL)
    css+='.panel9{background:none;border:16px solid transparent;'
        +'border-image:url('+UI_PANEL+') 16 fill / 16px stretch}'
        +'.panel9.tight{border-width:11px;border-image-width:11px}';
  if(window.UI_CURSOR){
    var hot=' 0 0, default', pt=window.UI_CURSOR2||window.UI_CURSOR;
    css+='.screen,#pause{cursor:url('+UI_CURSOR+')'+hot+'}'
        +'.screen button,.screen a,.screen input,.screen label,.mapCard,'
        +'#pause button{cursor:url('+pt+')'+hot+'}'
        +'.screen button:disabled,.mapCard:disabled{cursor:url('+UI_CURSOR+')'+hot+'}';
  }
  if(!css) return;
  var st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);
})();
layout(); requestAnimationFrame(loop);

/* ---------- 검증 노출 ---------- */
window.__peng={ makeSim:makeSim, stepSim:stepSim, doFire:doFire,
  // LEVEL 은 맵을 바꾸면 교체되므로 값이 아니라 게터로 낸다(예전처럼 고정해두면 낡은 맵을 가리킨다).
  get LEVEL(){ return LEVEL; },
  setLevel:setLevel, get level(){ return CURLEVEL; }, levels:function(){ return PENG.order.slice(); },
  get sim(){ return sim; }, get MP(){ return MP; },   // 실시간 검증용(멀티 상호작용 확인)
  // 중력 렌즈 검증용: 이번 프레임에 실제로 화면을 휘게 한 왜곡원 목록
  get lenses(){ return lensList; }, get round(){ return ROUND; },
  get pads(){ return PADS; }, get items(){ return ITEMS; },   // 아이템 패드 검증용
  get cam(){ return CAMPOS; }, get camLen(){ return CAM_LEN; },   // 3인칭 카메라 충돌 검증용
  get matchSeed(){ return MATCH_SEED; }, get floorSeed(){ return FLOOR_SEED; },  // 절차 생성 검증용
  get bots(){ return BOTS; },        // AI 검증용
  get station(){ return STATION; }, buildStation:buildStation,   // 정거장 검증용
  pieceBoxes:pieceBoxes,             // 조각 모양 → 충돌 박스(검증용)
  get vertCount(){ return TRI.length/6; },  // 이번 프레임에 쌓인 정점 수(렌더 검증용)
  // 프레임 강제 실행 — 검증 환경(탭이 숨겨진 상태)에선 rAF 가 멈춰 렌더가 안 돈다
  frame:function(now){ loop(now!=null?now:performance.now()); },
  // 협동 기믹 검증용 — 리프트 샷(방사형 vs 순수 상승)과 연동 압력판의 켜짐 상태
  applyBlast:applyBlast, respawn:respawn, updateLinks:updateLinks,
  get LINK_ON(){ return LINK_ON; }, boxSolid:boxSolid,
  get MARKS(){ return MARKS; },     // 협동 관문 표식(맵마다 다시 만들어지므로 게터로)
  // 화면 전환 검증용 — 스크린은 mode 를 바꾸고, 오버레이는 안 바꾼다(그게 핵심이라 둘 다 낸다)
  showScreen:showScreen, goScreen:goScreen, backScreen:backScreen,
  openOverlay:openOverlay, closeOverlay:closeOverlay,
  get mode(){ return mode; }, get overlay(){ return OVERLAY; }, get paused(){ return PAUSED; },
  get SCORES(){ return SCORES; }, scoreFall:scoreFall,   // 경쟁 점수·결과 화면 검증용
  /* 조작 불능 진단 — 이 자리에서 몸 상자와 실제로 겹치는 삼각형들.
     콜리전 보기(P)는 상자만 그리는데 몸을 막는 건 삼각형이라, 눈으로는 안 보인다. */
  probeTris:function(px,py,pz){
    if(!TSOUP) return [];
    var qx0=px-PH_HX,qx1=px+PH_HX,qz0=pz-PH_HZ,qz1=pz+PH_HZ, cyB=py+PH_HY;
    var cnt=triGather(qx0,py,qz0,qx1,py+2*PH_HY,qz1), out=[];
    for(var q=0;q<cnt;q++){ var o=TCAND[q];
      if(!boxTri(px,cyB,pz,PH_HX,PH_HY,PH_HZ,TSOUP.v,o)) continue;
      out.push({ ny:Math.round(triNy(TSOUP.v,o)*1000)/1000,
                 top:surfY(TSOUP.v,o,qx0,qx1,qz0,qz1,true),
                 bot:surfY(TSOUP.v,o,qx0,qx1,qz0,qz1,false) });
    }
    return out;
  },
  get SLOPE_MAX(){ return SLOPE_MAX; }, get STEP_H(){ return STEP_H; },
  hasNaN:function(s){ return !isFinite(s.p.x)||!isFinite(s.p.y)||!isFinite(s.p.z); },
  // 시나리오 실행: inputs=배열 of {dt,steps,inp,yaw,pitch,fire}
  run:function(script){ var s=makeSim();
    for(var i=0;i<script.length;i++){ var seg=script[i];
      if(seg.yaw!=null)s.yaw=seg.yaw; if(seg.pitch!=null)s.pitch=seg.pitch;
      if(seg.tp){ s.p={x:seg.tp.x,y:seg.tp.y,z:seg.tp.z}; s.v={x:0,y:0,z:0}; s.onGround=true; s.cpIdx=seg.cp!=null?seg.cp:s.cpIdx; }
      var steps=seg.steps||1;
      for(var f=0;f<steps;f++){ if(seg.fire&&f===0)doFire(s); stepSim(s,1/120, seg.inp||{}); if(s.win)break; }
      if(s.win)break;
    }
    return { win:s.win, p:{x:Math.round(s.p.x*10)/10,y:Math.round(s.p.y*10)/10,z:Math.round(s.p.z*10)/10}, t:Math.round(s.t*100)/100, cp:s.cpIdx, nan:this.hasNaN(s) }; } };
})();
</script>
